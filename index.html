{q:'Why can a set of only 2 vectors never serve as a basis for the 3-dimensional space E³?', options:['Because 2 vectors, at most, can only span a plane (or a line) through the origin, never all of the 3-dimensional space, regardless of whether they are independent','Because 2 is an even number','Because basis vectors must always come in groups of 3','Because 2 vectors are always linearly dependent'], correct:0, exp:'Even two perfectly independent vectors only span a 2-dimensional subspace (a plane) sitting inside the larger 3-dimensional space — they simply do not reach every direction that a genuine 3D space requires. Since Eⁿ needs at least n generators (n=3 here), no set of fewer than 3 vectors, independent or not, can possibly be a basis for E³.'}
]},
{ id:'t8', unit:'Unit 9 · Linear Spaces II', title:'9.2 Systems of Equations as Matrix Equations', notes: `
<p>Unit 8 dealt with single vectors and pairs of vectors. Unit 9 opens by connecting vectors to matrices, using the most practical bridge there is: a system of simultaneous linear equations.</p>
<p>Take a system of m linear equations in n unknowns x1, x2, ..., xn:</p>
<div class="formula-box">a11x1 + a12x2 + ... + a1nxn = d1<br>a21x1 + a22x2 + ... + a2nxn = d2<br>⋮<br>am1x1 + am2x2 + ... + amnxn = dm</div>
<p>There are three distinct ingredients tangled together in that system: the coefficients aij, the unknowns x1...xn, and the constants d1...dm on the right-hand side. Once you separate those three ingredients into their own rectangular arrays — an m×n matrix A of coefficients, an n×1 column vector X of unknowns, and an m×1 column vector d of constants — the entire system collapses into a single, compact matrix equation:</p>
<div class="formula-box">AX = d</div>
<p>This is not a different problem from the original system — it is exactly the same information, just repackaged so that the tools of matrix algebra (the subject of the rest of this unit) can be brought to bear on it.</p>
<div class="worked"><div class="label">Worked example</div>The system 6x1+3x2+x3=22, x1+4x2-2x3=12, 4x1-x2+5x3=10 has three equations in three unknowns, so A is 3×3, X is 3×1, and d is 3×1:
[[6,3,1],[1,4,-2],[4,-1,5]] · [x1,x2,x3]ᵀ = [22,12,10]ᵀ. Reading the matrix A back into equations recovers exactly the original system — row i of A, dotted with X, reproduces equation i.</div>
<p>Two dimension checks are worth internalizing early, because they come up constantly later: A has one row for every equation and one column for every unknown, so an m-equation, n-unknown system always gives an m×n coefficient matrix, an n×1 unknown vector, and an m×1 constant vector. When m=n (as many equations as unknowns, the case this unit focuses on), A is square — and a square coefficient matrix is exactly the setting where the rest of this unit's machinery, eigenvalues and eigenvectors, becomes meaningful.</p>
`,
questions:[
{q:'A system of linear equations has 4 equations and 3 unknowns. What are the dimensions of the coefficient matrix A in the matrix equation AX=d?', options:['3×4','4×3','4×4','3×3'], correct:1, exp:'The coefficient matrix has one row per equation and one column per unknown, so 4 equations and 3 unknowns give a 4×3 matrix A. This convention — rows for equations, columns for variables — is what makes the matrix multiplication AX work out correctly to reproduce every equation in the original system.'},
{q:'In the matrix equation AX = d representing a system of m equations in n unknowns, what are the dimensions of X and d respectively?', options:['X is n×1, d is m×1','X is m×1, d is n×1','X is n×n, d is m×1','X is 1×n, d is 1×m'], correct:0, exp:'X collects the n unknowns as a column vector, so X is n×1. d collects the m constant terms (the right-hand sides of the m equations), so d is m×1. These dimensions are exactly what make AX (an m×n matrix times an n×1 vector) produce a valid m×1 result that can be set equal to d.'},
{q:'What are the three distinct ingredients that get separated out when converting a system of linear equations into the matrix form AX=d?', options:['The coefficients, the unknowns, and the constant terms','Only the coefficients and the unknowns','The equations, the solutions, and the graphs','The rows, the columns, and the determinant'], correct:0, exp:'The notes identify exactly three sets of elements tangled together in a written-out system: the coefficients aij (which become matrix A), the variables x1...xn (which become vector X), and the constants d1...dm on the right-hand side (which become vector d). Separating these three into their own arrays is precisely what produces the compact form AX=d.'},
{q:'Write the system 2x1 - x2 = 7, 3x1 + 4x2 = 5 in matrix form AX=d. What is A?', options:['[[2,-1],[3,4]]','[[2,3],[-1,4]]','[[7,5],[2,-1]]','[[2,-1,7],[3,4,5]]'], correct:0, exp:'Reading off each equation\'s coefficients row by row: row 1 comes from 2x1 - x2 = 7, giving [2, -1]; row 2 comes from 3x1 + 4x2 = 5, giving [3, 4]. Stacking these rows gives A = [[2,-1],[3,4]]. The constants 7 and 5 belong in d, not in A — a common point of confusion is including the right-hand side inside the coefficient matrix, which is only correct for an "augmented matrix," a different object.'},
{q:'For the system in the previous question (2x1-x2=7, 3x1+4x2=5), what is the constant vector d?', options:['[7, 5]ᵀ','[2, 3]ᵀ','[-1, 4]ᵀ','[2, -1, 3, 4]ᵀ'], correct:0, exp:'d simply collects the right-hand-side constants of each equation, in order: the first equation ends in 7, the second in 5, so d = [7, 5]ᵀ (written as a column vector). The coefficients of the unknowns never belong in d — they belong in A.'},
{q:'Why does converting a system of equations into the matrix form AX=d not change the underlying problem, only the packaging?', options:['Because matrix notation is purely decorative and mathematically meaningless','Because A, X, and d, when multiplied out, reproduce exactly the same m individual equations you started with — row i of A dotted with X gives exactly equation i','Because AX=d is always easier to solve regardless of the matrix involved','Because matrix form only works for systems with exactly two equations'], correct:1, exp:'Multiplying out AX row by row exactly regenerates the original system: the dot product of row i of A with the vector X reproduces the left-hand side of equation i, which the equation d then sets equal to. Nothing about the problem itself changes — the reformulation just makes it possible to apply matrix algebra tools (like the eigenvalue machinery developed later in this unit) to a problem that started out as ordinary simultaneous equations.'},
{q:'A system has an equal number of equations and unknowns (m = n). What special property does this give the coefficient matrix A?', options:['A becomes symmetric automatically','A becomes a square matrix, which is a necessary setting for the eigenvalue and eigenvector concepts developed later in this unit','A becomes the identity matrix','A becomes singular automatically'], correct:1, exp:'When the number of equations equals the number of unknowns, A has the same number of rows as columns — it is square. Square matrices are exactly the setting in which the characteristic equation, eigenvalues, and eigenvectors (the central topics of the rest of this unit) are defined, since only a square matrix can be compared meaningfully to λI in the expression A − λI.'},
{q:'In a machine learning context, a linear regression model with n features and no intercept can be written as Xβ = y, where X is the design matrix of feature values, β is the vector of unknown coefficients, and y is the vector of observed outcomes. Which piece of the AX=d framework from this section does the design matrix X play the role of?', options:['The unknown vector, since X contains numbers','The coefficient matrix A, since it holds the known feature values that multiply the unknown coefficients β','The constant vector d, since it comes from the data','None of the pieces — regression is unrelated to this framework'], correct:1, exp:'In Xβ=y, the design matrix X (confusingly using the letter X for a matrix rather than the unknown vector) plays the same structural role as A in AX=d: it holds the known coefficients that multiply the unknowns. β plays the role of the unknown vector, and y plays the role of the constant vector d. This is exactly the AX=d template from this section, just relabeled for a statistics context.'},
{q:'A hospital pharmacy needs to prepare three IV solutions by mixing amounts of two stock concentrates, where each solution has a required total concentration constraint, giving 3 linear equations in the 2 unknown mixing amounts. What are the dimensions of the resulting coefficient matrix A?', options:['2×3','3×2','3×3','2×2'], correct:1, exp:'Three equations (one per required solution) and two unknowns (the two mixing amounts) give a 3×2 coefficient matrix — three rows for the three constraints, two columns for the two unknowns being solved for. This is a direct real-world instance of an m-equation, n-unknown system with m ≠ n, which is common whenever there are more constraints than free variables.'},
{q:'Given the matrix equation [[1,2],[3,4]]·[x1,x2]ᵀ = [5,6]ᵀ, which pair of original equations does this represent?', options:['x1+2x2=5 and 3x1+4x2=6','x1+3x2=5 and 2x1+4x2=6','5x1+6x2=1 and 5x1+6x2=2','x1+2x2=6 and 3x1+4x2=5'], correct:0, exp:'Reading the matrix multiplication out row by row: row 1 of A dotted with X gives 1·x1+2·x2, set equal to the first entry of d, which is 5, giving x1+2x2=5. Row 2 gives 3·x1+4·x2=6. This is simply unpacking AX=d back into the original system it was built from.'}
]},

{ id:'t9', unit:'Unit 9 · Linear Spaces II', title:'9.3.1–9.3.2 Eigenvalues and the Characteristic Equation', notes: `
<p>Here is a question that shows up constantly in applications: given a square matrix A, is there a nonzero vector x that A merely stretches or shrinks, without rotating it off its own line? In symbols, does there exist x ≠ 0 and a scalar λ satisfying:</p>
<div class="formula-box">Ax = λx</div>
<p>This is called the <strong>characteristic value problem</strong>. When such an x exists, applying A to it produces something parallel to x itself — the matrix acts on that particular direction like ordinary scalar multiplication. The scalar λ is called the <strong>characteristic value</strong> (equivalently, <strong>eigenvalue</strong> or <strong>proper value</strong>), and x is called the <strong>characteristic vector</strong> (equivalently, <strong>eigenvector</strong>) that goes with it.</p>
<h4>Finding the eigenvalues</h4>
<p>Rewriting Ax=λx as (A−λI)x=0 turns the problem into a homogeneous system. A homogeneous system has a nonzero solution precisely when the coefficient matrix is singular — that is, when its determinant vanishes:</p>
<div class="formula-box">det(A − λI) = 0</div>
<p>This is called the <strong>characteristic equation</strong> of A, and its left-hand side, expanded out, is a degree-n polynomial in λ (where A is n×n) called the <strong>characteristic polynomial</strong>. For a 2×2 matrix, expanding the determinant gives λ² − λ(a11+a22) + (a11a22−a12a21) = 0, a quadratic in λ.</p>
<div class="worked"><div class="label">Worked example</div>For A = [[3,1],[1,3]], the characteristic equation is (3−λ)(3−λ) − 1 = 0, which simplifies to λ²−6λ+8=0, factoring as (λ−4)(λ−2)=0. So the eigenvalues are λ=4 and λ=2. Since A is 2×2, exactly two roots turn up, matching the degree of the characteristic polynomial.</div>
<p>In general, an n×n matrix has a characteristic polynomial of degree n, giving n roots — which may be real or complex, distinct or repeated, and zero or nonzero, depending on the matrix.</p>
<h4>Sum and product of the roots</h4>
<p>Writing the characteristic polynomial as c0λⁿ + c1λⁿ⁻¹ + ... + cn = 0 (with c0=1), two coefficients have especially clean interpretations: c1 = −(sum of the diagonal entries of A), and cn = (−1)ⁿ times the determinant of A. Working through the algebra of polynomial roots, this translates into two of the most useful facts in this whole unit:</p>
<div class="formula-box">λ1 + λ2 + ... + λn = Trace(A) = a11+a22+...+ann<br>λ1 × λ2 × ... × λn = |A| (the determinant of A)</div>
<p>These give you a fast sanity check on any eigenvalue computation: for the worked example above, 4+2=6, which matches Trace(A)=3+3=6, and 4×2=8, which matches |A|=9−1=8.</p>
<h4>Five properties worth knowing cold</h4>
<div class="formula-box">
(i) If A is singular (|A|=0), at least one eigenvalue of A is zero.<br>
(ii) If A is symmetric, every eigenvalue is real — a real symmetric matrix cannot have complex eigenvalues.<br>
(iii) If A is non-singular with eigenvalues λ1,...,λn, then A⁻¹ has eigenvalues 1/λ1,...,1/λn.<br>
(iv) The eigenvalues of a diagonal or triangular matrix are simply its diagonal entries.<br>
(v) If A has eigenvalues λ1,...,λn and k is an integer, then Aᵏ has eigenvalues λ1ᵏ,...,λnᵏ.
</div>
`,
questions:[
{q:'The characteristic value problem asks for a scalar λ and a nonzero vector x satisfying which equation?', options:['Ax = λx','A + x = λ','Ax = x + λ','A = λx'], correct:0, exp:'Ax=λx is the defining equation of the characteristic value (eigenvalue) problem: applying the matrix A to the vector x produces a result that is simply a scalar multiple of x itself, meaning A does not rotate x off the line it lies on, only stretches, shrinks, or reverses it.'},
{q:'In the equation Ax=λx, what names are given to λ and to x respectively?', options:['λ is the eigenvector, x is the eigenvalue','λ is the characteristic value (eigenvalue/proper value), x is the characteristic vector (eigenvector)','λ is the determinant, x is the trace','Both λ and x are called eigenvalues'], correct:1, exp:'λ is the scalar and is called the characteristic value, eigenvalue, or proper value — all three terms are used interchangeably. x is the nonzero vector and is called the characteristic vector or eigenvector. Mixing these two names up is an extremely common source of confusion, so it is worth fixing the pairing firmly: λ is a number, x is a vector.'},
{q:'Rewriting Ax=λx as (A−λI)x=0 turns the eigenvalue problem into what kind of system?', options:['An inhomogeneous system with a unique solution','A homogeneous system, which has a nonzero solution precisely when its coefficient matrix is singular','A system with no solutions','A nonlinear system'], correct:1, exp:'(A−λI)x=0 is homogeneous because the right-hand side is the null vector. A homogeneous system always has the trivial solution x=0, but it has a nonzero solution — which is what the eigenvalue problem actually needs — exactly when the coefficient matrix A−λI is singular, i.e. has determinant zero. That singularity condition is what produces the characteristic equation.'},
{q:'What is the characteristic equation of a square matrix A?', options:['det(A) = 0','det(A − λI) = 0','trace(A) = λ','A = λI'], correct:1, exp:'The characteristic equation is det(A−λI)=0, obtained by requiring the coefficient matrix of the homogeneous system (A−λI)x=0 to be singular. Its left-hand side, expanded, is a polynomial in λ of degree n (for an n×n matrix), called the characteristic polynomial.'},
{q:'For an n×n matrix A, how many roots does the characteristic equation have, counted with multiplicity, and what can be said about those roots in general?', options:['Exactly n roots, and they must all be real and distinct','Exactly n roots, which may be real or complex, distinct or repeated, and zero or nonzero','Always exactly 2 roots regardless of n','A variable number of roots depending on the entries of A'], correct:1, exp:'The characteristic polynomial has degree n, so it has exactly n roots (over the complex numbers, counted with multiplicity), but nothing in general guarantees those roots are real, distinct, or nonzero — all of those properties depend on the specific matrix. Special structure, like symmetry, can force extra guarantees (property ii below), but a generic square matrix offers no such promise.'},
{q:'Find the characteristic equation of A = [[3,1],[1,3]].', options:['λ² − 6λ + 8 = 0','λ² − 6λ + 9 = 0','λ² + 6λ + 8 = 0','λ² − 3λ + 8 = 0'], correct:0, exp:'det(A−λI) = (3−λ)(3−λ) − (1)(1) = (9 − 6λ + λ²) − 1 = λ² − 6λ + 8. Setting this equal to zero gives the characteristic equation λ² − 6λ + 8 = 0, matching the pattern λ² − λ(trace) + det for a 2×2 matrix, since trace=6 and det=8.'},
{q:'Solve the characteristic equation λ² − 6λ + 8 = 0 for the eigenvalues of A = [[3,1],[1,3]].', options:['λ = 4, 2','λ = 6, 8','λ = 3, 3','λ = -2, -4'], correct:0, exp:'Factoring λ²−6λ+8 gives (λ−4)(λ−2)=0, so λ=4 or λ=2. Checking against the shortcut formulas: 4+2=6 should equal Trace(A)=3+3=6 ✓, and 4×2=8 should equal |A|=9−1=8 ✓. Both checks pass, confirming the eigenvalues.'},
{q:'For a matrix with eigenvalues λ1=5 and λ2=-2, what must Trace(A) and |A| equal?', options:['Trace(A)=3, |A|=-10','Trace(A)=-10, |A|=3','Trace(A)=7, |A|=10','Trace(A)=3, |A|=10'], correct:0, exp:'Trace(A) equals the sum of the eigenvalues: 5+(-2)=3. |A| equals the product of the eigenvalues: 5×(-2)=-10. These two shortcut formulas let you verify a computed pair of eigenvalues instantly, without re-expanding the full characteristic polynomial from scratch.'},
{q:'A 3×3 matrix has eigenvalues 0, 4, and -1. What is |A| (the determinant of A)?', options:['3','0','-4','5'], correct:1, exp:'The product of all eigenvalues equals the determinant: 0 × 4 × (-1) = 0. Whenever an eigenvalue is exactly zero, the determinant is automatically zero too, since zero multiplied into any product collapses the whole product to zero — this is also exactly property (i): a singular matrix (|A|=0) always has at least one zero eigenvalue.'},
{q:'A matrix A is known to be singular, meaning |A|=0. What must be true about at least one of its eigenvalues?', options:['At least one eigenvalue must be zero','All eigenvalues must be zero','At least one eigenvalue must be negative','No eigenvalue can be zero'], correct:0, exp:'Since the product of all the eigenvalues equals |A|, and |A|=0 for a singular matrix, at least one factor in that product must be zero — otherwise the product of nonzero numbers could never come out to zero. This is property (i) from the notes, and it runs both directions: a zero eigenvalue also always makes the matrix singular.'},
{q:'A is a real, symmetric matrix. What guarantee does property (ii) give about its eigenvalues?', options:['All eigenvalues are positive','All eigenvalues are real numbers — a real symmetric matrix cannot have complex eigenvalues','All eigenvalues are equal to each other','All eigenvalues are integers'], correct:1, exp:'Property (ii) guarantees realness, not positivity, equality, or integer-ness. A general square matrix can have complex eigenvalues (arising in conjugate pairs), but the extra structure of symmetry rules that out entirely — every eigenvalue of a real symmetric matrix is guaranteed real. This becomes especially important later, in the definiteness tests for quadratic forms, which are built from symmetric matrices.'},
{q:'A non-singular matrix A has eigenvalues 2, -4, and 1/2. What are the eigenvalues of A⁻¹?', options:['1/2, -1/4, 2','2, -4, 1/2 (unchanged)','-2, 4, -1/2','4, -8, 1'], correct:0, exp:'Property (iii) states that if A has eigenvalues λ1,...,λn, then A⁻¹ has eigenvalues 1/λ1,...,1/λn. Taking the reciprocal of each: 1/2, 1/(-4)=-1/4, and 1/(1/2)=2. This only works when A is non-singular, since a singular matrix (with a zero eigenvalue) has no inverse in the first place — you cannot take 1/0.'},
{q:'What are the eigenvalues of the diagonal matrix D = [[5,0,0],[0,-3,0],[0,0,7]]?', options:['5, -3, 7 — exactly the diagonal entries','15, since that is the trace','105, since that is the determinant','Cannot be determined without solving the characteristic equation'], correct:0, exp:'Property (iv) states that the eigenvalues of a diagonal (or triangular) matrix are simply its diagonal entries, with no further calculation needed. This makes sense from the characteristic equation directly: det(D−λI) for a diagonal matrix is just the product (5−λ)(−3−λ)(7−λ), whose roots are obviously λ=5, -3, 7.'},
{q:'A matrix A has eigenvalues 2 and -1. What are the eigenvalues of A³?', options:['8 and -1','8 and -1, since 2³=8 and (-1)³=-1','6 and -3, since eigenvalues of a power are k times the original','2 and -1, unchanged by taking powers'], correct:1, exp:'Property (v) states that if A has eigenvalues λ1,...,λn, then Aᵏ has eigenvalues λ1ᵏ,...,λnᵏ — the eigenvalues get raised to the same power, not multiplied by it. So A³ has eigenvalues 2³=8 and (-1)³=-1.'},
{q:'In epidemiology, compartmental disease models (such as the SIR model) compute the basic reproduction number R0 as the dominant eigenvalue of a "next-generation matrix" that describes how infections spread between population compartments. If that dominant eigenvalue is less than 1, what does the theory of eigenvalue-driven dynamics suggest about the outbreak?', options:['The outbreak will grow exponentially without bound','The outbreak will tend to die out, since a dominant eigenvalue below 1 means the underlying growth process shrinks over successive generations of infection rather than amplifying','Eigenvalues have no bearing on epidemic modeling in practice','R0 has nothing to do with eigenvalues, that is only a coincidence of terminology'], correct:1, exp:'This is a genuine, widely used piece of mathematical epidemiology: R0 is literally defined and computed as the dominant (largest-magnitude) eigenvalue of the next-generation matrix, which tracks how many new infections one generation produces in each compartment. A dominant eigenvalue below 1 means each generation of infection is smaller than the last — matching the intuitive threshold for an outbreak to fade rather than take off, and it is exactly the same "Ax=λx repeatedly applied" logic that makes eigenvalues govern long-run growth or decay throughout linear algebra.'},
{q:'In a two-compartment pharmacokinetic model (e.g. drug concentration in blood plasma and in tissue), the rates of change are governed by a matrix whose eigenvalues determine how fast each exponential decay component of the drug concentration curve fades. If the matrix has eigenvalues -0.05 and -0.9, what does this predict about the shape of the concentration-over-time curve?', options:['The concentration will increase without bound over time','The concentration will decay as a combination of two exponential terms, one decaying quickly (rate 0.9) and one decaying slowly (rate 0.05), producing the classic fast-then-slow "biphasic" elimination curve seen in real pharmacokinetics','The concentration will oscillate periodically forever','Eigenvalues only apply to single-compartment models, not multi-compartment ones'], correct:1, exp:'In linear compartmental models, each eigenvalue of the rate matrix contributes its own exponential term (e^(λt)) to the overall solution, and negative eigenvalues correspond to decay. Two distinct negative eigenvalues, -0.05 and -0.9, produce two decay rates superimposed on each other — exactly the biphasic (fast distribution phase, slow elimination phase) concentration curves that pharmacokinetics textbooks describe, all traceable back to solving Ax=λx for the compartment-transfer matrix.'}
]},

{ id:'t10', unit:'Unit 9 · Linear Spaces II', title:'9.3.3–9.3.4 Eigenvectors and Diagonalisation', notes: `
<p>Finding an eigenvalue only answers half of the characteristic value problem — the other half is finding the eigenvector x that actually satisfies Ax=λx for that particular λ.</p>
<h4>Finding an eigenvector</h4>
<p>Once λ is known, plug it into (A−λI)x=0 and solve. Because λ was chosen precisely to make A−λI singular, this homogeneous system is guaranteed to have a nonzero solution — but that solution is never unique on its own: if x satisfies the system, so does any scalar multiple of x, since the equation is linear and homogeneous. To pin down one specific representative eigenvector, it is standard to fix one free entry (often setting it to 1) or to normalize the vector so its norm equals 1.</p>
<div class="worked"><div class="label">Worked example</div>For A=[[3,1],[1,3]] with eigenvalue λ=4: A−4I = [[-1,1],[1,-1]]. Solving (A−4I)x=0 gives -x1+x2=0, i.e. x1=x2. Choosing x1=1 gives the eigenvector (1,1). For λ=2: A−2I=[[1,1],[1,1]], giving x1+x2=0, i.e. x2=-x1. Choosing x1=1 gives the eigenvector (1,-1). Notice ⟨(1,1),(1,-1)⟩ = 1×1 + 1×(-1) = 0 — the two eigenvectors are orthogonal, which is no accident, since they belong to two distinct eigenvalues of a symmetric matrix.</div>
<h4>Diagonalisation</h4>
<p>Real symmetric matrices carry two exceptionally useful guarantees: every eigenvalue is real (as already stated), and eigenvectors belonging to distinct eigenvalues are always orthogonal to each other. Stack the (normalized) eigenvectors together as the columns of a matrix P, and something remarkable happens: P becomes an orthogonal matrix (meaning PᵀP=I), and it <strong>diagonalises</strong> A:</p>
<div class="formula-box">PᵀAP = Λ, where Λ is the diagonal matrix of eigenvalues, arranged in the same order as the columns of P</div>
<p>This says that in the coordinate system defined by the eigenvectors, A acts exactly like simple scalar stretching along each axis — all the "cross-talk" between coordinates that the original matrix A represented has been rotated away, leaving only independent scaling along n orthogonal directions. This is the deep reason eigenvectors matter in applications: they reveal the natural, distortion-free axes hidden inside a matrix.</p>
<div class="worked"><div class="label">Normalized version</div>Normalizing the eigenvectors of the worked example above (dividing each by its own norm √2) gives x¹=(1/√2, 1/√2) and x²=(1/√2, -1/√2). Building P from these as columns gives PᵀP=I exactly, and PᵀAP works out to the diagonal matrix [[4,0],[0,2]] — the eigenvalues, in order, sitting on the diagonal and nowhere else.</div>
`,
questions:[
{q:'Once an eigenvalue λ of a matrix A has been found, how is the corresponding eigenvector obtained?', options:['By computing the determinant of A','By solving the homogeneous system (A−λI)x=0 for x','By dividing A by λ','By computing the trace of A minus λ'], correct:1, exp:'Substituting the known λ into (A−λI)x=0 and solving that homogeneous system produces the eigenvector. Because λ was specifically chosen to make A−λI singular, this system is guaranteed to have a nonzero solution — that guarantee is precisely why λ had to satisfy the characteristic equation in the first place.'},
{q:'Why is an eigenvector never unique on its own — why can it always be scaled by any nonzero constant and still be a valid eigenvector for the same eigenvalue?', options:['Because eigenvectors are always unit vectors','Because (A−λI)x=0 is a linear homogeneous equation, so if x is a solution, then any scalar multiple cx is also a solution','Because eigenvalues are also never unique','Because matrix multiplication is commutative'], correct:1, exp:'Homogeneous linear systems have the property that solutions form a subspace: if x solves (A−λI)x=0, then so does cx for any scalar c, since (A−λI)(cx) = c(A−λI)x = c·0 = 0. This is exactly why eigenvectors are typically reported after fixing a convention, like setting one entry to 1 or normalizing to unit length — otherwise there are infinitely many equally valid answers.'},
{q:'For A=[[3,1],[1,3]] with eigenvalue λ=4, solving (A−4I)x=0 gives which relationship between x1 and x2?', options:['x1 = x2','x1 = -x2','x1 = 2x2','x1 = 0'], correct:0, exp:'A−4I = [[-1,1],[1,-1]]. The first row gives -x1+x2=0, i.e. x1=x2 (the second row gives the identical equation, as expected since the matrix is singular by design). Choosing x1=1 gives the representative eigenvector (1,1).'},
{q:'For the same matrix A=[[3,1],[1,3]], with eigenvalue λ=2, what representative eigenvector do you get by setting x1=1?', options:['(1, 1)','(1, -1)','(2, 1)','(-1, -1)'], correct:1, exp:'A−2I = [[1,1],[1,1]], giving x1+x2=0, so x2=-x1. Setting x1=1 gives x2=-1, i.e. the eigenvector (1,-1). This is the eigenvector belonging to the second eigenvalue, distinct from the (1,1) eigenvector found for λ=4.'},
{q:'For A=[[3,1],[1,3]], the eigenvectors found were (1,1) for λ=4 and (1,-1) for λ=2. What geometric relationship holds between these two eigenvectors, and why?', options:['They are parallel, because they come from the same matrix','They are orthogonal (⟨(1,1),(1,-1)⟩=0), because eigenvectors belonging to distinct eigenvalues of a symmetric matrix are always orthogonal','They have no particular relationship','They are equal in magnitude but that is a coincidence with no underlying rule'], correct:1, exp:'⟨(1,1),(1,-1)⟩ = (1)(1)+(1)(-1) = 0, confirming orthogonality. This is not a coincidence specific to this matrix — it is a guaranteed structural property: for any real symmetric matrix, eigenvectors corresponding to distinct eigenvalues are always orthogonal to each other, which is exactly what makes diagonalisation using an orthogonal matrix P possible.'},
{q:'A matrix P is built by stacking the normalized eigenvectors of a symmetric matrix A as its columns. What special property does P have as a result?', options:['P is singular','P is orthogonal, meaning PᵀP = I','P equals A','P is the null matrix'], correct:1, exp:'When the eigenvectors are normalized (each scaled to have norm 1) and are mutually orthogonal (guaranteed for distinct eigenvalues of a symmetric matrix), stacking them as columns produces an orthogonal matrix, satisfying PᵀP=I. This orthogonality is exactly what makes P⁻¹ trivially equal to Pᵀ, simplifying the diagonalisation formula.'},
{q:'What does the diagonalisation equation PᵀAP = Λ tell you, where P is built from the (normalized, orthogonal) eigenvectors of symmetric A?', options:['That A and Λ are unrelated matrices','That Λ is a diagonal matrix whose diagonal entries are exactly the eigenvalues of A, in the same order as the corresponding eigenvector columns of P','That A must be the zero matrix','That P is always equal to the identity matrix'], correct:1, exp:'PᵀAP=Λ is the central payoff of diagonalisation: transforming A into the coordinate system defined by its own eigenvectors reduces it to a purely diagonal matrix, with the eigenvalues sitting on the diagonal in the order matching the eigenvector columns used to build P. All off-diagonal entries vanish, meaning there is no "mixing" between coordinates in this new basis.'},
{q:'For A=[[3,1],[1,3]] with normalized eigenvectors x¹=(1/√2,1/√2) for λ=4 and x²=(1/√2,-1/√2) for λ=2, what is the diagonal matrix Λ = PᵀAP?', options:['[[4,0],[0,2]]','[[2,0],[0,4]]','[[3,1],[1,3]] (unchanged)','[[7,0],[0,-1]]'], correct:0, exp:'The diagonal entries of Λ are exactly the eigenvalues, arranged in the same order as their corresponding eigenvector columns in P. Since the first column of P was built from the λ=4 eigenvector and the second from the λ=2 eigenvector, Λ = [[4,0],[0,2]]. Reversing the column order in P would simply reverse the diagonal entries of Λ to [[2,0],[0,4]] instead — the order is not fixed, only consistent with however P was built.'},
{q:'Why is diagonalisation considered valuable — what does it reveal about the geometric action of a matrix A?', options:['It reveals nothing new, it is purely a notational convenience','It reveals a special set of coordinate axes (the eigenvector directions) along which A acts as pure, independent scaling, with no mixing between coordinates — the "natural" or distortion-free axes hidden inside the matrix','It proves that A is always the identity matrix','It shows that A has no eigenvalues'], correct:1, exp:'In the ordinary coordinate system, a matrix A can rotate, shear, and stretch a vector all at once, making its effect hard to visualize directly. But viewed along its own eigenvector directions, A simply stretches or shrinks each direction independently — exactly what the diagonal matrix Λ describes, with each diagonal entry (eigenvalue) telling you the stretch factor along that one eigenvector axis. That is the deep, practical reason eigenvectors and diagonalisation matter across so many applications.'},
{q:'In Principal Component Analysis (PCA), the covariance matrix of a dataset is diagonalised, and the eigenvectors become the "principal component" directions while the eigenvalues become the variance explained along each direction. Which specific property from this section explains why the principal components found by PCA are always mutually orthogonal (uncorrelated) directions?', options:['PCA has a special rule that forces orthogonality, unrelated to eigenvalues','A covariance matrix is symmetric, and eigenvectors belonging to distinct eigenvalues of a symmetric matrix are always orthogonal — the same structural fact used to build the orthogonal diagonalising matrix P in this section','Orthogonality in PCA is coincidental and not guaranteed by any theorem','PCA only works when there are exactly two features'], correct:1, exp:'A covariance matrix is always symmetric by construction (covariance between feature i and feature j equals covariance between feature j and feature i). Diagonalising a symmetric matrix, exactly as covered in this section, automatically produces orthogonal eigenvectors for distinct eigenvalues — which is precisely why PCA components come out mutually uncorrelated without needing any extra constraint bolted on; it falls straight out of the linear algebra of symmetric matrices.'},
{q:'A search engine models the web as a matrix where entry (i,j) represents a link from page j to page i, and computes the long-run importance ranking of pages (PageRank) as the dominant eigenvector of this matrix. What does the eigenvector equation Ax=λx mean in this context, in plain terms?', options:['x is a ranking vector that, when the link structure A is applied to it, redistributes importance in a way that reproduces the same ranking vector x back again (up to the scalar λ), meaning x is a stable, self-consistent importance distribution','The equation has no meaningful interpretation in this context','x must always be the zero vector for a valid ranking','A represents the pages themselves, not their link structure'], correct:0, exp:'PageRank\'s defining property is stability: applying one round of "pass importance along links" (multiplying by A) to the ranking vector x should reproduce x itself, scaled by λ. That self-reproducing property is exactly what the eigenvector equation Ax=λx captures — the ranking is a fixed point of the link-following process, which is precisely why the dominant eigenvector (the one with the largest λ) is used as the actual importance ranking.'}
]},

{ id:'t11', unit:'Unit 9 · Linear Spaces II', title:'9.4 Linear Independence of Eigenvectors', notes: `
<p>This short section connects the eigenvector concept back to the linear independence ideas from Unit 8. The headline result is clean: <strong>if the eigenvalues λ1, λ2, ..., λn of a matrix A are all distinct, then the corresponding eigenvectors x1, x2, ..., xn are automatically linearly independent.</strong></p>
<p>It is worth being precise about the logical direction of this claim. Distinct eigenvalues are a <em>sufficient</em> condition for independent eigenvectors — but not a <em>necessary</em> one. Even when a matrix has a repeated eigenvalue (the same root showing up more than once in the characteristic equation), it may still be possible to find a full set of n linearly independent eigenvectors; it is just no longer guaranteed automatically the way it is when every eigenvalue is distinct.</p>
<div class="formula-box">Distinct eigenvalues ⟹ linearly independent eigenvectors&nbsp;&nbsp;&nbsp;&nbsp;(the reverse implication does not always hold)</div>
<p>The second fact worth carrying forward from the previous section: whenever two eigenvalues are distinct, their corresponding eigenvectors are not just independent — for a symmetric matrix, they are orthogonal, a considerably stronger relationship. Independence just means neither vector is a combination of the other; orthogonality additionally means their inner product is exactly zero, i.e. they point in genuinely perpendicular directions. Every pair of orthogonal (nonzero) vectors is automatically independent, but the reverse is not true — plenty of independent vector pairs are not perpendicular at all.</p>
<div class="worked"><div class="label">Tying it together</div>The 2×2 example from the previous section, A=[[3,1],[1,3]], had two distinct eigenvalues (4 and 2), and its eigenvectors (1,1) and (1,-1) turned out to be both independent and orthogonal — illustrating both guarantees from this section at once, since the matrix happened to be symmetric.</div>
`,
questions:[
{q:'If a matrix A has n distinct eigenvalues λ1, ..., λn, what does this guarantee about the corresponding eigenvectors x1, ..., xn?', options:['They are guaranteed to be linearly independent','They are guaranteed to be equal to each other','They are guaranteed to be linearly dependent','Nothing can be concluded about them'], correct:0, exp:'The headline result of this section is that distinct eigenvalues guarantee linearly independent eigenvectors. This connects directly back to Unit 8\'s definition of independence: no nontrivial combination of x1,...,xn can produce the null vector when the eigenvalues behind them are all distinct.'},
{q:'Is having distinct eigenvalues a necessary condition for a matrix to have a full set of n linearly independent eigenvectors?', options:['Yes, without distinct eigenvalues, independent eigenvectors are impossible','No — the condition is sufficient but not necessary; even with a repeated eigenvalue, it may still be possible to find n linearly independent eigenvectors, just not guaranteed automatically','Yes, but only for symmetric matrices','No, distinct eigenvalues actually guarantee linear dependence instead'], correct:1, exp:'The notes explicitly flag this as a sufficient-but-not-necessary condition. Distinctness is a convenient guarantee, but its absence does not doom you — a matrix with a repeated eigenvalue can, in some cases, still be diagonalisable with a full independent eigenvector set; it simply is not automatic the way it is when every root is distinct.'},
{q:'For eigenvectors belonging to two distinct eigenvalues of a real symmetric matrix, what stronger relationship holds beyond mere linear independence?', options:['They must be equal in magnitude','They are guaranteed to be orthogonal (perpendicular), not just independent','They must both be unit vectors','No relationship stronger than independence is guaranteed'], correct:1, exp:'For symmetric matrices specifically, distinct-eigenvalue eigenvectors are guaranteed orthogonal — inner product exactly zero — which is a stronger, more specific relationship than mere linear independence. This orthogonality is exactly what allows the eigenvectors to be assembled into an orthogonal matrix P for diagonalisation, as covered in the previous section.'},
{q:'Is every pair of orthogonal nonzero vectors automatically linearly independent, and is the converse also true?', options:['Orthogonal implies independent, but independent does not imply orthogonal — orthogonality is the stronger condition','Independent implies orthogonal, but not the reverse','Neither implies the other','They are exactly equivalent conditions, always'], correct:0, exp:'If two nonzero vectors are orthogonal, they cannot be scalar multiples of each other (a scalar multiple would have to point along the exact same or opposite direction, giving a nonzero inner product), so orthogonality forces independence. But plenty of independent vector pairs are not perpendicular at all — for example (1,0) and (1,1) are independent but not orthogonal — so the converse fails. Orthogonality is the strictly stronger of the two conditions.'},
{q:'A 3×3 matrix has eigenvalues 5, 5, and -2 (one eigenvalue repeated). What can be concluded about its eigenvectors using only the "distinct eigenvalues" rule from this section?', options:['The eigenvectors for the two eigenvalues equal to 5 are automatically independent of each other by the distinct-eigenvalues rule','The distinct-eigenvalues rule alone does not automatically guarantee independence between the two eigenvectors sharing the repeated eigenvalue 5 — that would require separate justification, though it is still sometimes possible','The matrix cannot have any eigenvectors at all','All three eigenvectors must be identical'], correct:1, exp:'The distinct-eigenvalues rule specifically requires the eigenvalues to differ from each other. The eigenvector for -2 is guaranteed independent of the pair for 5 (since -2 differs from 5), but the two eigenvectors both tied to the repeated eigenvalue 5 are not automatically covered by this particular rule — their independence, if it holds, would need to be checked or justified separately.'},
{q:'Why does orthogonality of eigenvectors matter specifically for the diagonalisation process described in the previous section?', options:['It has no bearing on diagonalisation at all','Orthogonal (and normalized) eigenvectors let the matrix P built from them satisfy PᵀP=I, which is exactly the property that makes the diagonalisation formula PᵀAP=Λ work cleanly','Diagonalisation requires eigenvectors to be dependent, not orthogonal','Orthogonality is only relevant for 2×2 matrices'], correct:1, exp:'PᵀAP=Λ relies on P being orthogonal (PᵀP=I), and orthogonality of the eigenvectors — guaranteed for distinct eigenvalues of a symmetric matrix — is exactly what delivers that property when the eigenvectors are stacked as columns of P. Without orthogonality, you would still be able to diagonalise in principle (using P⁻¹ instead of Pᵀ), but the clean, computationally convenient orthogonal version would not be available.'},
{q:'In signal processing, engineers sometimes deliberately design a transformation matrix to have distinct eigenvalues even when a simpler design with repeated eigenvalues would technically work. Why might guaranteed distinctness be a design goal, based on what this section establishes?', options:['Distinct eigenvalues have no practical benefit and are chosen only by convention','Distinct eigenvalues guarantee a full, automatic set of independent eigenvectors, which in turn guarantees the transformation can always be diagonalised cleanly — a property not automatically available when eigenvalues repeat','Distinct eigenvalues always make a matrix singular, which engineers prefer','Distinct eigenvalues make computation slower, so this would never actually be a design goal'], correct:1, exp:'Because distinct eigenvalues automatically deliver a complete independent (and, for symmetric matrices, orthogonal) eigenvector set, a design with distinct eigenvalues sidesteps the extra work of checking whether a repeated eigenvalue still permits full diagonalisability. This is exactly the sufficient-but-not-necessary guarantee highlighted in this section, made concrete as an engineering design consideration.'}
]},

{ id:'t12', unit:'Unit 9 · Linear Spaces II', title:'9.5–9.6 Quadratic Forms and Definiteness', notes: `
<p>A <strong>quadratic form</strong> is an expression built entirely out of squared terms and cross-product terms of a set of variables, with no term of any other degree. In two variables it looks like Q(x1,x2) = a11x1² + 2a12x1x2 + a22x2², and in general, with n variables:</p>
<div class="formula-box">Q(x1, ..., xn) = Σᵢ Σⱼ aij xi xj</div>
<p>Evaluating a quadratic form at different points generally gives different signs — sometimes positive, sometimes negative. But for particular choices of the coefficients, the sign turns out to be fixed no matter what the variables are (except at the origin, where every quadratic form is automatically zero). This gives four named categories:</p>
<div class="formula-box">
Positive definite: Q(x) &gt; 0 for every x ≠ 0<br>
Positive semi-definite: Q(x) ≥ 0 for every x (equality allowed for some nonzero x)<br>
Negative definite: Q(x) &lt; 0 for every x ≠ 0<br>
Negative semi-definite: Q(x) ≤ 0 for every x<br>
Indefinite: Q(x) takes both positive and negative values depending on x
</div>
<h4>The symmetric matrix form</h4>
<p>Every quadratic form can be written as Q(x) = xᵀAx for a symmetric matrix A — writing the cross-term coefficients split evenly above and below the diagonal makes this always possible.</p>
<div class="worked"><div class="label">Worked example</div>Q(x,y) = x² + 6xy + 10y² can be completed as (x+3y)² + y². Since a sum of two squares is zero only when both squares are individually zero — meaning x+3y=0 and y=0, which forces x=0 too — Q(x,y) &gt; 0 for every (x,y) ≠ (0,0), so this is positive definite. In symmetric matrix form, Q(x,y) = [x y]·[[1,3],[3,10]]·[x,y]ᵀ (the cross-term coefficient 6 is split into 3 and 3 across the off-diagonal positions).</div>
<h4>Testing definiteness directly from the coefficients (two-variable case)</h4>
<p>For Q(x1,x2)=a11x1²+2a12x1x2+a22x2², completing the square shows that a11 &gt; 0 together with a11a22 − a12² &gt; 0 are both necessary and sufficient for Q to be positive definite. Flipping the sign condition on a11 (a11 &lt; 0, same determinant condition a11a22−a12² &gt; 0) gives negative definite instead.</p>
<h4>9.6 — Testing definiteness from eigenvalues</h4>
<p>Because a quadratic form's matrix A is symmetric, its eigenvalues are guaranteed real (property ii from the previous section), and their signs turn out to tell you the definiteness directly:</p>
<div class="formula-box">
Positive definite ⟺ every eigenvalue of A is &gt; 0<br>
Positive semi-definite ⟺ every eigenvalue is ≥ 0 (with |A|=0 and a11≥0 as an equivalent 2-variable test)<br>
Negative definite ⟺ every eigenvalue is &lt; 0<br>
Negative semi-definite ⟺ every eigenvalue is ≤ 0 (with |A|=0 and a11≤0 as an equivalent 2-variable test)<br>
Indefinite ⟺ the eigenvalues have mixed signs
</div>
<p>This eigenvalue test and the coefficient-based test (a11 and a11a22−a12²) are two different routes to the exact same conclusion — worth cross-checking against each other when you have both available, since they should always agree.</p>
`,
questions:[
{q:'What defines a "quadratic form" in n variables?', options:['Any polynomial expression in n variables','An expression of the form Σᵢ Σⱼ aij xi xj — built entirely from squared and cross-product terms, with no term of any other degree','Any linear equation in n variables','An expression involving only square roots'], correct:1, exp:'A quadratic form is specifically homogeneous of degree 2 in its variables: every term is either a squared variable (aiixi²) or a cross-product of two different variables (aijxixj). There are no constant terms, no linear terms, and no higher-degree terms — the entire expression is built from degree-2 pieces only.'},
{q:'What does it mean for a quadratic form Q to be "positive definite"?', options:['Q(x) is positive for at least one value of x','Q(x) > 0 for every x except x=0, where Q is automatically zero','Q(x) is always exactly equal to 1','Q(x) can be positive or negative depending on x'], correct:1, exp:'Positive definite means Q(x) is strictly positive everywhere except at the origin. Every quadratic form automatically evaluates to zero at x=0 (since every term contains at least one factor of a variable, all of which are zero there), so the "except x=0" clause is simply acknowledging that unavoidable single exception.'},
{q:'What is the key difference between "positive definite" and "positive semi-definite"?', options:['There is no difference, the terms are synonyms','Positive definite requires strict positivity for every nonzero x; positive semi-definite allows Q(x)=0 for some nonzero x as well, only requiring Q(x) ≥ 0 everywhere','Positive semi-definite requires strictly larger values than positive definite','Positive semi-definite only applies to 2-variable quadratic forms'], correct:1, exp:'Semi-definite relaxes the strict inequality to a non-strict one: Q(x) ≥ 0 is allowed to include equality at some nonzero points, not just at the origin. For example, Q(x,y)=(x-y)² is zero whenever x=y, even away from the origin, but never negative — that makes it positive semi-definite, not positive definite.'},
{q:'What does "indefinite" mean for a quadratic form?', options:['Q(x) is always undefined','Q(x) takes both positive and negative values, depending on which x you plug in','Q(x) is always zero','Q(x) cannot be evaluated numerically'], correct:1, exp:'Indefinite quadratic forms are the catch-all category: they do not stay on one side of zero the way definite or semi-definite forms do. Depending on the direction of x, the same quadratic form can come out positive for some inputs and negative for others.'},
{q:'Every quadratic form Q(x)=Σᵢ Σⱼ aij xi xj can be written in which compact matrix form, using a symmetric matrix A?', options:['Q(x) = Ax','Q(x) = xᵀAx','Q(x) = xᵀ + A','Q(x) = Ax + xᵀ'], correct:1, exp:'Q(x) = xᵀAx is the standard compact form, where A is built to be symmetric by splitting each cross-term coefficient evenly between its two off-diagonal positions. This symmetric-matrix packaging is exactly what connects quadratic forms to the eigenvalue machinery from the previous sections — only a symmetric matrix\'s eigenvalues are guaranteed real, which is essential for the sign-based definiteness tests.'},
{q:'Write Q(x,y) = x² + 6xy + 10y² in symmetric matrix form.', options:['[x y]·[[1,6],[0,10]]·[x,y]ᵀ','[x y]·[[1,3],[3,10]]·[x,y]ᵀ','[x y]·[[1,3],[3,1]]·[x,y]ᵀ','[x y]·[[6,1],[10,0]]·[x,y]ᵀ'], correct:1, exp:'The cross-term coefficient, 6, must be split evenly between the two off-diagonal positions of a symmetric matrix, giving 3 and 3, while the squared-term coefficients (1 and 10) sit on the diagonal unchanged. Expanding [x y]·[[1,3],[3,10]]·[x,y]ᵀ gives x²+3xy+3xy+10y²=x²+6xy+10y², confirming the match.'},
{q:'Show that Q(x,y)=x²+6xy+10y² is positive definite by completing the square. What does the completed-square form reveal?', options:['Q(x,y) = (x+3y)² − y², which can be negative','Q(x,y) = (x+3y)² + y², a sum of two squares that is zero only when x+3y=0 and y=0 simultaneously — which forces x=y=0, so Q>0 everywhere else','Q(x,y) = (x−3y)² + y², identical conclusion by symmetry','Q(x,y) cannot be completed into square form'], correct:1, exp:'Expanding (x+3y)²+y² gives x²+6xy+9y²+y² = x²+6xy+10y², matching Q exactly. A sum of two squares can only equal zero if each square individually is zero: x+3y=0 and y=0. The second equation forces y=0, and substituting into the first forces x=0 too — so the only zero of Q is the origin, and Q is strictly positive everywhere else, confirming positive definiteness.'},
{q:'For the two-variable quadratic form Q(x1,x2)=a11x1²+2a12x1x2+a22x2², which two conditions on the coefficients are both necessary and sufficient for Q to be positive definite?', options:['a11 > 0 and a22 > 0, with no other requirement','a11 > 0 and a11a22 − a12² > 0','a12 > 0 and a11 = a22','a11a22 = a12² exactly'], correct:1, exp:'Completing the square shows a11 > 0 combined with a11a22 − a12² > 0 is exactly the condition needed for positive definiteness — both pieces are required together. Just having a11>0 and a22>0 individually is not sufficient on its own, since a large cross-term a12 can still make the quadratic form dip negative somewhere even if both diagonal coefficients are positive.'},
{q:'For a symmetric matrix A representing a quadratic form Q, if all of A\'s eigenvalues are strictly positive, what can be concluded about Q?', options:['Q is negative definite','Q is positive definite','Q is indefinite','Nothing can be concluded'], correct:1, exp:'Section 9.6 links definiteness directly to eigenvalue signs: every eigenvalue strictly positive corresponds exactly to Q being positive definite. This gives a second, equally valid way to test definiteness beyond the a11/a11a22−a12² coefficient test — the two approaches should always agree for the same matrix.'},
{q:'A symmetric 2×2 matrix has eigenvalues 3 and -2. What kind of quadratic form does it represent?', options:['Positive definite','Negative definite','Indefinite, since the eigenvalues have mixed signs','Positive semi-definite'], correct:2, exp:'Mixed-sign eigenvalues (one positive, one negative) mean the quadratic form takes positive values along the direction of the positive-eigenvalue eigenvector and negative values along the direction of the negative-eigenvalue eigenvector — exactly the definition of indefinite. Neither the fully positive nor fully negative categories apply when the signs disagree.'},
{q:'A symmetric matrix has eigenvalues 4 and 0. What kind of quadratic form does it represent, and why not the strict "definite" category?', options:['Positive definite, since one eigenvalue is positive','Positive semi-definite, since every eigenvalue is ≥ 0 but the zero eigenvalue means Q(x)=0 for some nonzero x (along that eigenvalue\'s eigenvector direction), ruling out strict positive definiteness','Negative definite','Indefinite, since 0 counts as a sign change'], correct:1, exp:'All eigenvalues are non-negative (4 and 0), satisfying the semi-definite condition, but the presence of a zero eigenvalue means the quadratic form evaluates to exactly zero along that eigenvector\'s direction, even though that direction is not the origin — violating the strict ">0 everywhere except the origin" requirement of positive definite, and placing it instead in the semi-definite category.'},
{q:'In statistics, a valid covariance matrix for a set of random variables must always be positive semi-definite. Why does this requirement make sense in light of the quadratic form and eigenvalue material in this section?', options:['Covariance matrices have nothing to do with quadratic forms','Because for any vector of weights w, wᵀΣw computes the variance of the weighted combination of the variables, and a variance can never be negative — so the quadratic form built from Σ must satisfy Q(w) ≥ 0 for every w, which is exactly the definition of positive semi-definite','Because covariance matrices are always diagonal','Because negative eigenvalues make matrix multiplication undefined'], correct:1, exp:'wᵀΣw, for a covariance matrix Σ and weight vector w, computes the variance of the linear combination Σ wixi of the original random variables. Since variance can never be negative for any choice of weights, the quadratic form defined by Σ must satisfy Q(w) ≥ 0 for every w — precisely the positive semi-definite condition from this section, applied to a genuinely important real-world constraint that any legitimate covariance matrix must obey.'},
{q:'In machine learning optimization, the Hessian matrix (the matrix of second derivatives) of a loss function at a candidate solution is symmetric, and its definiteness determines whether that point is a local minimum, maximum, or saddle point. If the Hessian is positive definite at a point, what does that indicate?', options:['The point is a local maximum','The point is a saddle point','The point is a local minimum, since the loss function curves upward in every direction away from that point — exactly the quadratic-form behavior of a positive definite matrix','The Hessian being positive definite says nothing about the shape of the function'], correct:2, exp:'Near a critical point, a function\'s behavior is well approximated by the quadratic form built from its Hessian. A positive definite Hessian means that quadratic form is positive in every direction away from the point (except at the point itself), meaning the loss function rises in every direction — exactly the signature of a local minimum, and exactly the "Q(x)>0 for all x≠0" definition of positive definite from this section, just applied to an optimization landscape instead of an abstract xᵀAx.'}
]},

{ id:'t13', unit:'Unit 9 · Linear Spaces II', title:'9.7 Vector Differentiation', notes: `
<p>Optimization problems built from vectors and matrices — minimizing a cost, maximizing a fit — routinely need derivatives taken with respect to an entire vector at once, not one variable at a time. This section works out four standard patterns, each building on the last.</p>
<h4>9.7.1 — Differentiating a linear function</h4>
<p>A linear function of the form aᵀx = a1x1+a2x2+...+anxn has a very simple set of partial derivatives: ∂(aᵀx)/∂xi = ai for every i. Collecting all n of these partial derivatives into a vector gives:</p>
<div class="formula-box">∂(aᵀx)/∂x = a</div>
<p>In words: differentiating a linear function with respect to its vector of variables just gives back the coefficient vector itself — the same relationship as the single-variable fact that the derivative of ax with respect to x is simply a.</p>
<h4>9.7.2 — Differentiating a vector of functions</h4>
<p>Now suppose y is itself an n-dimensional vector, each entry yi being some function fi of the m variables in x. Differentiating every yi with respect to every xj produces an m×n array of partial derivatives, called the <strong>Jacobian</strong>:</p>
<div class="formula-box">(∂y/∂x)ji = ∂yi/∂xj&nbsp;&nbsp;(an m×n matrix, one column per function yi, one row per variable xj)</div>
<div class="worked"><div class="label">Worked example</div>For y1=x1²+2x2²−3x1x3 and y2=3x1x2²−x2²+4x2x3², the Jacobian is a 3×2 matrix: column 1 (from y1) is (2x1−3x3, 4x2, −3x1); column 2 (from y2) is (3x2², 6x1x2−2x2+4x3², 8x2x3). Every entry is just an ordinary partial derivative, computed one variable at a time, then arranged into the grid.</div>
<h4>9.7.3 — Differentiating a quadratic form</h4>
<p>For the quadratic form xᵀAx with A symmetric, differentiating with respect to each xi and collecting the results gives a strikingly clean formula:</p>
<div class="formula-box">∂(xᵀAx)/∂x = 2Ax&nbsp;&nbsp;&nbsp;&nbsp;(equivalently, ∂(xᵀAx)/∂x = 2xᵀA, as a row vector)</div>
<p>The two versions differ only in whether the result is presented as a column vector (2Ax) or a row vector (2xᵀA) — which one to use is purely a matter of matching the shape needed by whatever equation the derivative is being plugged into.</p>
<h4>9.7.4 — Differentiating a bilinear form</h4>
<p>A bilinear form xᵀBz involves two different vectors x and z (of possibly different lengths), linked through a matrix B. Differentiating with respect to each vector separately gives:</p>
<div class="formula-box">∂(xᵀBz)/∂x = Bz&nbsp;&nbsp;&nbsp;&nbsp;∂(xᵀBz)/∂z = Bᵀx</div>
<p>Notice the pattern across all four results in this section: differentiating "removes" the vector you are differentiating with respect to, leaving behind whatever was multiplying it — a linear echo of ordinary single-variable calculus, just organized into vectors and matrices.</p>
`,
questions:[
{q:'For the linear function aᵀx = a1x1+a2x2+...+anxn, what is ∂(aᵀx)/∂xi for a specific index i?', options:['xi','ai','a1+a2+...+an','0'], correct:1, exp:'Since aᵀx is a sum of terms ajxj, differentiating with respect to xi only picks out the one term containing xi (namely aixi), whose derivative with respect to xi is simply ai — every other term is treated as a constant with respect to xi and vanishes upon differentiation.'},
{q:'Collecting all the individual partial derivatives ∂(aᵀx)/∂xi into a single vector, what is ∂(aᵀx)/∂x?', options:['x','a','aᵀa','0'], correct:1, exp:'∂(aᵀx)/∂x = a — differentiating a linear function with respect to the full vector of variables simply returns the original coefficient vector a, unchanged. This directly mirrors the single-variable calculus fact that d(ax)/dx = a.'},
{q:'If a = (2, -3, 5, 0) and x = (x1, x2, x3, x4), what is ∂(aᵀx)/∂x?', options:['(2, -3, 5, 0)','(0, 0, 0, 0)','(x1, x2, x3, x4)','(-2, 3, -5, 0)'], correct:0, exp:'By the rule ∂(aᵀx)/∂x = a, the derivative is simply the coefficient vector itself: (2, -3, 5, 0). No computation beyond recognizing the pattern is needed — the derivative of a linear function is always just its own coefficient vector, regardless of the specific numbers involved.'},
{q:'When y is an n-dimensional vector of functions of an m-dimensional vector x, what is the name given to the m×n array of all the partial derivatives ∂yi/∂xj?', options:['The Hessian','The Jacobian','The characteristic matrix','The Gram matrix'], correct:1, exp:'This array of first-order partial derivatives of a vector-valued function with respect to another vector is called the Jacobian. (The Hessian, by contrast, is a matrix of second derivatives of a single scalar-valued function — a related but different object, relevant to the definiteness tests discussed in the previous section.)'},
{q:'For y1 = x1² + 2x2² − 3x1x3, what is ∂y1/∂x1?', options:['2x1 − 3x3','2x1','x1² − 3x3','2x1 + 2x2 − 3x3'], correct:0, exp:'Differentiate term by term with respect to x1: the derivative of x1² is 2x1, the term 2x2² does not involve x1 so it vanishes, and the derivative of −3x1x3 with respect to x1 is −3x3 (treating x3 as a constant during this partial derivative). Adding these gives 2x1 − 3x3.'},
{q:'For y1 = x1² + 2x2² − 3x1x3, what is ∂y1/∂x2?', options:['4x2','2x2','4x2 − 3x1','0'], correct:0, exp:'Only the term 2x2² involves x2. Its derivative with respect to x2 is 4x2. The other two terms, x1² and −3x1x3, do not contain x2 at all, so they contribute nothing to this particular partial derivative.'},
{q:'For y2 = 3x1x2² − x2² + 4x2x3², what is ∂y2/∂x1?', options:['3x2²','3x1x2','6x1x2','4x3²'], correct:0, exp:'Only the first term, 3x1x2², contains x1, and it is linear in x1 (with coefficient 3x2²), so its derivative with respect to x1 is simply 3x2². The remaining terms, −x2² and 4x2x3², contain no x1 at all and vanish under this partial derivative.'},
{q:'For the quadratic form xᵀAx with A symmetric, what is ∂(xᵀAx)/∂x?', options:['Ax','2Ax','x²A','A'], correct:1, exp:'The derivative of a quadratic form with respect to its vector is 2Ax (equivalently 2xᵀA as a row vector). The factor of 2 arises for essentially the same reason d(ax²)/dx=2ax does in single-variable calculus — a squared term contributes twice its "linear rate" when differentiated.'},
{q:'If A = [[3,1],[1,3]] (symmetric) and x = (x1, x2), what is ∂(xᵀAx)/∂x, expressed as a column vector?', options:['(3x1+x2, x1+3x2)','2(3x1+x2, x1+3x2)','(6x1, 6x2)','(x1, x2)'], correct:1, exp:'∂(xᵀAx)/∂x = 2Ax. Computing Ax first: Ax = (3x1+x2, x1+3x2). Multiplying by 2 gives 2(3x1+x2, x1+3x2) = (6x1+2x2, 2x1+6x2). This matches expanding xᵀAx directly: 3x1²+2x1x2+3x2², whose partial derivatives are 6x1+2x2 and 2x1+6x2 — confirming the 2Ax formula against a hand check.'},
{q:'For the bilinear form xᵀBz (with x and z possibly different-length vectors linked by matrix B), what are ∂(xᵀBz)/∂x and ∂(xᵀBz)/∂z respectively?', options:['Bz and Bᵀx','Bx and Bz','B and Bᵀ','2Bz and 2Bᵀx'], correct:0, exp:'∂(xᵀBz)/∂x = Bz — differentiating with respect to x "removes" x from the expression, leaving Bz behind. ∂(xᵀBz)/∂z = Bᵀx — differentiating with respect to z leaves Bᵀx (note the transpose on B, which arises from the different way z is multiplied into the expression compared to x). No factor of 2 appears here, unlike the quadratic form case, because x and z are different vectors rather than the same vector appearing twice.'},
{q:'Why does the quadratic form derivative 2Ax include a factor of 2, while the bilinear form derivatives Bz and Bᵀx do not?', options:['It is an arbitrary convention with no underlying reason','In xᵀAx, the same vector x is multiplied against itself, so differentiating produces two contributing "copies" that combine into the factor of 2; in xᵀBz, x and z are different vectors, so differentiating with respect to one of them only removes one occurrence, with no doubling','The factor of 2 is a typo that should not actually appear','Bilinear forms are always differentiated to zero'], correct:1, exp:'A quadratic form xᵀAx effectively has x appearing "twice" (once from each side of the matrix multiplication), so differentiating it produces two matching contributions that add together into the factor of 2 — directly analogous to how differentiating x² gives 2x in ordinary calculus. A bilinear form xᵀBz has two genuinely distinct vectors, so differentiating with respect to just one of them only removes that one occurrence, with nothing left to double.'},
{q:'In deriving the ordinary least squares (OLS) solution for linear regression, the loss function (sum of squared errors) can be written as a quadratic form in the coefficient vector β, and setting its derivative with respect to β equal to zero produces the "normal equations" used to solve for the best-fit coefficients. Which formula from this section is the essential calculus tool behind that derivation?', options:['∂(aᵀx)/∂x = a, the linear function derivative','∂(xᵀAx)/∂x = 2Ax, the quadratic form derivative, applied to the sum-of-squared-errors loss function written in terms of β','The Jacobian of a vector of functions','∂(xᵀBz)/∂x = Bz, the bilinear form derivative'], correct:1, exp:'The OLS loss function, written out, is a quadratic form in the unknown coefficient vector β (built from the data matrix). Differentiating that quadratic form with respect to β uses precisely the ∂(xᵀAx)/∂x=2Ax formula from this section, and setting the result to zero (2Aβ=0, rearranged appropriately with the data matrices) produces the normal equations that regression software actually solves. This is one of the most direct real-world uses of vector calculus in all of applied statistics and machine learning.'},
{q:'A gradient descent algorithm minimizing a quadratic loss function L(x) = xᵀAx (with A symmetric and positive definite) repeatedly updates x by stepping in the direction opposite to the gradient. Using the formula from this section, what is that gradient at a given point x?', options:['Ax','2Ax','x','2A'], correct:1, exp:'The gradient of L(x)=xᵀAx with respect to x is exactly 2Ax, the quadratic-form differentiation rule from this section. Gradient descent uses this vector directly: it steps in the direction −2Ax (or any positive scalar multiple of it) to reduce the loss, and because A is positive definite (guaranteeing the quadratic bowl only has one minimum, at x=0, per the previous section\'s definiteness theory), repeatedly taking such steps reliably converges toward that minimum.'}
]},
{ id:'t14', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.2 Factorial and Its Notation', notes: `
<p>Before counting arrangements of anything, it helps to have a shorthand for "multiply every whole number up to n together." That shorthand is the <strong>factorial</strong>, written n! (or occasionally ⌊n), and defined as:</p>
<div class="formula-box">n! = n × (n−1) × (n−2) × ... × 3 × 2 × 1&nbsp;&nbsp;&nbsp;&nbsp;and, by definition, 0! = 1</div>
<p>That last part — 0!=1 — is not something you can derive by literally multiplying "nothing" together; it is a definition, chosen specifically because it makes later formulas (permutations, combinations, the binomial theorem) work cleanly without special-casing zero. Get comfortable with it now, because it resurfaces constantly.</p>
<h4>The one trick that makes factorial arithmetic manageable</h4>
<p>Large factorials are unwieldy to compute directly, but they almost never need to be. The key structural fact is that n! contains (n−1)! inside it:</p>
<div class="formula-box">n! = n × (n−1)!&nbsp;&nbsp;for n ≥ 1&nbsp;&nbsp;&nbsp;&nbsp;n! = n × (n−1) × (n−2)!&nbsp;&nbsp;for n ≥ 2&nbsp;&nbsp;&nbsp;&nbsp;...and so on</div>
<p>This means a ratio like 10!/8! never needs either factorial computed in full — everything from 8! downward cancels, leaving just 10×9=90. Whenever you see a fraction of two factorials or a product of consecutive integers, look for this cancellation before reaching for a calculator.</p>
<div class="worked"><div class="label">Worked examples</div>
8! = 8×7×6×5×4×3×2×1 = 40320.<br>
(4!)(3!) = 24 × 6 = 144.<br>
10! / (8!×4!) = (10×9) / 4! = 90/24 = 15/4 (note this one does not come out to a whole number — factorial ratios are not automatically integers unless the specific combination guarantees it, as combinations do).<br>
5!+4! = 120+24 = 144. (Coincidentally the same value as (4!)(3!) above — a reminder that addition and multiplication of factorials do not follow any shared shortcut; each must be evaluated separately.)<br>
6!−4! = 720−24 = 696.
</div>
<h4>Writing products as factorials</h4>
<p>The reverse direction matters too: a product of evenly-spaced numbers, like 5×6×7×8×9×10, can be rewritten by multiplying and dividing by whatever is missing. Since 5×6×...×10 is "10! with the 1×2×3×4 at the front missing," you get 5×6×...×10 = 10!/4!.</p>
<h4>Solving for n</h4>
<p>Equations involving factorials of an unknown n are solved by expanding just enough of the larger factorial to cancel against the smaller one, turning the equation into an ordinary polynomial in n.</p>
<div class="worked"><div class="label">Worked example</div>Solve (n+2)! = 42·n!. Expand the left side just enough to expose n!: (n+2)(n+1)(n!) = 42(n!). Since n! is common to both sides and nonzero, cancel it: (n+2)(n+1) = 42, giving n²+3n+2=42, so n²+3n−40=0, factoring as (n+8)(n−5)=0. Since n must be a natural number, n=5 (discard n=−8).</div>
`,
questions:[
{q:'By definition, what does 0! equal?', options:['0','1','Undefined','It depends on context'], correct:1, exp:'0! is defined to equal 1. This is not something derived by multiplying zero numbers together in any literal sense — it is a deliberate convention, chosen because it makes the permutation, combination, and binomial formulas developed later in this unit work correctly at their boundary cases without needing special exceptions.'},
{q:'Compute 7!', options:['5040','720','2520','40320'], correct:0, exp:'7! = 7×6×5×4×3×2×1. Building it up: 7×6=42, ×5=210, ×4=840, ×3=2520, ×2=5040, ×1=5040. So 7!=5040. (For reference, 6!=720 and 8!=40320 — knowing a couple of small factorials by heart makes it easy to sanity-check computations like this one.)'},
{q:'Simplify 9!/7! without computing either factorial in full.', options:['9×8 = 72','9! − 7!, requiring both full values','2, since 9−7=2','9/7'], correct:0, exp:'Because 9! = 9×8×7!, the 7! in the denominator cancels the 7! hidden inside 9!, leaving just 9×8=72. This cancellation trick — expand only as much of the larger factorial as needed to expose the smaller one — is the single most useful shortcut for factorial arithmetic, and avoids ever computing the full value of either factorial.'},
{q:'Compute 12!/(10!×2!) without fully expanding 12! or 10!.', options:['66','132','6','12'], correct:0, exp:'12! = 12×11×10!, so the 10! cancels, leaving (12×11)/2! = 132/2 = 66. Recognizing which factorial is "hidden inside" the larger one is what makes this computation quick instead of requiring the full 12-digit value of 12!.'},
{q:'Express the product 6×7×8×9×10×11 in terms of factorials.', options:['11!/5!','11!/6!','11! − 5!','6!×11!'], correct:0, exp:'The product 6×7×...×11 is exactly 11! with the leading 1×2×3×4×5 missing. Since that missing piece is 5!, dividing it out gives 11!/5!. A quick check: 11!/5! = 11×10×9×8×7×6, which matches the six factors in the original product read in reverse order.'},
{q:'Solve for n (a natural number): (n+1)! = 6 × n!', options:['n = 5','n = 6','n = 4','n = 7'], correct:0, exp:'(n+1)! = (n+1)×n!, so the equation becomes (n+1)×n! = 6×n!. Cancelling the common, nonzero factor n! from both sides leaves n+1=6, so n=5.'},
{q:'Solve for n (a natural number): n! = 20 × (n−2)!', options:['n = 5','n = 4','n = 20','n = 10'], correct:0, exp:'n! = n(n−1)(n−2)!, so the equation becomes n(n−1)(n−2)! = 20(n−2)!. Cancelling (n−2)! from both sides gives n(n−1)=20, i.e. n²−n−20=0, which factors as (n−5)(n+4)=0. Since n must be a natural number, n=5 (the n=−4 root is discarded).'},
{q:'Solve for n (a natural number): n! = 30 × (n−2)!', options:['n = 6','n = 5','n = 30','n = 15'], correct:0, exp:'As before, n! = n(n−1)(n−2)!, so cancelling (n−2)! gives n(n−1)=30, i.e. n²−n−30=0, factoring as (n−6)(n+5)=0. Discarding the negative root, n=6. Notice the pattern: the constant on the right (20 versus 30) directly determines the pair of consecutive integers n and n−1 whose product it equals — 4×5=20 gave n=5, and 5×6=30 gives n=6.'},
{q:'What is the value of 4! + 5!, computed separately (not combined into a single factorial)?', options:['24 + 120 = 144','9! = 362880, since factorials add by combining exponents','120, only the larger term matters','5! − 4! = 96'], correct:0, exp:'Factorials do not combine additively the way exponents combine multiplicatively — there is no shortcut like "a!+b! = (a+b)!". Each term must be computed on its own: 4!=24 and 5!=120, and only after both are found separately do you add them, giving 144.'},
{q:'In computer science, a brute-force algorithm that tries every possible ordering of n items (such as a naive solution to the traveling salesman problem) has a running time proportional to n!. Why does this make factorial growth especially significant in algorithm analysis?', options:['Because n! grows more slowly than any polynomial in n, making brute-force approaches efficient for large n','Because n! grows explosively fast — far faster than exponential functions like 2ⁿ — so even modestly sized inputs (say n=20) produce a number of orderings too large to check within any practical amount of time','Because factorial-time algorithms are always incorrect','Because n! only matters for even values of n'], correct:1, exp:'Factorial growth outpaces exponential growth for large n (n! eventually grows faster than any fixed base raised to the n-th power), which is exactly why "try every ordering" algorithms become computationally hopeless well before n reaches even a few dozen — this is precisely the motivation for smarter algorithms (dynamic programming, heuristics) that avoid literally enumerating all n! possibilities.'},
{q:'A hospital lab wants to know how many distinct ways it can run 6 diagnostic tests one after another in some sequence, if every test must be run exactly once and order matters (some tests depend on samples from earlier ones). How many possible orderings are there?', options:['6! = 720','6 × 5 = 30','2⁶ = 64','36'], correct:0, exp:'Arranging 6 distinct tests, one after another with no repeats and every position filled, is exactly what factorial counts: 6! = 720 possible sequences. This is the same "arrange n distinct things in a line" structure the rest of this unit builds on, just applied to a lab scheduling problem instead of an abstract list.'},
{q:'Simplify the factorial ratio 15!/(13!×2!) as a single number.', options:['105','210','15','30'], correct:0, exp:'15! = 15×14×13!, so the 13! cancels, leaving (15×14)/2! = 210/2 = 105. This particular ratio structure — n!/((n−2)!×2!) — will reappear soon in a different guise, since it is exactly the formula used later in this unit for choosing 2 items out of 15 without regard to order.'}
]},

{ id:'t15', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.3 Fundamental Principles of Counting', notes: `
<p>Picture a bike lock with 3 wheels, each showing digits 0 through 9. If you forget the combination, is there a way to know how many possible codes exist, short of trying all of them? Yes — and answering that question is exactly what this section's two fundamental principles are for.</p>
<h4>The Fundamental Principle of Multiplication (FPM)</h4>
<p>If a first task can be completed in m distinct ways, and a second, independent task can then be completed in n distinct ways, the two tasks together (first one, then the other) can be completed in m×n distinct ways. This generalizes to any number of tasks in sequence:</p>
<div class="formula-box">Total ways = m1 × m2 × m3 × ... × mn&nbsp;&nbsp;(one task after another, "AND" combined)</div>
<p>The bike lock is a direct instance: each of the 3 wheels independently offers 10 choices, so the total number of codes is 10×10×10 = 1000.</p>
<h4>The Fundamental Principle of Addition (FPA)</h4>
<p>If instead you want to complete just <em>one</em> job chosen from among several alternative, mutually exclusive jobs — a first job doable in m ways, or a second, entirely separate job doable in n ways, but not both at once — the number of ways to complete one of them is m+n:</p>
<div class="formula-box">Total ways = m1 + m2 + m3 + ... + mn&nbsp;&nbsp;(one alternative or another, "OR" combined, mutually exclusive)</div>
<p>The rule of thumb worth memorizing: <strong>"and" multiplies, "or" adds</strong> — but only when the "or" options genuinely cannot happen together. If the alternatives could overlap, a more careful inclusion-exclusion approach (beyond the scope of this basic principle) is needed instead.</p>
<div class="worked"><div class="label">Worked example — FPM</div>A lunch menu offers 2 appetizer choices, 2 main-course choices, and 3 dessert choices, with one selection made from each course. The total number of possible complete meals is 2×2×3 = 12 — every appetizer choice can be paired with every main course choice, and every one of those pairings can be paired with every dessert choice, so the counts multiply rather than add.</div>
<div class="worked"><div class="label">Worked example — FPA</div>A college has 40 male and 30 female faculty members. Selecting one faculty member — either a male or a female, but only one person total — for a single duty can be done in 40+30=70 ways, since choosing a male faculty member and choosing a female faculty member are two entirely separate, non-overlapping options for filling that one role.</div>
<h4>A slightly richer example: building a number plate</h4>
<p>How many number plates are possible using 2 different letters of the alphabet followed by 4 different digits (0–9), with no repeats allowed within either group? This is FPM applied across six positions in sequence: the first letter has 26 choices, the second letter has 25 remaining choices (one letter already used), the first digit has 10 choices, the second digit has 9 remaining, the third has 8, and the fourth has 7. Multiplying all six: 26×25×10×9×8×7 = 3,276,000. If repetition of digits were allowed instead, the digit portion would simply become 10×10×10×10, adjusted only if a specific pattern (like all-zero) needed to be excluded separately.</p>
`,
questions:[
{q:'The Fundamental Principle of Multiplication (FPM) applies when...', options:['you are choosing one item from several mutually exclusive alternatives','a sequence of independent tasks must each be completed one after another, and you want the total number of ways to complete the whole sequence','you only have one task to complete','the tasks can only be completed in a specific pre-set order that never changes'], correct:1, exp:'FPM handles "this task AND then that task AND then that task," where each task\'s number of options gets multiplied together because every choice in one task can be freely combined with every choice in the next. This is different from FPA, which handles choosing just one option from a set of alternatives.'},
