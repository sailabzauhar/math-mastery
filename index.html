{q:'The Fundamental Principle of Addition (FPA) applies when...', options:['you must complete every task in a list, one after another','you are choosing exactly one option from among several separate, mutually exclusive alternatives, and want the total number of ways to make that one choice','the tasks depend on each other in sequence','none of the available options can actually be chosen'], correct:1, exp:'FPA handles "this option OR that option," where the alternatives cannot both be chosen at once (mutually exclusive) — the number of ways to complete one job selected from several such alternatives is the sum of each alternative\'s count, not the product.'},
{q:'A restaurant offers 3 soup choices, 4 main dishes, and 2 dessert choices, with a full meal requiring one choice from each category. How many distinct complete meals are possible?', options:['24','9','3+4+2=9, using addition','6'], correct:0, exp:'This is FPM: three independent choices made in sequence, each multiplying the running total. 3×4×2 = 24. Addition would be wrong here because a full meal requires all three courses together, not a choice of just one course — "and" situations multiply.'},
{q:'A student can choose to join exactly one of the following: the chess club (12 members already enrolled through 12 distinct sign-up slots), the debate club (8 sign-up slots), or the coding club (15 sign-up slots), but only one club per student this term. In how many distinct ways can a student make this one choice?', options:['12+8+15 = 35','12×8×15 = 1440','12−8+15','15, the largest option only'], correct:0, exp:'This is FPA: the student picks exactly one option from three mutually exclusive alternatives (joining more than one club this term is not permitted in the scenario), so the total ways to make that single choice is the sum: 12+8+15=35.'},
{q:'A password must consist of exactly 3 different letters of the English alphabet (no repeats) followed by 2 different digits (no repeats). How many such passwords are possible?', options:['26×25×24×10×9 = 1,404,000','26×25×24 + 10×9','(26×25×24)×(10×9), computed as 15600×90','Both A and C describe the same correct calculation'], correct:3, exp:'This is FPM applied across five sequential positions: 26 choices for the first letter, 25 for the second (one used), 24 for the third, then 10 choices for the first digit and 9 for the second (one used). Multiplying all five — 26×25×24×10×9 — gives 1,404,000, which is the same value however you group the multiplication (letters first then digits, or the full product at once), confirming options A and C describe the same correct computation.'},
{q:'A genetics lab is designing a short DNA probe sequence using 4 possible bases (A, C, G, T) at each of 5 positions, with repetition of bases allowed across positions (the same base can appear more than once in the sequence). How many distinct 5-base sequences are possible?', options:['4⁵ = 1024','4×5 = 20','5⁴ = 625','4+5 = 9'], correct:0, exp:'Each of the 5 positions in the sequence independently offers 4 choices (since repetition is allowed, earlier choices do not reduce later options), so by FPM the total is 4×4×4×4×4 = 4⁵ = 1024. This is the exact same "how many possible short sequences over an alphabet of size k" structure used throughout genomics and cryptography, just with a biologically meaningful alphabet of 4 bases instead of 10 digits or 26 letters.'},
{q:'A hospital pharmacy needs to select exactly one drug from Class A (6 available drugs) to combine with exactly one drug from Class B (5 available drugs) for a two-drug combination therapy. How many distinct two-drug combinations are possible?', options:['6×5 = 30','6+5 = 11','6−5 = 1','5⁶'], correct:0, exp:'Selecting one drug from Class A AND one drug from Class B, to be used together, is an FPM situation — every Class A choice can be paired with every Class B choice, giving 6×5=30 distinct combination therapies. If instead the pharmacy only needed to pick one drug total from either class (not both), that would be an FPA situation, giving 6+5=11 instead — the wording "and used together" versus "or, just one" is exactly what distinguishes which principle applies.'},
{q:'A security system uses a 4-digit PIN where each digit can be any of 0–9, and repetition of digits is allowed. How many distinct PINs are possible?', options:['10⁴ = 10,000','10×4 = 40','4¹⁰','9×9×9×9, since 0 is excluded'], correct:0, exp:'Each of the 4 digit positions independently offers 10 choices (0 through 9), and since repetition is explicitly allowed, no position\'s available choices are reduced by earlier ones. FPM gives 10×10×10×10 = 10,000, the standard count behind "how many 4-digit PINs exist" that underlies basic PIN security analysis.'},
{q:'A machine learning pipeline has 3 possible preprocessing steps (each either applied or skipped, independently of the others) followed by a choice of exactly 1 of 5 possible classification models. How many distinct end-to-end pipeline configurations are possible?', options:['2×2×2×5 = 40','3+5 = 8','3×5 = 15','2³×5, computed differently as 8+5=13'], correct:0, exp:'Each of the 3 preprocessing steps independently has 2 states (applied or skipped), contributing a factor of 2 each: 2×2×2=8 preprocessing configurations. That is then combined with the 5 model choices via FPM (a full pipeline needs both a preprocessing configuration AND a model choice), giving 8×5=40 total distinct pipelines.'},
{q:'Why does the rule "and multiplies, or adds" require the "or" alternatives to be mutually exclusive (unable to happen together) in order to apply correctly?', options:['It does not actually require this — the rule works regardless of overlap','If two "or" alternatives could both occur or overlap in what they count, simply adding their individual counts would double-count the overlapping cases, giving an inflated total; the basic addition principle only guarantees a correct count when the alternatives are cleanly separate','Because addition is only defined for mutually exclusive events in general mathematics','Because multiplication always undercounts, so addition is used to compensate'], correct:1, exp:'If two counting scenarios overlap — some outcomes belong to both — naively adding their counts counts those overlapping outcomes twice, inflating the total. The Fundamental Principle of Addition as stated in this section assumes the alternatives are mutually exclusive precisely so that no such double-counting can occur; genuinely overlapping cases need the more careful inclusion-exclusion approach mentioned in the notes, not the basic FPA formula.'}
]},

{ id:'t16', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.4.1 Linear Permutation', notes: `
<p>A permutation is an arrangement — specifically, it cares about order. Three books of different colors placed on a shelf in the order Red-Green-White count as a different permutation from Green-Red-White, even though the same three books are involved both times.</p>
<h4>The formula</h4>
<p>The number of ways to arrange r items chosen from a pool of n distinct items, where order matters and no item repeats, is written ⁿPᵣ or P(n,r), and equals:</p>
<div class="formula-box">ⁿPᵣ = n! / (n−r)! = n × (n−1) × (n−2) × ... × (n−r+1)&nbsp;&nbsp;(r factors, counting down from n)</div>
<p>Two special cases are worth memorizing directly: ⁿP₀ = 1 (there is exactly one way to arrange zero items — do nothing), and ⁿPₙ = n! (arranging all n items at once is just the ordinary factorial).</p>
<div class="worked"><div class="label">Worked example</div>Arranging 3 books (Red, Green, White) two at a time: ³P₂ = 3!/(3−2)! = 6/1 = 6, matching the direct listing RG, GR, RW, WR, GW, WG. Arranging all three at once: ³P₃ = 3!/0! = 6/1 = 6, matching RGW, RWG, GRW, GWR, WRG, WGR.</div>
<h4>Permutations when the items are not all distinct</h4>
<p>If some items repeat — say p1 copies of one kind, p2 copies of a second kind, and so on up to pk kinds, with p1+p2+...+pk=n total items — then swapping identical copies with each other produces no visibly new arrangement. The repeated items' internal orderings need to be divided back out:</p>
<div class="formula-box">Number of distinct arrangements = n! / (p1! × p2! × ... × pk!)</div>
<div class="worked"><div class="label">Worked example</div>The word "BANANA" has 6 letters, with A repeated 3 times and N repeated 2 times (B appears once). The number of visibly distinct arrangements is 6!/(3!×2!) = 720/12 = 60 — far fewer than the 6!=720 you would get if every letter were treated as unique, because many of those 720 orderings are indistinguishable once the repeated A's and N's are treated as identical to each other.</div>
<h4>Permutations with repetition allowed</h4>
<p>A different situation entirely: if repetition of the same item is allowed at each of r positions (rather than being forbidden), each position independently offers all n choices again, giving:</p>
<div class="formula-box">Number of arrangements (repetition allowed) = nʳ</div>
<p>This is really just the Fundamental Principle of Multiplication applied r times in a row, since each of the r positions offers the same n options regardless of what was chosen at earlier positions — unlike ordinary permutation, where each choice shrinks the pool available for the next position.</p>
`,
questions:[
{q:'What is the key distinguishing feature of a permutation, compared to simply selecting a group of items?', options:['A permutation only ever uses 2 items','A permutation cares about the order of the items, so different orderings of the same items count as different permutations','A permutation never repeats any item','A permutation requires exactly n items, no more and no fewer'], correct:1, exp:'Order is the defining feature. Arranging books Red-Green in that order is a different permutation from Green-Red, even though the same two books are used — this is precisely why permutation counts (using the ⁿPᵣ formula) come out larger than combination counts for the same n and r, since combinations treat those two orderings as identical.'},
{q:'What is the formula for ⁿPᵣ, the number of ways to arrange r items chosen from n distinct items?', options:['n!/(n−r)!','n!/(r!(n−r)!)','n!×r!','n!/r!'], correct:0, exp:'ⁿPᵣ = n!/(n−r)! is the permutation formula — order matters, and no item repeats. (The second option, n!/(r!(n−r)!), is actually the combination formula, ⁿCᵣ, covered in the next section; the two formulas differ by exactly a factor of r!, which accounts for the r! different orderings of any given selected group.)'},
{q:'What does ⁿPₙ (arranging all n items at once) simplify to?', options:['n!','1','0','n'], correct:0, exp:'ⁿPₙ = n!/(n−n)! = n!/0! = n!/1 = n!. Arranging every single item from a pool of n, with none left over, is exactly what the plain factorial n! already counts — this is why the source material treats "arrange n distinct things in a line" and n! as interchangeable ideas.'},
{q:'What does ⁿP₀ equal, and why?', options:['0, since there is nothing to arrange','1, since there is exactly one way to arrange zero items — simply doing nothing','n, matching the pool size','Undefined, since arranging zero items makes no sense'], correct:1, exp:'ⁿP₀ = n!/(n−0)! = n!/n! = 1. There is exactly one way to "arrange" zero items: the empty arrangement. This matches the same convention that makes 0!=1 in the first place, and both conventions exist to keep formulas consistent at their boundary cases rather than needing special exceptions.'},
{q:'Compute ⁷P₃.', options:['210','35','5040','21'], correct:0, exp:'⁷P₃ = 7!/(7−3)! = 7!/4! = 7×6×5 = 210 (the 4! cancels, leaving exactly 3 factors counting down from 7, matching the "r factors" description of the formula).'},
{q:'In how many distinct ways can 5 differently-labeled test tubes be arranged in a row in a lab rack?', options:['5! = 120','5×4 = 20','2⁵ = 32','25'], correct:0, exp:'Arranging all 5 distinct tubes in a row, with none left out, is ⁵P₅ = 5! = 120. This is the direct real-world instance of "arrange all n distinct items," the special case ⁿPₙ=n! highlighted in the notes.'},
{q:'How many distinct 3-letter arrangements (no repeated letters) can be formed from the 5 letters A, B, C, D, E?', options:['⁵P₃ = 60','5³ = 125','⁵C₃ = 10','5×3 = 15'], correct:0, exp:'This is a straightforward permutation: 3 positions filled from a pool of 5 distinct letters, no repeats, order matters. ⁵P₃ = 5!/(5−3)! = 5×4×3 = 60.'},
{q:'How many distinct arrangements can be made of all the letters in the word "LEVEL"?', options:['5!/(2!×2!) = 30','5! = 120','5!/2! = 60','5×4×3×2×1, unadjusted'], correct:0, exp:'LEVEL has 5 letters, with L repeated twice and E repeated twice (V appears once). The formula for arranging items that are not all distinct divides out both sets of repeats: 5!/(2!×2!) = 120/4 = 30. Failing to divide by both repeat-counts (using just 5!=120, or dividing by only one 2!) is the most common error with this type of problem.'},
{q:'How many distinct arrangements can be made of all the letters in the word "STATISTICS"? (S appears 3 times, T appears 3 times, I appears 2 times, A and C each appear once; 10 letters total)', options:['10!/(3!×3!×2!) = 50,400','10! = 3,628,800','10!/(3!+3!+2!)','10!/(3×3×2)'], correct:0, exp:'With 10 total letters and repeat counts of 3 (S), 3 (T), and 2 (I), the formula divides the full 10! by the product 3!×3!×2! = 6×6×2 = 72, giving 3,628,800/72 = 50,400. Every repeated letter\'s internal shuffling needs its own factorial divided out — missing even one repeated letter\'s factorial in the denominator gives a badly inflated, incorrect count.'},
{q:'How many distinct 4-digit codes can be formed using the digits 0–9, if repetition of digits is allowed at every position?', options:['10⁴ = 10,000','10×9×8×7 = 5040','4¹⁰','40'], correct:0, exp:'Because repetition is allowed, each of the 4 positions independently offers all 10 digit choices, regardless of what was chosen at other positions — this is the nʳ formula (repetition-allowed arrangements), not the ordinary ⁿPᵣ formula (which would apply if repeats were forbidden, giving 10×9×8×7=5040 instead — a meaningfully smaller count).'},
{q:'A restriction enzyme recognition site in molecular biology is a short DNA sequence of exactly 6 bases, where each position can independently be A, C, G, or T (bases can repeat within the sequence). How many distinct 6-base sequences are possible?', options:['4⁶ = 4096','6⁴ = 1296','⁴P₆, which is undefined since you cannot choose 6 from only 4','6×4 = 24'], correct:0, exp:'Since bases are allowed to repeat at each of the 6 positions, this is the repetition-allowed formula nʳ with n=4 (bases) and r=6 (positions): 4⁶=4096. Notably, the ordinary permutation formula ⁿPᵣ would not even apply here (it requires r≤n when no repeats are allowed), which is exactly the tell that this is a repetition-allowed counting scenario, not a no-repeats one.'},
{q:'How many distinct arrangements are possible for a genetic sequence of 8 positions built from the letters A, A, A, G, G, C, C, T (that is, 3 A\'s, 2 G\'s, 2 C\'s, and 1 T)?', options:['8!/(3!×2!×2!) = 1680','8! = 40320','8!/3!×2!×2!, computed by multiplying instead of dividing','4⁸, treating it as repetition-allowed'], correct:0, exp:'This is a not-all-distinct arrangement problem: 8 total positions, with repeat counts 3 (A), 2 (G), 2 (C), and 1 (T, which does not need dividing since 1!=1 changes nothing). Dividing out all the repeats: 8!/(3!×2!×2!) = 40320/24 = 1680. This is exactly the same "how many distinguishable orderings of a sequence with repeated symbols" question bioinformatics tools answer when counting possible arrangements of a short genetic or protein motif.'},
{q:'A clinical coordinator needs to schedule 6 different follow-up calls to be made, one after another in some order, to 6 different patients today. How many distinct call orders are possible?', options:['6! = 720','6×5 = 30','2⁶ = 64','6 (only one sensible order exists)'], correct:0, exp:'Scheduling all 6 distinct calls into a specific sequence, with none skipped, is ⁶P₆=6!=720 — the plain factorial case of arranging every item in the pool, with order (which call is made first, second, and so on) mattering.'}
]},

{ id:'t17', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.4.2 Circular Permutation', notes: `
<p>Lining items up in a row and arranging them around a circle are subtly different problems, and the difference comes down to one thing: a row has a fixed starting point (the leftmost position), but a circle does not — there is no distinguished "first seat" the way there is a distinguished "first position" in a line.</p>
<p>Take four letters A, B, C, D arranged in a line: ABCD, BCDA, CDAB, DABC are four genuinely different linear arrangements. But wrap those same four letters around a circle, and all four of those linear arrangements describe the exact same circular arrangement — each is just a rotation of the others, and rotating a circle does not create a new seating pattern, only relabels which seat you call "first."</p>
<h4>The formula</h4>
<p>Since every circular arrangement of n items corresponds to exactly n different linear arrangements (one for each possible rotation), the number of distinct circular arrangements is the number of linear arrangements divided by n:</p>
<div class="formula-box">Circular permutations of n distinct items = n! / n = (n−1)!&nbsp;&nbsp;(when clockwise and counterclockwise orders count as different)</div>
<p>Some circular arrangements go a step further: if flipping the whole arrangement over (turning clockwise into counterclockwise) does not create a genuinely new pattern — as with a garland of flowers, which looks the same read either direction once strung and hung — then each distinct arrangement gets counted twice by the formula above (once per direction), and needs to be divided by 2 again:</p>
<div class="formula-box">Circular permutations, clockwise/counterclockwise not distinguished = (n−1)! / 2</div>
<p>Whether to divide by that extra factor of 2 depends entirely on the physical setup: people seated around a table are ordinarily still considered clockwise-distinct (there is a real difference between "who is to your left" and "who is to your right"), while a garland or a keychain of charms is typically not, since nothing distinguishes flipping it over.</p>
<div class="worked"><div class="label">Worked examples</div>10 students seated around a circular table: (10−1)! = 9! = 362,880 distinct arrangements. A garland made from 8 differently-colored flowers, where flipping the garland over gives the same-looking result: (8−1)!/2 = 7!/2 = 5040/2 = 2520 distinct garlands.</div>
<h4>When two specific people must sit together</h4>
<p>A common variation: treat the pair that must stay together as a single combined "block." If n people include 2 who must sit together, that leaves effectively (n−1) units to arrange in a circle — the block counts as one unit — giving (n−2)! arrangements of the units, multiplied by 2! for the two ways the pair can be internally ordered within their block.</p>
<div class="worked"><div class="label">Worked example</div>10 members seated around a round table, where two specific members must sit next to each other: treat those two as one combined block, leaving 9 units total (8 individuals + 1 block) to arrange circularly, giving (9−1)!=8!=40,320 arrangements of the units, times 2! for the pair's internal order, giving 40,320×2=80,640 total arrangements.</div>
`,
questions:[
{q:'Why does arranging n distinct items in a circle generally give fewer distinct arrangements than arranging the same n items in a line?', options:['Because circles are smaller than lines','Because a line has a fixed starting position, but a circle has no fixed starting point, so n different linear arrangements (rotations of each other) all correspond to the same single circular arrangement','Because circular arrangements are not allowed to repeat any item','Because there is no real difference — the counts are always identical'], correct:1, exp:'A line distinguishes its leftmost position, so shifting every item over by one spot genuinely changes the linear arrangement. A circle has no such fixed reference point — rotating everyone one seat over produces a seating that looks, and functionally is, the same circular arrangement. Since n rotations collapse into one circular arrangement, dividing the linear count n! by n produces the circular count.'},
{q:'What is the formula for the number of circular permutations of n distinct items, when clockwise and counterclockwise orders are considered genuinely different arrangements?', options:['(n−1)!','n!','n!/2','(n−1)!/2'], correct:0, exp:'Circular permutations = n!/n = (n−1)!, obtained by taking the n! linear arrangements and dividing out the n rotations that all describe the same circular arrangement. This is the standard formula used whenever direction (who sits to your left versus your right) matters, such as ordinary seating arrangements.'},
{q:'In how many distinct ways can 7 people be seated around a circular table (clockwise and counterclockwise seatings considered different)?', options:['(7−1)! = 6! = 720','7! = 5040','7×6 = 42','(7−1)!/2 = 360'], correct:0, exp:'Directly applying the circular permutation formula: (7−1)! = 6! = 720. This is smaller than the 5040 linear arrangements you would get lining the same 7 people up in a row, exactly because the circle has no fixed starting seat to distinguish rotations.'},
{q:'Under what circumstance should the circular permutation count be additionally divided by 2, beyond the basic (n−1)! formula?', options:['Whenever there are more than 5 items','When flipping the arrangement over (reversing clockwise and counterclockwise) does not create a genuinely new, distinguishable arrangement — as with a garland or a keychain','Whenever the items are not all distinct','Never — the extra division by 2 is not a real adjustment'], correct:1, exp:'The extra division by 2 accounts for situations where a clockwise arrangement and its mirror-image counterclockwise arrangement are physically indistinguishable — a garland strung with flowers looks the same read in either direction once it is hung up, so each visually distinct garland is being counted twice by the plain (n−1)! formula and needs the extra division.'},
{q:'How many distinct garlands can be made from 6 differently colored flowers, where flipping the garland over does not create a new-looking garland?', options:['(6−1)!/2 = 60','(6−1)! = 120','6! = 720','6!/2 = 360'], correct:0, exp:'Since flipping the garland does not create a distinguishable new pattern, the formula needs the extra division by 2: (6−1)!/2 = 5!/2 = 120/2 = 60.'},
{q:'A group therapy session seats 9 patients around a circle, with no two patients treated as interchangeable and clockwise/counterclockwise seatings genuinely distinct (each patient cares specifically who sits to their immediate left and right). How many distinct seating arrangements are possible?', options:['(9−1)! = 8! = 40,320','9! = 362,880','(9−1)!/2 = 20,160','9×8=72'], correct:0, exp:'This is the standard circular permutation case, with direction mattering (as it typically does for real seating, where "who is on my left" is a meaningfully different fact from "who is on my right"): (9−1)!=8!=40,320.'},
{q:'8 people are to be seated around a round table, but two specific people, X and Y, insist on sitting next to each other. How many distinct seating arrangements satisfy this requirement?', options:['(7−1)! × 2! = 720 × 2 = 1440','(8−1)! = 5040','7! = 5040','(6)! × 2! = 1440, coincidentally the same as the correct answer but via wrong reasoning'], correct:0, exp:'Treat X and Y as one combined block, leaving 6 individuals + 1 block = 7 units to arrange circularly: (7−1)!=6!=720 ways. Then multiply by 2! for the two internal orderings of X and Y within their block (X-then-Y or Y-then-X going around the circle): 720×2=1440.'},
{q:'A round-robin computing cluster assigns 5 processing nodes into a logical ring (a circular sequence) for a distributed algorithm, where each node\'s position relative to its immediate neighbors matters for the algorithm\'s correctness, but the ring has no distinguished "starting" node. How many distinct ring configurations are possible?', options:['(5−1)! = 4! = 24','5! = 120','5×4 = 20','(5−1)!/2 = 12'], correct:0, exp:'A logical ring with no distinguished starting point is structurally identical to a circular permutation: (5−1)!=4!=24 distinct configurations. This is a genuine computer-science instance of circular permutation — ring topologies in distributed systems and round-robin scheduling are exactly this kind of "arrangement with no fixed starting point" structure.'},
{q:'12 charms are to be strung onto a circular keychain loop, where flipping the keychain over produces an indistinguishable-looking loop (front and back look the same once assembled). How many distinct keychains are possible?', options:['(12−1)!/2 = 19,958,400','(12−1)! = 39,916,800','12!/2','12!'], correct:0, exp:'Since flipping the keychain does not create a new-looking arrangement, the extra division by 2 applies: (12−1)!/2 = 11!/2 = 39,916,800/2 = 19,958,400.'},
{q:'Why does the "two people must sit together" adjustment use (n−2)! for the units, multiplied by 2!, rather than simply plugging n directly into the ordinary (n−1)! formula?', options:['Because treating the pair as a single combined block reduces the effective number of units being arranged from n down to n−1 (n−2 individuals plus 1 block), and the 2! separately accounts for the two internal orders within that block — two adjustments the plain (n−1)! formula does not capture on its own','Because (n−2)! and 2! are just simpler numbers to compute','Because the ordinary formula only works for even values of n','There is no real reason — both formulas always give the same answer regardless'], correct:0, exp:'Bundling the required pair into one unit changes what is actually being arranged: instead of n separate items, you now have (n−2) individuals plus 1 combined block, totaling (n−1) units, which get arranged circularly using (n−1−1)!=(n−2)! (matching the (n-1)-unit circular formula). Separately, the two people within that block can be ordered two different ways, contributing the extra factor of 2!. Directly plugging n into the plain (n−1)! formula would ignore the joint constraint entirely, since that formula assumes every item is independently placeable anywhere around the circle.'}
]},

{ id:'t18', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.5–10.6 Combination: Choosing Without Order', notes: `
<p>Permutation counted arrangements — where order matters. This section covers <strong>combination</strong>, which counts selections, groups, or draws where order is irrelevant. Choosing a committee of {Alice, Bob, Carol} is the same combination as choosing {Bob, Carol, Alice} — same group, same people, no ordering attached to how you name them.</p>
<h4>The formula</h4>
<div class="formula-box">ⁿCᵣ = n! / (r! × (n−r)!)&nbsp;&nbsp;(also written C(n,r) or the binomial coefficient (n choose r))</div>
<p>Notice this is exactly the permutation formula ⁿPᵣ = n!/(n−r)! divided by an extra r!. That extra division is the entire story of how combination relates to permutation: every unordered group of r items corresponds to exactly r! different ordered arrangements (all the ways to shuffle that same group into a sequence), so dividing the permutation count by r! collapses all those equivalent orderings down to the single underlying group they represent.</p>
<div class="worked"><div class="label">Worked example</div>Choosing 2 books from 3 (Red, Green, White), without regard to order: ³C₂ = 3!/(2!×1!) = 6/2 = 3, matching the three possible pairs {R,G}, {R,W}, {G,W}. Compare this to ³P₂=6 from the permutation section — exactly twice as many, since each pair of books can be ordered 2!=2 ways (RG or GR, for instance), and 3×2!=6 recovers the permutation count.</p>
<h4>Choosing between permutation and combination</h4>
<p>The single question that resolves which formula applies: <strong>does the order of selection matter to the outcome being counted?</strong></p>
<div class="formula-box">Order matters → use permutation (ⁿPᵣ)&nbsp;&nbsp;&nbsp;&nbsp;Order does not matter → use combination (ⁿCᵣ)</div>
<p>Choosing a president and a vice-president from a group of 10 people is a permutation problem, because "Alice president, Bob VP" is a genuinely different outcome from "Bob president, Alice VP" — the same two people, assigned to different roles. Choosing an unranked 2-person subcommittee from the same group of 10 is a combination problem, because {Alice, Bob} is simply one committee, with no distinction between the two ways of naming its members.</p>
<div class="worked"><div class="label">Worked example</div>Six cricket teams, each playing exactly one match against every other team. Since a match between Team A and Team B is the same single match regardless of which team is named first, the number of matches is a combination: ⁶C₂ = 6!/(2!×4!) = 15. (If instead we were counting "which team plays at home versus away" for each pairing, that assignment would make order matter, turning it into a permutation problem instead — ⁶P₂=30 — illustrating how the same underlying set of teams gives a different count depending on what exactly is being asked.)</div>
<h4>Combining across independent selections</h4>
<p>When a problem asks for combinations from two or more separate pools — like choosing some red balls and some white balls from separate groups — the Fundamental Principle of Multiplication from section 10.3 applies again: compute each pool's combination count separately, then multiply them together.</p>
<div class="worked"><div class="label">Worked example</div>A bag contains 4 red and 7 white balls. Drawing exactly 2 red and 3 white balls: ⁴C₂ × ⁷C₃ = 6 × 35 = 210. The two selections (which reds, which whites) are independent choices, so their counts multiply, exactly as FPM describes for any two independent tasks performed together.</div>
`,
questions:[
{q:'What is the defining difference between a permutation and a combination of the same n items taken r at a time?', options:['Permutations require repetition; combinations forbid it','Permutation counts arrangements where order matters; combination counts selections where order does not matter','Combinations always produce a larger count than permutations','There is no real difference — the two terms are interchangeable'], correct:1, exp:'Order is the entire distinction. The same underlying group of r items corresponds to exactly r! different orderings, all of which count separately in a permutation but collapse into a single count in a combination — which is exactly why ⁿCᵣ = ⁿPᵣ/r!, always giving a combination count that is smaller than (or, when r≤1, equal to) the corresponding permutation count.'},
{q:'What is the formula for ⁿCᵣ?', options:['n!/(r!(n−r)!)','n!/(n−r)!','n!×r!','n!/r!, without the (n−r)! term'], correct:0, exp:'ⁿCᵣ = n!/(r!×(n−r)!). Compare this to the permutation formula ⁿPᵣ=n!/(n−r)! — combination has the exact same numerator and (n−r)! denominator, but with an extra r! divided out, accounting for the r! orderings within each selected group that combination treats as identical.'},
{q:'Compute ⁶C₂.', options:['15','30','12','3'], correct:0, exp:'⁶C₂ = 6!/(2!×4!) = (6×5)/(2×1) = 30/2 = 15. Notice this matches ⁶P₂/2! = 30/2 = 15 as well — computing via the permutation-then-divide-by-r! route always gives the same answer as the direct combination formula.'},
{q:'A study needs to select an unranked sample of 4 patients from a pool of 12 eligible patients, where the order of selection has no bearing on the sample (all 4 selected patients are simply enrolled together, with no distinct roles). How should this be counted?', options:['As a combination, ¹²C₄ = 495','As a permutation, ¹²P₄ = 11,880','As 12×4 = 48','As 4¹²'], correct:0, exp:'Since the 4 selected patients form an unranked group with no distinguishing roles, order of selection is irrelevant, making this a combination problem: ¹²C₄ = 12!/(4!×8!) = (12×11×10×9)/24 = 11,880/24 = 495.'},
{q:'A study needs to assign 3 different roles (Lead Investigator, Data Analyst, Study Coordinator) to 3 people chosen from a pool of 10 qualified researchers, with each person filling exactly one distinct role. How should this be counted?', options:['As a permutation, ¹⁰P₃ = 720','As a combination, ¹⁰C₃ = 120','As 10×3 = 30','As 3¹⁰'], correct:0, exp:'Because the three roles are distinct — assigning Researcher A as Lead Investigator is a genuinely different outcome from assigning Researcher A as Data Analyst — order (in the sense of which specific role each person gets) matters here, making this a permutation problem: ¹⁰P₃ = 10×9×8 = 720.'},
{q:'A machine learning engineer wants to select an unordered subset of 5 features to include in a model, out of 20 available features, where the order features are listed in has no effect on the resulting model. How many distinct feature subsets are possible?', options:['²⁰C₅ = 15,504','²⁰P₅ = 1,860,480','20×5 = 100','5²⁰'], correct:0, exp:'Feature selection cares only about which features end up in the final subset, not the order they were considered or listed in, making this a combination: ²⁰C₅ = 20!/(5!×15!) = 15,504.'},
{q:'8 cricket teams each play exactly one match against every other team in a round-robin tournament. How many total matches are played?', options:['⁸C₂ = 28','⁸P₂ = 56','8! = 40320','8×8 = 64'], correct:0, exp:'A match between Team A and Team B is the same single match regardless of which team you name first — there is no separate "A vs B" match and "B vs A" match being counted, so this is a combination: ⁸C₂ = 8!/(2!×6!) = (8×7)/2 = 28.'},
{q:'A bag contains 5 red balls and 6 blue balls. In how many ways can you draw exactly 3 red balls and 2 blue balls?', options:['⁵C₃ × ⁶C₂ = 10 × 15 = 150','⁵C₃ + ⁶C₂ = 10 + 15 = 25','⁵P₃ × ⁶P₂','¹¹C₅ = 462, treating all 11 balls as one pool'], correct:0, exp:'The two draws (which reds, which blues) are independent selections from two separate pools, so their individual combination counts multiply via FPM: ⁵C₃=10 and ⁶C₂=15, giving 10×15=150. Treating all 11 balls as one undifferentiated pool (the fourth option) would ignore the requirement of getting exactly 3 red and exactly 2 blue specifically, rather than any 5 balls from the mixed bag.'},
{q:'A diagnostics panel requires selecting 2 blood tests from a set of 6 available blood tests, AND 1 imaging test from a set of 4 available imaging tests, to be run together as a single panel. How many distinct panels are possible?', options:['⁶C₂ × ⁴C₁ = 15 × 4 = 60','⁶C₂ + ⁴C₁ = 15 + 4 = 19','⁶P₂ × ⁴P₁','¹⁰C₃ = 120, treating all 10 tests as one pool'], correct:0, exp:'Selecting which blood tests AND which imaging test are both needed together for one complete panel, and each selection is unordered within its own category, so this is two independent combinations multiplied via FPM: ⁶C₂=15 (blood tests) times ⁴C₁=4 (imaging tests), giving 60 distinct panels.'},
{q:'Why does ⁿCᵣ always come out smaller than or equal to ⁿPᵣ for the same n and r (with equality only when r=0 or r=1)?', options:['Because combination and permutation are actually unrelated formulas that happen to look similar','Because ⁿCᵣ = ⁿPᵣ / r!, and dividing by r! (which is 1 or larger for r≥0) can only shrink or leave unchanged the original permutation count, never enlarge it','Because combinations are only defined for small values of n','Because permutation formulas contain a typo and should equal combination formulas'], correct:1, exp:'The direct relationship ⁿCᵣ = ⁿPᵣ/r! makes this inevitable: r! is 1 when r=0 or r=1 (leaving the two formulas equal), but grows larger for any r≥2, meaning the permutation count gets divided into a strictly smaller combination count whenever there is more than one way to order the selected items — exactly the "collapsing equivalent orderings into one group" idea that defines what a combination is.'}
]},

{ id:'t19', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.7 Requiring or Barring Specific Items', notes: `
<p>A natural refinement of both permutation and combination problems: what happens when the selection or arrangement is required to include certain specific items, or is required to exclude them? Both cases reduce cleanly to a smaller, ordinary counting problem once you account for the fixed items separately.</p>
<h4>Combinations with required inclusions or exclusions</h4>
<div class="formula-box">
s particular items always INCLUDED, choosing r from n total: <sup>n−s</sup>C<sub>r−s</sub><br>
s particular items always EXCLUDED, choosing r from n total: <sup>n−s</sup>C<sub>r</sub>
</div>
<p>The logic behind "always included" is direct: if s specific items are guaranteed spots in the selection, those s spots and s items are already settled, so what remains is choosing the rest of the group — (r−s) more items — from whatever is left after removing the s guaranteed items from consideration, which is (n−s) items. Hence <sup>n−s</sup>C<sub>r−s</sub>.</p>
<p>The logic behind "always excluded" is even more direct: if s specific items can never be chosen, they are simply removed from the pool entirely before selecting begins, leaving an ordinary combination of r items from a smaller pool of (n−s) items — hence <sup>n−s</sup>C<sub>r</sub>, with the r unchanged since nothing about how many items still need choosing has changed, only how many are available to choose from.</p>
<div class="worked"><div class="label">Worked example</div>Selecting 15 players for a squad out of 21 total available players. If 3 particular star players must always be included: the 3 spots and players are settled, leaving 15−3=12 more spots to fill from the remaining 21−3=18 players, giving <sup>18</sup>C<sub>12</sub>=18,564. If instead 2 particular injured players must always be excluded: remove them from the pool entirely, leaving an ordinary selection of 15 players from 21−2=19 available players, giving <sup>19</sup>C<sub>15</sub>=3876.</div>
<h4>The same logic for permutations (arrangements)</h4>
<div class="formula-box">
s particular items always INCLUDED, arranging r from n total: <sup>n−s</sup>P<sub>r−s</sub> × <sup>r</sup>P<sub>s</sub><br>
s particular items always EXCLUDED, arranging r from n total: <sup>n−s</sup>P<sub>r</sub>
</div>
<p>The exclusion case for permutations mirrors combination exactly — remove the barred items from the pool, then arrange normally from what remains. The inclusion case needs one extra step beyond combination's logic, because arrangement also cares about position: first choose which (r−s) non-required items join the s required ones (handled by treating it as filling the remaining slots from the remaining pool, <sup>n−s</sup>P<sub>r−s</sub>), then separately account for the <sup>r</sup>P<sub>s</sub> ways the s required items themselves can be slotted among the r total positions.</p>
<div class="worked"><div class="label">Worked example</div>Forming 5-letter arrangements from the 8 letters a,b,c,d,e,f,g,h. If letters a and b must always appear somewhere in the 5-letter word: <sup>8−2</sup>P<sub>5−2</sub> × <sup>5</sup>P<sub>2</sub> = ⁶P₃ × ⁵P₂ = 120 × 20 = 2400. If instead letters a, c, d must always be excluded: <sup>8−3</sup>P<sub>5</sub> = ⁵P₅ = 120.</div>
`,
questions:[
{q:'For choosing r items from a pool of n, if s particular items must always be included, what is the formula for the number of valid selections?', options:['ⁿ⁻ˢCᵣ₋ₛ','ⁿCᵣ, unchanged','ⁿ⁻ˢCᵣ','ˢCᵣ'], correct:0, exp:'With s specific items guaranteed to be in every selection, those spots are already settled — what remains is choosing (r−s) more items from the (n−s) items left over after setting aside the s required ones. That gives ⁿ⁻ˢCᵣ₋ₛ, the formula from this section for the "always included" combination case.'},
{q:'For choosing r items from a pool of n, if s particular items must always be excluded, what is the formula for the number of valid selections?', options:['ⁿ⁻ˢCᵣ','ⁿ⁻ˢCᵣ₋ₛ','ⁿCᵣ, unchanged','ˢCᵣ'], correct:0, exp:'Excluding s specific items simply shrinks the available pool to (n−s) items, with the number still needing to be chosen, r, unaffected — this is an ordinary combination from a smaller pool: ⁿ⁻ˢCᵣ. Notice this formula is simpler than the inclusion case, since exclusion does not require settling any spots in advance the way inclusion does.'},
{q:'A committee of 6 is to be chosen from 15 eligible members, with one particular senior member always required to be on the committee. How many valid committees are possible?', options:['¹⁴C₅ = 2002','¹⁵C₆ = 5005','¹⁴C₆ = 3003','¹⁵C₅ = 3003'], correct:0, exp:'With s=1 required member settled, choose the remaining r−s=5 committee spots from n−s=14 remaining eligible members: ¹⁴C₅ = 14!/(5!×9!) = 2002.'},
{q:'A committee of 6 is to be chosen from 15 eligible members, with two particular members always barred from serving (perhaps due to a conflict of interest). How many valid committees are possible?', options:['¹³C₆ = 1716','¹⁵C₆ = 5005','¹³C₄','¹⁵C₄ = 1365'], correct:0, exp:'With s=2 members excluded from the pool entirely, the available pool shrinks to n−s=13, and the number still to be chosen remains r=6 (unaffected by exclusion): ¹³C₆ = 13!/(6!×7!) = 1716.'},
{q:'Which of the following correctly describes why the "always included" combination formula, ⁿ⁻ˢCᵣ₋ₛ, subtracts s from BOTH n and r, while the "always excluded" formula, ⁿ⁻ˢCᵣ, subtracts s only from n?', options:['This is simply an arbitrary convention with no underlying reason','Including s items settles both s of the required selections (reducing r−s remaining to choose) and removes those s items from further consideration (reducing the pool to n−s); excluding s items only removes them from the pool (reducing n by s) without settling any of the r spots still needing to be filled','Both formulas actually subtract s from both n and r, and the excluded case is written incorrectly in this unit','Subtracting from r is only needed when s is greater than 3'], correct:1, exp:'Guaranteeing s items a spot changes two things at once: it uses up s of the r total spots you needed to fill (leaving r−s spots still open), and it removes those same s items from the pool you are choosing the remaining spots from (leaving n−s available). Excluding s items only changes the second thing — the pool shrinks by s — since none of the r spots have been pre-filled by the excluded items; every one of the r spots still needs to be chosen from what remains.'},
{q:'How many 4-letter arrangements are possible using the 7 letters p,q,r,s,t,u,v, if the letters p and q must always both appear somewhere in the arrangement?', options:['⁵P₂ × ⁴P₂ = 20 × 12 = 240','⁷P₄ = 840, unchanged','⁵P₄ = 840','⁵C₂ × ⁴P₂'], correct:0, exp:'Using the inclusion formula for arrangements with n=7, r=4, s=2: ⁿ⁻ˢPᵣ₋ₛ × ʳPₛ = ⁵P₂ × ⁴P₂ = (5×4) × (4×3) = 20 × 12 = 240. The first factor arranges the 2 non-required letters into the remaining slots (from the 5 letters left after setting aside p and q), and the second factor accounts for the 4×3=12 ways to slot p and q themselves among the 4 total positions.'},
{q:'How many 4-letter arrangements are possible using the 7 letters p,q,r,s,t,u,v, if the letters p, q, and r must always be excluded?', options:['⁴P₄ = 24','⁷P₄ = 840','³P₄, which is undefined since you cannot arrange 4 items from only 3','⁴C₄ = 1'], correct:0, exp:'Excluding s=3 letters shrinks the usable pool to n−s=7−3=4 letters, and all r=4 positions still need filling from what remains: ⁿ⁻ˢPᵣ = ⁴P₄ = 4! = 24.'},
{q:'A network security team of 8 analysts must be selected from a pool of 20 candidates, with one specific senior analyst (the team lead-designate) required to be included AND one specific candidate (currently under a conflict-of-interest review) required to be excluded. How should this be counted?', options:['Apply both adjustments together: settle the required inclusion first (choose the remaining 7 spots from the 19 candidates left after setting aside the required member), then remove the excluded candidate from that remaining pool before choosing — giving ¹⁸C₇','Simply compute ²⁰C₈ and ignore both constraints','Apply only the inclusion adjustment and ignore the exclusion','Apply only the exclusion adjustment and ignore the inclusion'], correct:0, exp:'Both constraints reduce the effective pool: the required member settles 1 of the 8 spots, leaving 7 more to choose, and the excluded candidate is removed from consideration entirely. Combining both effects: starting from 20 candidates, remove 1 required (accounted for separately) and 1 excluded, leaving 18 candidates to choose the remaining 7 spots from: ¹⁸C₇. Real-world team-selection problems often combine inclusion and exclusion constraints exactly like this, and the two adjustments from this section combine additively on the pool size.'},
{q:'In a clinical trial, 10 patients need to be selected from 30 eligible candidates for a treatment arm, with 4 particular high-risk patients always required to be included (for safety monitoring reasons). How many valid selections of the treatment arm are possible?', options:['²⁶C₆ = 230,230','³⁰C₁₀ = 30,045,015','²⁶C₁₀','⁴C⁴ × ²⁶C⁶'], correct:0, exp:'With s=4 patients guaranteed inclusion, the remaining r−s=6 spots are filled from the n−s=26 remaining eligible candidates: ²⁶C₆ = 26!/(6!×20!) = 230,230. This is the direct clinical-trial version of the same inclusion formula used for sports team or committee selection — the mathematics does not care what the items being selected represent.'}
]},

{ id:'t20', unit:'Unit 10 · Counting & Binomial Theorem', title:'10.8 The Binomial Theorem', notes: `
<p>Squaring or cubing a two-term expression by hand, (a+b)² or (a+b)³, is manageable. But (a+b)¹⁰ by repeated multiplication would be miserable. The binomial theorem gives a direct formula for (a+b)ⁿ, and — appropriately for a unit on counting — the coefficients that appear in that formula are exactly the combination counts ⁿCᵣ from the previous sections.</p>
<h4>Positive integral index</h4>
<div class="formula-box">(a+b)ⁿ = ⁿC₀aⁿb⁰ + ⁿC₁aⁿ⁻¹b¹ + ⁿC₂aⁿ⁻²b² + ... + ⁿCₙa⁰bⁿ = Σᵣ ⁿCᵣ aⁿ⁻ʳbʳ</div>
<p>Four patterns make this formula easy to reconstruct from memory rather than look up each time: the coefficients ⁿC₀, ⁿC₁, ..., ⁿCₙ are called the binomial coefficients; the exponent on a starts at n and counts down to 0 across the terms; the exponent on b starts at 0 and counts up to n; and in every single term, the two exponents always add up to n, the original power.</p>
<div class="worked"><div class="label">Worked example</div>Expand (x+2)⁵. Using n=5, the coefficients are ⁵C₀=1, ⁵C₁=5, ⁵C₂=10, ⁵C₃=10, ⁵C₄=5, ⁵C₅=1. Plugging in a=x, b=2: (x+2)⁵ = x⁵ + 5x⁴(2) + 10x³(4) + 10x²(8) + 5x(16) + 1(32) = x⁵ + 10x⁴ + 40x³ + 80x² + 80x + 32.</div>
<p>Subtraction is handled by treating it as addition of a negative: (a−b)ⁿ = (a+(−b))ⁿ, which simply makes every odd-numbered term in the expansion negative (since (−b) raised to an odd power stays negative, while raised to an even power turns positive again).</p>
<h4>Rational index</h4>
<p>The formula above only terminates — stops after n+1 terms — because n is a positive whole number, which eventually makes ⁿCᵣ equal to zero once r exceeds n. For a rational (fractional or negative) exponent n, that natural stopping point disappears, and the expansion becomes an infinite series instead:</p>
<div class="formula-box">(1+x)ⁿ = 1 + nx + [n(n−1)/2!]x² + [n(n−1)(n−2)/3!]x³ + ...&nbsp;&nbsp;&nbsp;&nbsp;valid only when |x| &lt; 1</div>
<p>The restriction |x|&lt;1 is essential here and has no counterpart in the positive-integer case: without it, the infinite series of terms need not settle down to a finite sum at all. For a general (a+b)ⁿ with rational n, factor out whichever of a or b has the larger magnitude first, so the remaining ratio inside the parentheses is guaranteed to be less than 1 in size.</p>
<div class="worked"><div class="label">Worked example</div>Expand (1−2x)^(1/2) using the rational-index formula, up to the x² term: with n=1/2, treating the "x" of the formula as −2x, the terms are 1 + (1/2)(−2x) + [(1/2)(−1/2)/2](−2x)² + ... = 1 − x + (−1/8)(4x²) + ... = 1 − x − x²/2 + ..., valid for |2x|&lt;1, i.e. |x|&lt;1/2.</div>
`,
questions:[
{q:'In the binomial expansion (a+b)ⁿ = ΣᵣⁿCᵣaⁿ⁻ʳbʳ, what pattern does the exponent on a follow across the terms?', options:['It stays fixed at n throughout','It starts at n and decreases by 1 in each successive term, down to 0','It starts at 0 and increases up to n','It always equals the exponent on b'], correct:1, exp:'The exponent on a begins at n (in the very first term, ⁿC₀aⁿb⁰) and counts down by 1 with each successive term, reaching 0 in the final term (ⁿCₙa⁰bⁿ). This countdown pattern, paired with b\'s matching count-up pattern, is one of the two easiest ways to reconstruct the expansion\'s structure from memory.'},
{q:'In the same expansion, what pattern does the exponent on b follow?', options:['It stays fixed at 0','It starts at n and decreases to 0','It starts at 0 and increases by 1 in each successive term, up to n','It always equals n minus the term number'], correct:2, exp:'b\'s exponent starts at 0 (first term) and climbs by 1 each term, ending at n (final term) — the mirror image of a\'s countdown pattern. Together, a\'s exponent plus b\'s exponent always sums to exactly n in every single term, which is a handy self-check when expanding by hand.'},
{q:'What are the coefficients ⁿCᵣ in the binomial expansion of (a+b)ⁿ called?', options:['Characteristic values','Binomial coefficients','Eigenvalues','Permutation coefficients'], correct:1, exp:'The coefficients ⁿC₀, ⁿC₁, ..., ⁿCₙ that appear in the binomial expansion are called binomial coefficients. They are literally the same combination values from section 10.5 — ⁿCᵣ counts how many of the r-many-b, (n−r)-many-a terms combine to form the aⁿ⁻ʳbʳ term when (a+b) is multiplied out n times.'},
{q:'Expand (x+1)⁴ using the binomial theorem.', options:['x⁴ + 4x³ + 6x² + 4x + 1','x⁴ + 4x³ + 4x² + 4x + 1','x⁴ + 1','x⁴ + 4x³ + 6x²+4x+4'], correct:0, exp:'Using n=4, the binomial coefficients are ⁴C₀=1, ⁴C₁=4, ⁴C₂=6, ⁴C₃=4, ⁴C₄=1. With a=x, b=1 (so every power of b is just 1), the expansion is x⁴ + 4x³ + 6x² + 4x + 1 — the classic, easily memorized row of Pascal\'s Triangle (1,4,6,4,1) as the coefficients.'},
{q:'Expand (x+2)⁵ using the binomial theorem.', options:['x⁵ + 10x⁴ + 40x³ + 80x² + 80x + 32','x⁵ + 5x⁴ + 10x³ + 10x² + 5x + 2','x⁵ + 10x⁴ + 20x³ + 40x² + 80x + 160','x⁵ + 2x⁴ + 4x³ + 8x² + 16x + 32'], correct:0, exp:'With n=5, coefficients ⁵C₀..⁵C₅ = 1,5,10,10,5,1. Substituting a=x, b=2: ⁵C₁x⁴(2)=5x⁴×2=10x⁴; ⁵C₂x³(2²)=10x³×4=40x³; ⁵C₃x²(2³)=10x²×8=80x²; ⁵C₄x(2⁴)=5x×16=80x; ⁵C₅(2⁵)=32. Assembling: x⁵+10x⁴+40x³+80x²+80x+32. The powers of 2 growing at each term (2,4,8,16,32) is exactly what makes the coefficients grow faster than the plain binomial coefficients alone would suggest.'},
{q:'Expand (x−1)³ using the binomial theorem, treating subtraction as addition of a negative term.', options:['x³ − 3x² + 3x − 1','x³ + 3x² + 3x + 1','x³ − 3x² − 3x − 1','x³ − 1'], correct:0, exp:'Writing (x+(−1))³ and using coefficients ³C₀..³C₃=1,3,3,1: x³ + 3x²(−1) + 3x(−1)² + (−1)³ = x³ − 3x² + 3x − 1. Every odd-position term (the ones with an odd power of the negative term) flips to negative, while even-position terms (even powers of the negative term) stay positive, since a negative number raised to an even power becomes positive again.'},
{q:'What is the sum of all the binomial coefficients ⁿC₀+ⁿC₁+...+ⁿCₙ, for any positive integer n? (Hint: consider what (1+1)ⁿ expands to.)', options:['2ⁿ','n!','n²','n(n+1)/2'], correct:0, exp:'Setting a=1 and b=1 in (a+b)ⁿ = ΣⁿCᵣaⁿ⁻ʳbʳ turns every term into just ⁿCᵣ (since 1 raised to any power is still 1), so the sum of all the coefficients equals (1+1)ⁿ=2ⁿ. This is a classic, useful identity — the row of Pascal\'s Triangle for row n always sums to 2ⁿ, a fact you can verify directly against the (1,4,6,4,1) row above: 1+4+6+4+1=16=2⁴.'},
{q:'For a rational (non-integer, or negative) exponent n, what happens to the binomial expansion of (1+x)ⁿ compared to the positive-integer case?', options:['The expansion still stops after n+1 terms, unchanged','The expansion no longer naturally terminates and becomes an infinite series, valid only when |x| < 1','The expansion becomes undefined entirely','The expansion only works for negative values of x'], correct:1, exp:'The positive-integer case terminates because ⁿCᵣ becomes exactly zero once r exceeds n (there is nothing left to choose beyond the full set of n items). For a rational n, that combinatorial interpretation, and the resulting zeroing-out, no longer applies, so the series continues indefinitely — and for the infinite sum of terms to actually settle down to a finite value, the restriction |x|<1 becomes essential, unlike the positive-integer case which places no such restriction on x.'},
{q:'Using the rational-index binomial formula, what are the first three terms of the expansion of (1+x)^(-1)?', options:['1 − x + x²','1 + x + x²','1 − x − x²','1 + (−1)x + x²/2'], correct:0, exp:'With n=−1: the linear term is nx=−x. The quadratic term is [n(n−1)/2!]x² = [(−1)(−2)/2]x² = [2/2]x² = x². So the expansion begins 1 − x + x² − ... (this is in fact the well-known geometric series 1/(1+x) = 1−x+x²−x³+..., valid for |x|<1, arising as a special case of the general rational-index binomial formula.)'},
{q:'Before applying the rational-index binomial formula to expand (a+b)ⁿ where n is not a positive integer, why is it necessary to factor out whichever of a or b has the larger magnitude first?', options:['It is not actually necessary — the formula works directly on (a+b)ⁿ as written, regardless of magnitudes','The formula (1+x)ⁿ requires the "x" term to satisfy |x|<1 for the resulting infinite series to converge to a finite sum; factoring out the larger-magnitude term first guarantees the remaining ratio inside the parentheses is less than 1 in size','Factoring is only a stylistic preference with no mathematical necessity','Because a and b must always be positive for the formula to apply'], correct:1, exp:'The rational-index formula is stated for (1+x)ⁿ specifically, requiring |x|<1 for convergence. Applying it to a general (a+b)ⁿ means rewriting it as (larger)ⁿ(1 + smaller/larger)ⁿ, so that the ratio playing the role of "x" is guaranteed to have magnitude less than 1 — factoring out the larger term first is exactly what manufactures that guarantee, and skipping this step risks applying the formula outside its valid range.'},
{q:'In statistics, the binomial probability formula for exactly k successes in n independent trials, each with success probability p, is P(k) = ⁿCₖ pᵏ(1−p)ⁿ⁻ᵏ. How does this formula directly reuse the structure of the binomial theorem covered in this section?', options:['It does not — the resemblance in name is a coincidence','It is literally one term of the binomial expansion of (p+(1−p))ⁿ, using the same ⁿCₖ coefficients and the same "exponents summing to n" pattern, applied to a probability p and its complement (1−p) instead of two abstract algebraic variables a and b','The formula uses factorial notation but has no other connection to this section','The formula only works when n is irrational'], correct:1, exp:'Expanding (p+(1−p))ⁿ using the binomial theorem produces exactly the terms ⁿCₖpᵏ(1−p)ⁿ⁻ᵏ, summed over k from 0 to n — and since p+(1−p)=1, the whole expansion sums to 1ⁿ=1, confirming that the binomial probabilities across all possible values of k properly add up to a total probability of 1. This is precisely why the distribution is named "binomial": it is built directly from the binomial theorem, applied to a probability of success and a probability of failure instead of two generic algebraic terms.'},
{q:'A redundant server cluster has 5 independent servers, each with a 0.9 probability of staying online during a given hour. Using the binomial framework (treating "online" as a success with p=0.9), which single term of the expansion of (0.9+0.1)⁵ gives the probability that exactly 4 of the 5 servers stay online?', options:['⁵C₄ (0.9)⁴(0.1)¹','⁵C₄ (0.9)¹(0.1)⁴','⁵C₁ (0.9)⁴(0.1)¹','(0.9)⁴ alone, without any binomial coefficient'], correct:0, exp:'Exactly 4 successes (servers online) out of 5 trials, with success probability 0.9 and failure probability 0.1, corresponds to the term ⁿCₖpᵏ(1−p)ⁿ⁻ᵏ with n=5, k=4: ⁵C₄(0.9)⁴(0.1)¹. The binomial coefficient ⁵C₄=5 accounts for the 5 different ways to choose which one of the five servers is the one that goes offline, while the other four stay online — omitting that coefficient (as the fourth option does) would undercount all the different arrangements that produce the same "4 online, 1 offline" outcome.'}
]},
{ id:'t21', unit:'Unit 11 · Limit and Continuity', title:'11.2–11.3 The Idea of a Limit, and Direct Substitution', notes: `
<p>Up to now, evaluating a function f(x) has meant plugging in a specific value of x and reading off the result. This unit asks a subtly different question: as x gets closer and closer to some value a — without necessarily ever reaching it — what value does f(x) get closer and closer to?</p>
<p>Take f(x)=3x+2 and watch what happens as x creeps toward 2. From the left: x=1.9 gives f(x)=7.7; x=1.98 gives 7.94; x=1.998 gives 7.994 — always getting nearer to 8. From the right: x=2.1 gives 8.3; x=2.01 gives 8.03; x=2.001 gives 8.003 — again closing in on 8, just from the other side. Both directions squeeze toward the same number, 8, and that shared destination is called the <strong>limit</strong> of f(x) as x approaches 2:</p>
<div class="formula-box">lim(x→a) f(x) = l&nbsp;&nbsp;&nbsp;&nbsp;means: as x gets arbitrarily close to a (without necessarily equaling a), f(x) gets arbitrarily close to l</div>
<p>Notice what the limit does <em>not</em> require: it never asks what f(a) itself equals, or even whether f is defined at a at all. The limit is entirely about the approach, not the destination — a distinction that becomes essential once continuity enters the picture in section 11.7.</p>
<h4>Direct Substitution Method (DSM)</h4>
<p>For the overwhelming majority of "nice" functions — polynomials especially — the limit as x→a really does just equal f(a): plug a directly in for x and evaluate. This is the Direct Substitution Method, and it works whenever f(x) does not misbehave at x=a.</p>
<div class="worked"><div class="label">Worked example</div>lim(x→2) (x²−3x+5) = (2)²−3(2)+5 = 4−6+5 = 3. No trickery needed — a polynomial's limit at any point is simply its value there.</div>
<h4>Algebra of limits</h4>
<p>DSM extends smoothly across combinations of functions, provided the individual limits involved actually exist:</p>
<div class="formula-box">
lim[f(x)+g(x)] = lim f(x) + lim g(x)&nbsp;&nbsp;&nbsp;&nbsp;lim[f(x)−g(x)] = lim f(x) − lim g(x)<br>
lim[f(x)g(x)] = [lim f(x)][lim g(x)]&nbsp;&nbsp;&nbsp;&nbsp;lim[f(x)/g(x)] = [lim f(x)]/[lim g(x)], provided lim g(x)≠0<br>
lim[kf(x)] = k·lim f(x)&nbsp;&nbsp;(k a constant)&nbsp;&nbsp;&nbsp;&nbsp;lim k = k&nbsp;&nbsp;(the limit of a constant is itself)<br>
lim √[f(x)] = √[lim f(x)]&nbsp;&nbsp;&nbsp;&nbsp;lim log[f(x)] = log[lim f(x)]&nbsp;&nbsp;&nbsp;&nbsp;lim e^f(x) = e^(lim f(x))
</div>
<p>These rules are the quiet workhorses behind every limit computation in this unit — they justify breaking a complicated expression into simpler pieces, evaluating each piece separately, and recombining the results, rather than requiring some entirely different technique for every new combination of functions.</p>
<div class="worked"><div class="label">Worked example, combined</div>lim(x→1) log(x⁴+x²+1): since x⁴+x²+1 is a polynomial, its limit at x=1 is simply 1+1+1=3 by DSM, and then the log rule gives lim log(x⁴+x²+1) = log(3).</div>
`,
questions:[
{q:'What does lim(x→a) f(x) = l actually claim about the function f?', options:['That f(a) is defined and equals l','That as x gets arbitrarily close to a (from either side), f(x) gets arbitrarily close to l — regardless of whether f is even defined at a itself','That f is a polynomial','That f(x) equals l for every value of x'], correct:1, exp:'A limit describes the trend as x approaches a, not the value at a. This is a subtle but crucial distinction: a function can have a perfectly well-defined limit at a point where the function itself is undefined, or where the function\'s actual value there disagrees with the limit — both possibilities are explored later in this unit under continuity.'},
{q:'In the example f(x)=3x+2 approaching x=2 from both sides, what value do both the left-approach and the right-approach converge toward?', options:['2','8','6','It depends on which side you approach from'], correct:1, exp:'Values from the left (7.7, 7.94, 7.994,...) and from the right (8.3, 8.03, 8.003,...) both squeeze toward 8 as x gets closer to 2. Because both directions agree on the same destination, the limit of f(x) as x→2 is exactly 8 — matching what direct substitution gives, 3(2)+2=8.'},
{q:'What is the Direct Substitution Method (DSM)?', options:['Plugging the limit point a directly into f(x) and evaluating, valid whenever f does not misbehave there','A method that only works for trigonometric functions','A method requiring you to first find the left-hand and right-hand limits separately','A method that always fails for polynomials'], correct:0, exp:'DSM is exactly what it sounds like: substitute a for x and compute. It succeeds for the vast majority of ordinary algebraic expressions — polynomials always yield to it — and only breaks down in specific circumstances (covered in the next section) that produce indeterminate results like 0/0.'},
{q:'Evaluate lim(x→3) (2x²−5x+1) using DSM.', options:['4','10','13','7'], correct:0, exp:'Substituting x=3 directly: 2(3)²−5(3)+1 = 2(9)−15+1 = 18−15+1 = 4. Polynomials are always safe for DSM — there is no situation in which substituting directly into a polynomial produces an indeterminate form.'},
{q:'If lim(x→a) f(x) = 5 and lim(x→a) g(x) = 2, what is lim(x→a) [f(x)·g(x)]?', options:['7','10','2.5','Cannot be determined without knowing f and g individually'], correct:1, exp:'The product rule for limits states lim[f(x)g(x)] = [lim f(x)][lim g(x)], provided both individual limits exist (which they do here). So the answer is simply 5×2=10 — no need to know the actual formulas for f and g, only their limiting values at a.'},
{q:'If lim(x→a) f(x) = 12 and lim(x→a) g(x) = 4, what is lim(x→a) [f(x)/g(x)]?', options:['3','16','48','Undefined, since division is never allowed in limits'], correct:0, exp:'The quotient rule gives lim[f(x)/g(x)] = [lim f(x)]/[lim g(x)] = 12/4 = 3, valid because the denominator\'s limit, 4, is nonzero. Had lim g(x) been 0, this particular rule would not apply, and the more delicate techniques in the next section would be needed instead.'},
{q:'Evaluate lim(x→1) log(x⁴+x²+1) using the algebra-of-limits rules.', options:['log(1)','log(3)','3','log(x⁴+x²+1)'], correct:1, exp:'First find the limit inside the log using DSM on the polynomial: (1)⁴+(1)²+1 = 1+1+1=3. Then the log rule lim log[f(x)]=log[lim f(x)] gives log(3) as the final answer — the log is applied only after the inner polynomial limit has been resolved, not before.'},
{q:'Why does the limit rule lim[f(x)/g(x)] = [lim f(x)]/[lim g(x)] specifically require that lim g(x) ≠ 0?', options:['Because division by zero is undefined, so if the denominator\'s limit were zero, the rule\'s right-hand side would not make sense as an ordinary fraction — a different, more careful technique is needed in that situation instead','Because g(x) must always be positive','Because this restriction is arbitrary and could safely be dropped','Because f(x) must also avoid being zero'], correct:0, exp:'The rule\'s right-hand side is literally a fraction of two numbers, and dividing by zero has no defined meaning in ordinary arithmetic. When lim g(x)=0, this quotient rule simply does not apply — and if lim f(x) is also 0 in that case, you land in exactly the 0/0 indeterminate situation that the next section is devoted to resolving with other methods.'},
{q:'In algorithm complexity analysis, comparing two algorithms\' running times as input size n grows involves examining lim(n→∞) [T1(n)/T2(n)]. Which core idea from this section — that a limit describes a trend of approach rather than a value at one specific point — makes this comparison meaningful even though no computer will ever literally run with "infinite" input?', options:['The limit as n→∞ has no practical meaning and is purely a theoretical abstraction with no use in real algorithm analysis','The limit describes the trend the ratio settles into as n grows without bound, revealing which algorithm eventually dominates for large enough inputs — exactly the same "approach, not a single value" idea used for lim(x→a) f(x), just with a approaching infinity instead of a finite number','Computers can actually run algorithms with infinite input, so the limit is computed directly','This is unrelated to limits and only involves basic arithmetic'], correct:1, exp:'Just as lim(x→a)f(x) captures the trend of f(x) as x approaches a — without needing x to actually equal a — lim(n→∞)[T1(n)/T2(n)] captures which algorithm\'s running time trend dominates as input size grows without bound, without needing to literally test infinite input. This is precisely the mathematical basis of asymptotic (Big-O style) algorithm comparison, and it reuses the exact same limiting idea introduced in this section.'},
{q:'A pharmacokinetic model describes plasma drug concentration during a constant intravenous infusion, and researchers want to know the concentration the body will trend toward as time goes on, without needing to wait an actual infinite amount of time to observe it. Which concept from this section directly describes what they are computing?', options:['A limit — specifically, the trend the concentration function approaches as time increases, which does not require time to actually reach infinity, exactly as the limit definition in this section does not require x to actually reach a','The exact concentration at t=0, unrelated to any limiting behavior','An average of all past concentration readings','A random guess with no mathematical basis'], correct:0, exp:'"What value does the concentration function trend toward as time grows" is exactly a limit, using the same trend-not-destination idea from this section, just with time playing the role of x and infinity (or a very large time) playing the role of a. This is precisely how steady-state plasma concentration is defined and computed in pharmacokinetics — as lim(t→∞) of the concentration function, not as a value measured at some single finite instant.'}
]},

{ id:'t22', unit:'Unit 11 · Limit and Continuity', title:'11.4–11.4.2 When Direct Substitution Fails: Factorisation and LCM', notes: `
<p>DSM is not infallible. Plugging a directly into f(x)/g(x) sometimes produces one of seven classic <strong>indeterminate forms</strong> — expressions that are simply not mathematically defined as they stand:</p>
<div class="formula-box">0/0&nbsp;&nbsp;&nbsp;&nbsp;∞/∞&nbsp;&nbsp;&nbsp;&nbsp;0×∞&nbsp;&nbsp;&nbsp;&nbsp;∞−∞&nbsp;&nbsp;&nbsp;&nbsp;0⁰&nbsp;&nbsp;&nbsp;&nbsp;1^∞&nbsp;&nbsp;&nbsp;&nbsp;∞⁰</div>
<p>Landing on one of these forms does not mean the limit fails to exist — it means DSM specifically cannot answer the question, and a different technique is needed to see past the indeterminacy to whatever the actual limit is.</p>
<h4>Factorisation Method</h4>
<p>This is the go-to technique whenever substituting a into f(x)/g(x) produces 0/0 <em>and</em> both f(x) and g(x) are polynomials (or reduce to polynomial-like expressions). If both numerator and denominator vanish at x=a, then (x−a) is a common factor of both — factor it out of each, cancel it, and try DSM again on what remains.</p>
<div class="worked"><div class="label">Worked example</div>lim(x→3) (x²−9)/(x−3). Direct substitution gives (9−9)/(3−3)=0/0, so DSM fails. Factor the numerator: x²−9=(x−3)(x+3). Cancel the common (x−3) factor (valid because x is <em>approaching</em> 3, not equal to 3, so x−3 is never literally zero during the cancellation): lim(x→3)(x+3) = 3+3 = 6.</div>
<div class="worked"><div class="label">A cubic version, using the sum/difference of cubes pattern</div>lim(x→2) (x³−8)/(x−2). Factor using a³−b³=(a−b)(a²+ab+b²): x³−8=(x−2)(x²+2x+4). Cancelling gives lim(x→2)(x²+2x+4) = 4+4+4 = 12.</div>
<h4>Least Common Multiplier (LCM) Method</h4>
<p>This method targets a different symptom: an expression built from subtracting two fractions, which produces the ∞−∞ form on direct substitution. Combine the fractions over a common denominator first — after that simplification, the expression very often reduces to an ordinary 0/0 case, which the factorisation method (or straightforward cancellation) can then finish off.</p>
<div class="worked"><div class="label">Worked example</div>lim(x→2) [1/(x−2) − 4/(x²−4)]. Direct substitution gives ∞−∞, an indeterminate form, so DSM fails outright. Combine over the common denominator (x−2)(x+2): 1/(x−2) = (x+2)/[(x−2)(x+2)], so the expression becomes [(x+2)−4]/[(x−2)(x+2)] = (x−2)/[(x−2)(x+2)]. Cancelling the common (x−2) factor leaves 1/(x+2), and now DSM applies: 1/(2+2) = 1/4.</div>
<p>The pattern across both methods is the same underlying idea: an indeterminate form is not the end of the story, it is a signal that some algebraic simplification — cancelling a shared factor, combining fractions — will expose the real limiting behavior hiding underneath.</p>
`,
questions:[
{q:'What does it mean when direct substitution into lim(x→a) f(x)/g(x) produces the form 0/0?', options:['The limit definitely does not exist','DSM cannot resolve the limit as it stands, but the limit may still exist — a different technique like factorisation is needed to find it','f(x) and g(x) must both be zero everywhere','The limit is automatically equal to 1'], correct:1, exp:'0/0 (and the other six indeterminate forms) simply mean direct substitution gives an undefined expression — it is a dead end for that particular method, not a verdict on whether the limit exists. The factorisation, LCM, and rationalisation methods in this unit exist precisely to get past this roadblock and find the actual limiting value.'},
{q:'Which of the following is NOT one of the seven classic indeterminate forms?', options:['0/0','∞/∞','1/2','1^∞'], correct:2, exp:'1/2 is just an ordinary, perfectly well-defined number — there is nothing indeterminate about it. The seven genuine indeterminate forms are 0/0, ∞/∞, 0×∞, ∞−∞, 0⁰, 1^∞, and ∞⁰ — each one arises from a genuine ambiguity about which of two competing tendencies "wins."'},
{q:'The factorisation method is the appropriate technique when direct substitution produces which specific indeterminate form, with polynomial-like numerator and denominator?', options:['∞−∞','0/0','0×∞','1^∞'], correct:1, exp:'Factorisation targets 0/0 specifically: if both f(a)=0 and g(a)=0, then (x−a) divides evenly into both f(x) and g(x), and factoring it out of each (then cancelling) is exactly what resolves the indeterminacy — this only makes sense when both pieces vanish together, which is the 0/0 signature.'},
{q:'Evaluate lim(x→3) (x²−9)/(x−3) using the factorisation method.', options:['0','6','3','Undefined'], correct:1, exp:'Direct substitution gives 0/0, so factor: x²−9=(x−3)(x+3). Cancel the shared (x−3) factor (legitimate since x never actually equals 3 during the approach): lim(x→3)(x+3) = 6.'},
{q:'Evaluate lim(x→2) (x³−8)/(x−2) using the factorisation method.', options:['12','8','4','6'], correct:0, exp:'Direct substitution gives (8−8)/(2−2)=0/0. Using a³−b³=(a−b)(a²+ab+b²) with a=x, b=2: x³−8=(x−2)(x²+2x+4). Cancelling the (x−2) factor leaves lim(x→2)(x²+2x+4) = 4+4+4=12.'},
{q:'Why is it mathematically valid to cancel the common factor (x−a) when evaluating lim(x→a) [f(x)/g(x)] via factorisation, given that x−a equals exactly zero at x=a itself?', options:['It is not actually valid, but is done anyway as a shortcut','A limit considers x approaching a, never x actually equal to a, so during the entire process of taking the limit, x−a is close to zero but genuinely nonzero, making the cancellation legitimate throughout','Because cancelling zero by zero is always allowed in algebra','Because factorisation only works when a=0'], correct:1, exp:'This is the crucial subtlety behind why factorisation works at all: a limit examines the behavior of the expression as x gets near a, but never actually studies the case x=a itself. Since x−a is nonzero for every x in that approach (just very small), dividing both numerator and denominator by it is a perfectly legal algebraic step throughout the whole limiting process.'},
{q:'The LCM method is specifically designed to handle expressions that produce which indeterminate form on direct substitution?', options:['0/0 directly, without any further steps needed','∞−∞, arising from the subtraction of two fractions whose individual terms blow up at the limit point','0×∞','1^∞'], correct:1, exp:'The LCM method targets expressions built as a difference of two fractions, where each fraction individually tends to infinity at the limit point, producing an overall ∞−∞ form. Combining the fractions over their least common denominator typically converts this into an ordinary 0/0 case, which can then be finished with the same cancellation logic as factorisation.'},
{q:'Evaluate lim(x→2) [1/(x−2) − 4/(x²−4)] using the LCM method.', options:['1/4','0','1/2','Undefined'], correct:0, exp:'Combine over the common denominator (x−2)(x+2): 1/(x−2)=(x+2)/[(x−2)(x+2)], so the expression becomes [(x+2)−4]/[(x−2)(x+2)] = (x−2)/[(x−2)(x+2)]. Cancelling the shared (x−2) leaves 1/(x+2), and substituting x=2 gives 1/4.'},
{q:'Evaluate lim(x→4) [1/(x−4) − 8/(x²−16)] using the LCM method.', options:['1/8','1/4','0','Undefined'], correct:0, exp:'The common denominator is (x−4)(x+4). Rewriting: 1/(x−4)=(x+4)/[(x−4)(x+4)], so the expression becomes [(x+4)−8]/[(x−4)(x+4)] = (x−4)/[(x−4)(x+4)]. Cancelling (x−4) leaves 1/(x+4), and at x=4 this gives 1/8.'},
{q:'A software function computes ratio = numerator(x)/denominator(x), and a developer notices the function crashes with a division-by-zero error exactly at x=5, even though the mathematical limit of the ratio as x approaches 5 is perfectly well-defined and finite. How does this scenario mirror the factorisation-method situation in this section?', options:['It is unrelated — software crashes have nothing to do with mathematical limits','Both numerator and denominator likely share a common factor of (x−5) that makes the raw expression evaluate to 0/0 exactly at x=5, even though the simplified (cancelled) expression would compute a perfectly valid number there — exactly the situation factorisation is designed to resolve mathematically, and which a careful implementation would need to simplify away before evaluating','The crash proves the mathematical limit does not actually exist','This means the denominator must be identically zero everywhere'], correct:1, exp:'This is a very direct real-world echo of the factorisation method: if both numerator and denominator happen to vanish at the same point (a shared factor of (x−a)), the raw, unsimplified formula divides zero by zero right at that one point, crashing naive code — even though the underlying limit (and often the "removable" mathematical behavior of the function) is perfectly well-defined once the common factor is cancelled algebraically first, exactly as this section\'s factorisation method does by hand.'},
{q:'Evaluate lim(x→5) [1/(x−5) − 10/(x²−25)] using the LCM method.', options:['1/10','1/5','0','Undefined'], correct:0, exp:'Common denominator (x−5)(x+5): 1/(x−5)=(x+5)/[(x−5)(x+5)], giving [(x+5)−10]/[(x−5)(x+5)] = (x−5)/[(x−5)(x+5)]. Cancelling (x−5) leaves 1/(x+5), which at x=5 gives 1/10.'}
]},

{ id:'t23', unit:'Unit 11 · Limit and Continuity', title:'11.4.3–11.4.4 Rationalisation and the Standard Limit Results', notes: `
<p>Two more tools round out the toolkit for handling indeterminate forms: one for expressions tangled up with square roots, and a short list of standard results worth simply memorizing because they appear constantly.</p>
<h4>Rationalisation Method</h4>
<p>When a 0/0 form involves a square root that cannot be factored the ordinary polynomial way, multiply numerator and denominator by the conjugate of whichever piece carries the root — this uses the identity (a−b)(a+b)=a²−b² to eliminate the square root from one part of the expression, at the cost of introducing it into the other. What is left over almost always reduces to something DSM (or plain factorisation) can finish.</p>
<div class="worked"><div class="label">Worked example</div>lim(x→0) [√(9+x)−3]/x. Direct substitution gives (3−3)/0=0/0. Multiply by the conjugate √(9+x)+3 over itself: [√(9+x)−3][√(9+x)+3] = (9+x)−9 = x. So the expression becomes x / [x(√(9+x)+3)], and the x's cancel, leaving 1/[√(9+x)+3]. Now DSM applies: 1/(√9+3) = 1/(3+3) = 1/6.</div>
<h4>Standard Limit Results (memorize these)</h4>
<div class="formula-box">
lim(x→a) (xⁿ−aⁿ)/(x−a) = n·aⁿ⁻¹<br>
lim(θ→0) sinθ/θ = 1&nbsp;&nbsp;&nbsp;&nbsp;lim(θ→0) tanθ/θ = 1&nbsp;&nbsp;&nbsp;&nbsp;lim(θ→0) cosθ = 1<br>
lim(x→0) (eˣ−1)/x = 1&nbsp;&nbsp;&nbsp;&nbsp;lim(x→0) (aˣ−1)/x = ln a&nbsp;&nbsp;&nbsp;&nbsp;lim(x→0) log(1+x)/x = 1<br>
lim(x→0) (1+x)^(1/x) = e&nbsp;&nbsp;&nbsp;&nbsp;lim(x→∞) (1+1/x)^x = e
</div>
<p>These results are useful precisely because they let you sidestep factorisation or rationalisation entirely for a whole family of expressions built from trig, exponential, and logarithmic pieces — the trick is almost always massaging a given limit into one of these exact shapes through multiplying and dividing by a cleverly chosen constant.</p>
<div class="worked"><div class="label">Worked examples using the standard results</div>
lim(x→0) sin(5x)/(3x): rewrite as (5/3)·[sin(5x)/(5x)], and as x→0, 5x→0 too, so the bracket tends to 1 by the standard sine result, leaving 5/3.<br>
lim(x→0) tan(7x)/(4x): by the identical technique, (7/4)·[tan(7x)/(7x)] → (7/4)(1) = 7/4.<br>
lim(x→0) (e^(3x)−1)/x: rewrite as 3·[(e^(3x)−1)/(3x)], and as 3x→0, the bracket tends to 1, giving 3.<br>
lim(x→0) log(1+4x)/x: rewrite as 4·[log(1+4x)/(4x)] → 4(1) = 4.<br>
lim(x→0) (1+6x)^(1/x): rewrite the exponent as (1/(6x))·6, so this is [(1+6x)^(1/(6x))]^6 → e^6 as 6x→0.
</div>
`,
questions:[
{q:'When is the rationalisation method the appropriate technique to resolve an indeterminate limit?', options:['Whenever the expression involves a factorial','When a 0/0 form involves a square root that resists ordinary polynomial factorisation, so multiplying by a conjugate is used to eliminate the root instead','Whenever x approaches infinity','Only when the expression involves logarithms'], correct:1, exp:'Rationalisation is specifically for handling square roots tangled up in an indeterminate expression — the conjugate trick (multiplying by the "opposite sign" version of the root expression) uses the difference-of-squares identity to eliminate the root from one part of the fraction, converting the problem into something ordinary algebra (or DSM) can finish.'},
{q:'Evaluate lim(x→0) [√(9+x)−3]/x using the rationalisation method.', options:['1/6','1/3','3','0'], correct:0, exp:'Multiply by the conjugate √(9+x)+3 over itself: the numerator becomes (9+x)−9=x, cancelling the x in the denominator and leaving 1/[√(9+x)+3]. Substituting x=0: 1/(√9+3)=1/(3+3)=1/6.'},
