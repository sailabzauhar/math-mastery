{ id:'t41', unit:'Unit 14 · Definite Integration', title:'14.5 The P5 Trick: Clever Uses of the Properties', notes: `
<p>The properties from the previous section are not just bookkeeping facts — combined cleverly, they solve integrals that would otherwise require serious algebraic effort, sometimes reducing the entire problem to almost nothing.</p>
<h4>The signature move: add I to itself, reflected</h4>
<p>Many integrals of the form ∫[a,b] f(x) / [f(x) + f(a+b−x)] dx look intimidating, but yield almost immediately to a specific trick. Call the integral I. By property P5, replacing x with (a+b−x) throughout does not change the integral's value, so:</p>
<div class="formula-box">
I = ∫[a,b] f(x) / [f(x)+f(a+b−x)] dx&nbsp;&nbsp;&nbsp;&nbsp;(the original)<br>
I = ∫[a,b] f(a+b−x) / [f(a+b−x)+f(x)] dx&nbsp;&nbsp;&nbsp;&nbsp;(applying P5)
</div>
<p>Adding these two expressions for I together, the denominators are now identical in both, so the two numerators simply add on top of that shared denominator:</p>
<div class="formula-box">2I = ∫[a,b] [f(x)+f(a+b−x)] / [f(x)+f(a+b−x)] dx = ∫[a,b] 1 dx = b−a</div>
<p>The entire complicated integrand collapses to the constant 1, because the numerator (after adding) is now identical to the denominator. So I = (b−a)/2 — a clean, exact answer, obtained without ever needing to know the specific formula of f at all.</p>
<div class="worked"><div class="label">Worked example</div>Evaluate ∫[2 to 7] √(x−2) / [√(x−2)+√(7−x)] dx. Here a=2, b=7, and f(x)=√(x−2) (so a+b−x=9−x, and f(a+b−x)=√(9−x−2)=√(7−x), matching the second term in the denominator exactly). By the trick above, 2I=(7−2)=5, so I=5/2 — without ever manipulating the square roots directly.</div>
<h4>Splitting absolute-value integrands with P3</h4>
<p>To integrate something like ∫[1 to 4]|x−2|dx, first locate the point where the expression inside the absolute value changes sign (here, x=2), then split the interval there using P3, applying the correct sign convention to each piece separately.</p>
<div class="worked"><div class="label">Worked example</div>∫[1 to 4]|x−2|dx = ∫[1 to 2]−(x−2)dx + ∫[2 to 4](x−2)dx (since x−2 is negative for 1≤x&lt;2, and positive for 2&lt;x≤4). The first piece: [−(x²/2−2x)] from 1 to 2 = −(2−4)−(−(0.5−2)) = 2−1.5 = 0.5. The second piece: [(x²/2−2x)] from 2 to 4 = (8−8)−(2−4) = 0−(−2) = 2. Total: 0.5+2 = 2.5.</div>
<h4>Recognizing odd functions to skip computation entirely</h4>
<p>Before diving into any integral over a symmetric interval [−a,a], always check first whether the integrand is odd. If f(−x)=−f(x), property P4 gives the answer (zero) instantly, sidestepping what might otherwise look like a nightmare of algebra.</p>
<div class="worked"><div class="label">Worked example</div>∫[−50 to 50] (x⁵ + x³ + eˣ − e⁻ˣ) dx. Check oddness: replacing x with −x gives (−x)⁵+(−x)³+e⁻ˣ−eˣ = −x⁵−x³+e⁻ˣ−eˣ = −(x⁵+x³+eˣ−e⁻ˣ), confirming the whole expression is odd. By P4, the integral is exactly 0 — no antiderivative needed at all.</div>
`,
questions:[
{q:'What is the key algebraic move in the "P5 trick" for integrals of the form ∫f(x)/[f(x)+f(a+b−x)]dx?', options:['Differentiate both sides with respect to x','Call the integral I, apply property P5 to get a second expression for I, then add the two expressions together — the denominators match exactly, so the numerators combine into the same expression as the denominator, collapsing the whole integrand to 1','Multiply the integral by 2 without any further justification','Substitute x=0 directly into the formula'], correct:1, exp:'The trick relies on P5 producing a second, equally valid expression for the same integral I, with numerator and denominator swapped in a specific way. Adding the original and the P5-transformed version together makes the combined numerator identical to the combined denominator, reducing the entire integrand to the constant 1 — the crucial simplifying step.'},
{q:'Using the P5 trick, what is ∫[a,b] f(x)/[f(x)+f(a+b−x)] dx equal to, regardless of the specific formula for f?', options:['b−a','(b−a)/2','a−b','f(a)+f(b)'], correct:1, exp:'2I = ∫[a,b] 1 dx = b−a, so I = (b−a)/2. Remarkably, this final answer depends only on the interval\'s length, not on any detail of f\'s specific formula — as long as the integral matches this particular structural pattern.'},

/* Assign stable unique ids to every question (topicId-q-index) */
TOPICS.forEach(t => t.questions.forEach((q,i) => { q.id = t.id + '-q' + i; }));

/* ============================= SM2 SPACED REPETITION ============================= */
function sm2Update(item, quality){
  // item: {ef, reps, interval, due}  quality: 0..5
  let ef = item.ef, reps = item.reps, interval = item.interval;
  if(quality >= 3){
    if(reps === 0) interval = 1;
    else if(reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  } else {
    reps = 0;
    interval = 1;
  }
  ef = ef + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02));
  if(ef < 1.3) ef = 1.3;
  const due = new Date();
  due.setDate(due.getDate() + interval);
  return { ef: Math.round(ef*100)/100, reps, interval, due: due.toISOString().slice(0,10) };
}

/* ============================= STATE ============================= */
let STATE = {
  quizAnswers: {},   // { qid: {selected, correct} }
  sm2: {}            // { qid: {ef, reps, interval, due} }
};
let currentTopicId = null;
let currentView = 'notes'; // notes | quiz | review | dashboard | playground
let quizIndex = 0;
let quizScore = 0;
let reviewQueue = [];
let reviewIndex = 0;
let reviewRevealed = false;

const todayStr = () => new Date().toISOString().slice(0,10);

/* Storage layer: plain localStorage, since this build runs standalone
   (installed app / browser tab), not inside the Claude.ai artifact
   sandbox where window.storage would have been available instead. */
const LS_KEY_QUIZ = 'mathMastery.quizAnswers';
const LS_KEY_SM2   = 'mathMastery.sm2Schedule';

async function loadState(){
  try{
    const qa = localStorage.getItem(LS_KEY_QUIZ);
    if(qa) STATE.quizAnswers = JSON.parse(qa);
  }catch(e){ console.error('load answers failed', e); }
  try{
    const sm = localStorage.getItem(LS_KEY_SM2);
    if(sm) STATE.sm2 = JSON.parse(sm);
  }catch(e){ console.error('load sm2 failed', e); }
}
async function saveAnswers(){
  try{ localStorage.setItem(LS_KEY_QUIZ, JSON.stringify(STATE.quizAnswers)); }catch(e){ console.error('save answers failed', e); }
}
async function saveSm2(){
  try{ localStorage.setItem(LS_KEY_SM2, JSON.stringify(STATE.sm2)); }catch(e){ console.error('save sm2 failed', e); }
}

function allQuestions(){
  let out = [];
  TOPICS.forEach(t => t.questions.forEach(q => out.push({...q, topicId:t.id})));
  return out;
}

function topicStats(topic){
  let total = topic.questions.length, answered = 0, correct = 0;
  topic.questions.forEach(q => {
    const rec = STATE.quizAnswers[q.id];
    if(rec){ answered++; if(rec.correct) correct++; }
  });
  return {total, answered, correct, pct: total? Math.round((correct/total)*100):0, complete: answered===total};
}

function dueCount(){
  const today = todayStr();
  let n = 0;
  Object.keys(STATE.sm2).forEach(qid => { if(STATE.sm2[qid].due <= today) n++; });
  return n;
}

/* ============================= RENDER: SIDEBAR ============================= */
function renderSidebar(){
  const tb = document.getElementById('topbar');
  const sb = document.getElementById('sidebarNav');
  let groups = {};
  TOPICS.forEach(t => { (groups[t.unit] = groups[t.unit]||[]).push(t); });

  const due = dueCount();
  const selectedValue = currentView==='review' ? 'view:review'
    : currentView==='dashboard' ? 'view:dashboard'
    : currentView==='playground' ? 'view:playground'
    : `topic:${currentTopicId}`;

  /* ---- Dropdown (narrow / portrait layout) ---- */
  let optionsHtml = '';
  Object.keys(groups).forEach(unit => {
    optionsHtml += `<optgroup label="${unit}">`;
    groups[unit].forEach(t => {
      const stats = topicStats(t);
      const mark = stats.answered===0 ? '' : (stats.complete ? ' ✓' : ` ${stats.correct}/${stats.total}`);
      optionsHtml += `<option value="topic:${t.id}" ${selectedValue==='topic:'+t.id?'selected':''}>${t.title}${mark}</option>`;
    });
    optionsHtml += `</optgroup>`;
  });
  optionsHtml += `<optgroup label="More">
    <option value="view:review" ${selectedValue==='view:review'?'selected':''}>Spaced Review${due>0? ' ('+due+' due)':''}</option>
    <option value="view:dashboard" ${selectedValue==='view:dashboard'?'selected':''}>Dashboard</option>
    <option value="view:playground" ${selectedValue==='view:playground'?'selected':''}>Vector Playground</option>
  </optgroup>`;

  let metaHtml = '';
  if(currentView!=='review' && currentView!=='dashboard' && currentView!=='playground'){
    const topic = TOPICS.find(t=>t.id===currentTopicId);
    if(topic){
      const stats = topicStats(topic);
      const dotClass = stats.answered===0 ? '' : (stats.complete ? 'done' : 'partial');
      metaHtml = `<div class="topic-meta"><span><span class="dot ${dotClass}"></span>${stats.answered}/${stats.total} answered${stats.answered>0? ' · '+stats.pct+'% correct':''}</span></div>`;
    }
  }

  tb.innerHTML = `
    <div class="topbar-inner">
      <h1>Math Mastery</h1>
      <div class="sub">chalkboard mastery · Units 8–14${due>0? ' · '+due+' review card(s) due':''}</div>
      <div class="nav-row">
        <select class="chapter-select" onchange="onNavSelect(this.value)">${optionsHtml}</select>
        <button class="btn" onclick="resetAll()" title="Clear all quiz progress and the spaced-repetition schedule">Reset</button>
      </div>
      ${metaHtml}
    </div>`;

  /* ---- Full list (wide / landscape layout) ---- */
  let listHtml = `<h1>Math Mastery</h1><div class="sub">chalkboard mastery · Units 8–14</div>`;
  Object.keys(groups).forEach(unit => {
    listHtml += `<div class="nav-group-label">${unit}</div>`;
    groups[unit].forEach(t => {
      const stats = topicStats(t);
      const dotClass = stats.answered===0 ? '' : (stats.complete ? 'done' : 'partial');
      listHtml += `<div class="nav-item ${selectedValue==='topic:'+t.id ? 'active':''}" onclick="goTopic('${t.id}')">
        <span class="nav-dot ${dotClass}"></span>
        <span>${t.title}</span>
      </div>`;
    });
  });
  listHtml += `<div class="nav-special">
    <div class="nav-item ${currentView==='review'?'active':''}" onclick="goReview()">
      <span class="nav-dot" style="background:var(--coral);border-color:var(--coral)"></span>
      <span>Spaced Review</span>
      ${due>0? `<span class="nav-badge">${due}</span>`:''}
    </div>
    <div class="nav-item ${currentView==='dashboard'?'active':''}" onclick="goDashboard()">
      <span class="nav-dot" style="background:var(--blue);border-color:var(--blue)"></span>
      <span>Dashboard</span>
    </div>
    <div class="nav-item ${currentView==='playground'?'active':''}" onclick="goPlayground()">
      <span class="nav-dot" style="background:var(--lilac);border-color:var(--lilac)"></span>
      <span>Vector Playground</span>
    </div>
    <div class="nav-item" onclick="resetAll()">
      <span class="nav-dot" style="background:var(--board-line);border-color:var(--chalk-dim)"></span>
      <span style="color:var(--chalk-dim)">Reset progress</span>
    </div>
  </div>`;
  sb.innerHTML = listHtml;
}

function onNavSelect(value){
  const [kind, id] = value.split(':');
  if(kind==='topic') goTopic(id);
  else if(kind==='view'){
    if(id==='review') goReview();
    else if(id==='dashboard') goDashboard();
    else if(id==='playground') goPlayground();
  }
}

/* ============================= NAV ACTIONS ============================= */
function goTopic(id){
  currentTopicId = id; currentView = 'notes';
  renderSidebar(); renderMain();
}
function goQuiz(id){
  currentTopicId = id; currentView = 'quiz'; quizIndex = 0; quizScore = 0;
  renderSidebar(); renderMain();
}
function goReview(){
  currentView = 'review';
  const today = todayStr();
  const all = allQuestions();
  reviewQueue = all.filter(q => STATE.sm2[q.id] && STATE.sm2[q.id].due <= today);
  reviewIndex = 0; reviewRevealed = false;
  renderSidebar(); renderMain();
}
function goDashboard(){ currentView = 'dashboard'; renderSidebar(); renderMain(); }
function goPlayground(){ currentView = 'playground'; renderSidebar(); renderMain(); }

async function resetAll(){
  if(!confirm('This clears all quiz answers and the spaced-repetition schedule. Continue?')) return;
  STATE.quizAnswers = {}; STATE.sm2 = {};
  await saveAnswers(); await saveSm2();
  renderSidebar(); renderMain();
}

/* ============================= RENDER: MAIN ============================= */
function renderMain(){
  const main = document.getElementById('main');
  if(currentView==='dashboard'){ renderDashboard(main); return; }
  if(currentView==='playground'){ renderPlayground(main); return; }
  if(currentView==='review'){ renderReview(main); return; }

  const topic = TOPICS.find(t=>t.id===currentTopicId) || TOPICS[0];
  currentTopicId = topic.id;

  if(currentView==='quiz'){ renderQuiz(main, topic); return; }

  const stats = topicStats(topic);
  main.innerHTML = `
    <div class="eyebrow">${topic.unit}</div>
    <h2 class="topic-title">${topic.title}</h2>
    <div class="notes">${topic.notes}</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="goQuiz('${topic.id}')">Start Quiz (${topic.questions.length} questions)</button>
    </div>
    ${stats.answered>0 ? `<div class="completion-check">Progress on this topic: ${stats.correct}/${stats.total} correct so far${stats.complete? ' — complete ✓':''}</div>` : ''}
  `;
}

/* ---- Quiz ---- */
function renderQuiz(main, topic){
  if(quizIndex >= topic.questions.length){
    const stats = topicStats(topic);
    main.innerHTML = `
      <div class="eyebrow">${topic.unit}</div>
      <h2 class="topic-title">Quiz complete</h2>
      <div class="quiz-card">
        <p style="font-size:1.3rem;">You scored <span class="mono" style="color:var(--yellow)">${quizScore} / ${topic.questions.length}</span> this run.</p>
        <p style="color:var(--chalk-dim)">Lifetime accuracy on this topic: ${stats.correct}/${stats.total} (${stats.pct}%)</p>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="goQuiz('${topic.id}')">Retake quiz</button>
          <button class="btn" onclick="goTopic('${topic.id}')">Back to notes</button>
          <button class="btn" onclick="goDashboard()">View dashboard</button>
        </div>
      </div>`;
    return;
  }
  const q = topic.questions[quizIndex];
  const prevAnswer = STATE.quizAnswers[q.id];
  main.innerHTML = `
    <div class="eyebrow">${topic.unit}</div>
    <h2 class="topic-title">${topic.title} — Quiz</h2>
    <div class="quiz-card">
      <div class="quiz-progress">Question ${quizIndex+1} of ${topic.questions.length} &nbsp;·&nbsp; <span class="score-pill">score ${quizScore}</span></div>
      <div class="quiz-q">${q.q}</div>
      <div id="optsWrap">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="answerQuiz('${topic.id}','${q.id}',${i})">${opt}</button>`).join('')}
      </div>
      <div id="explainWrap"></div>
      <div class="btn-row" id="nextWrap" style="display:none;">
        <button class="btn btn-primary" onclick="nextQuiz('${topic.id}')">${quizIndex+1===topic.questions.length? 'Finish quiz':'Next question'}</button>
      </div>
    </div>
  `;
}

async function answerQuiz(topicId, qid, idx){
  const topic = TOPICS.find(t=>t.id===topicId);
  const q = topic.questions[quizIndex];
  if(q.id !== qid) return;
  const opts = document.querySelectorAll('#optsWrap .opt');
  if(opts[0].classList.contains('locked')) return; // already answered
  const isCorrect = idx === q.correct;
  opts.forEach((btn,i)=>{
    btn.classList.add('locked');
    if(i===q.correct) btn.classList.add('correct');
    else if(i===idx) btn.classList.add('wrong');
  });
  if(isCorrect) quizScore++;

  const firstTime = !STATE.quizAnswers[qid];
  STATE.quizAnswers[qid] = { selected: idx, correct: isCorrect };
  await saveAnswers();

  if(firstTime){
    const seed = STATE.sm2[qid] || { ef:2.5, reps:0, interval:0, due: todayStr() };
    const quality = isCorrect ? 5 : 2;
    STATE.sm2[qid] = sm2Update(seed, quality);
    await saveSm2();
  }

  document.getElementById('explainWrap').innerHTML = `
    <div class="explain">
      <div class="tag">${isCorrect? 'Correct — why':'Not quite — here is the full picture'}</div>
      ${q.exp}
    </div>`;
  document.getElementById('nextWrap').style.display = 'flex';
  renderSidebar();
}

function nextQuiz(topicId){
  quizIndex++;
  renderMain();
}

/* ---- Spaced Review ---- */
function renderReview(main){
  main.innerHTML = `<div class="eyebrow">Spaced Review</div><h2 class="topic-title">Due today</h2>`;
  if(reviewQueue.length===0){
    main.innerHTML += `<div class="empty-state">Nothing is due for review right now. Answer questions in the topic quizzes to seed them into the schedule, then come back once they mature.</div>
      <div class="btn-row"><button class="btn" onclick="goDashboard()">View dashboard</button></div>`;
    return;
  }
  if(reviewIndex >= reviewQueue.length){
    main.innerHTML += `<div class="empty-state">Review session complete. ${reviewQueue.length} card(s) rescheduled.</div>
      <div class="btn-row"><button class="btn btn-primary" onclick="goReview()">Check again</button><button class="btn" onclick="goDashboard()">Dashboard</button></div>`;
    return;
  }
  const q = reviewQueue[reviewIndex];
  main.innerHTML += `
    <div class="quiz-progress">Card ${reviewIndex+1} of ${reviewQueue.length}</div>
    <div class="flashcard">
      <div class="q">${q.q}</div>
      ${reviewRevealed ? `<div class="a"><strong>${q.options[q.correct]}</strong><br><br><span style="color:var(--chalk);font-size:.95rem;">${q.exp}</span></div>` : ''}
    </div>
    ${!reviewRevealed ? `<div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="revealCard()">Reveal answer</button></div>` : `
    <div class="rate-row">
      <button class="rate-btn rate-again" onclick="rateCard(0)">Again<small>forgot it</small></button>
      <button class="rate-btn rate-hard" onclick="rateCard(3)">Hard<small>struggled</small></button>
      <button class="rate-btn rate-good" onclick="rateCard(4)">Good<small>recalled it</small></button>
      <button class="rate-btn rate-easy" onclick="rateCard(5)">Easy<small>instant</small></button>
    </div>`}
  `;
}
function revealCard(){ reviewRevealed = true; renderMain(); }
async function rateCard(quality){
  const q = reviewQueue[reviewIndex];
  const item = STATE.sm2[q.id] || { ef:2.5, reps:0, interval:0, due: todayStr() };
  STATE.sm2[q.id] = sm2Update(item, quality);
  await saveSm2();
  reviewIndex++; reviewRevealed = false;
  renderSidebar();
  renderMain();
}

/* ---- Dashboard ---- */
function renderDashboard(main){
  let totalQ = 0, totalAns = 0, totalCorrect = 0;
  TOPICS.forEach(t=>{ const s = topicStats(t); totalQ+=s.total; totalAns+=s.answered; totalCorrect+=s.correct; });
  const overallPct = totalAns? Math.round((totalCorrect/totalAns)*100) : 0;
  main.innerHTML = `
    <div class="eyebrow">Overview</div>
    <h2 class="topic-title">Dashboard</h2>
    <div class="dash-grid">
      <div class="dash-card"><div class="big">${totalAns}/${totalQ}</div><div class="lbl">Questions attempted</div></div>
      <div class="dash-card"><div class="big">${overallPct}%</div><div class="lbl">Overall accuracy</div></div>
      <div class="dash-card"><div class="big">${dueCount()}</div><div class="lbl">Cards due for review</div></div>
      <div class="dash-card"><div class="big">${Object.keys(STATE.sm2).length}</div><div class="lbl">Cards in SM2 schedule</div></div>
    </div>
    <h3 class="chalk-font" style="color:var(--mint);font-size:1.5rem;margin-top:30px;">Per-topic breakdown</h3>
    <div>
      ${TOPICS.map(t=>{
        const s = topicStats(t);
        return `<div class="topic-row">
          <div class="name">${t.title}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${s.total? (s.correct/s.total*100):0}%"></div></div>
          <div class="mono" style="font-size:.82rem;color:var(--chalk-dim);width:70px;text-align:right;">${s.correct}/${s.total}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="btn-row"><button class="btn" onclick="goReview()">Go to spaced review</button></div>
  `;
}

/* ---- Vector Playground ---- */
function renderPlayground(main){
  main.innerHTML = `
    <div class="eyebrow">Interactive</div>
    <h2 class="topic-title">Vector Playground</h2>
    <p class="notes" style="max-width:640px;">Drag the sliders to change vectors <strong style="color:var(--yellow)">u</strong> and <strong style="color:var(--coral)">v</strong>. Watch the sum, difference, norm, inner product, and angle update live — this is section 8.2 through 8.4 made tangible.</p>
    <div class="playground">
      <div class="pg-controls">
        <label>u.x — <span id="uxLbl">3</span></label>
        <input type="range" id="ux" min="-8" max="8" step="1" value="3" oninput="updatePlayground()">
        <label>u.y — <span id="uyLbl">2</span></label>
        <input type="range" id="uy" min="-8" max="8" step="1" value="2" oninput="updatePlayground()">
        <label>v.x — <span id="vxLbl">-2</span></label>
        <input type="range" id="vx" min="-8" max="8" step="1" value="-2" oninput="updatePlayground()">
        <label>v.y — <span id="vyLbl">4</span></label>
        <input type="range" id="vy" min="-8" max="8" step="1" value="4" oninput="updatePlayground()">
        <div class="pg-readout" id="pgReadout"></div>
      </div>
      <svg id="pgSvg" width="400" height="400" viewBox="0 0 400 400"></svg>
    </div>
  `;
  updatePlayground();
}
function updatePlayground(){
  const ux = +document.getElementById('ux').value, uy = +document.getElementById('uy').value;
  const vx = +document.getElementById('vx').value, vy = +document.getElementById('vy').value;
  document.getElementById('uxLbl').textContent = ux;
  document.getElementById('uyLbl').textContent = uy;
  document.getElementById('vxLbl').textContent = vx;
  document.getElementById('vyLbl').textContent = vy;

  const sum = [ux+vx, uy+vy];
  const diff = [ux-vx, uy-vy];
  const normU = Math.sqrt(ux*ux+uy*uy);
  const normV = Math.sqrt(vx*vx+vy*vy);
  const dot = ux*vx+uy*vy;
  let angle = 'n/a (zero vector)';
  if(normU>0 && normV>0){
    let c = dot/(normU*normV);
    c = Math.max(-1, Math.min(1,c));
    angle = (Math.acos(c) * 180/Math.PI).toFixed(1) + '°';
  }
  const orthogonal = dot===0 && (normU>0 && normV>0);

  document.getElementById('pgReadout').innerHTML =
    `u = (${ux}, ${uy})    ‖u‖ = ${normU.toFixed(2)}\n`+
    `v = (${vx}, ${vy})    ‖v‖ = ${normV.toFixed(2)}\n`+
    `u + v = (${sum[0]}, ${sum[1]})\n`+
    `u - v = (${diff[0]}, ${diff[1]})\n`+
    `⟨u, v⟩ = ${dot}\n`+
    `angle(u, v) = ${angle}` + (orthogonal? '  ⟂ orthogonal!' : '');

  // draw SVG
  const cx=200, cy=200, scale=18;
  const toPx = (x,y) => [cx + x*scale, cy - y*scale];
  let svg = `<line x1="0" y1="${cy}" x2="400" y2="${cy}" stroke="#33413A" stroke-width="1"/>
             <line x1="${cx}" y1="0" x2="${cx}" y2="400" stroke="#33413A" stroke-width="1"/>`;
  for(let g=-8; g<=8; g++){
    const [gx] = toPx(g,0); const [,gy] = toPx(0,g);
    svg += `<line x1="${gx}" y1="0" x2="${gx}" y2="400" stroke="#28362f" stroke-width="0.5"/>`;
    svg += `<line x1="0" y1="${gy}" x2="400" y2="${gy}" stroke="#28362f" stroke-width="0.5"/>`;
  }
  function arrow(vec, color){
    const [x1,y1] = toPx(0,0);
    const [x2,y2] = toPx(vec[0], vec[1]);
    const angleLine = Math.atan2(y2-y1, x2-x1);
    const ah = 8;
    const ax1 = x2 - ah*Math.cos(angleLine-0.4), ay1 = y2 - ah*Math.sin(angleLine-0.4);
    const ax2 = x2 - ah*Math.cos(angleLine+0.4), ay2 = y2 - ah*Math.sin(angleLine+0.4);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.5"/>
            <polygon points="${x2},${y2} ${ax1},${ay1} ${ax2},${ay2}" fill="${color}"/>`;
  }
  svg += arrow([ux,uy], '#F2C84B');
  svg += arrow([vx,vy], '#E8735A');
  svg += arrow(sum, '#7FD9A6');
  document.getElementById('pgSvg').innerHTML = svg;
}

/* ============================= RESPONSIVE LAYOUT MODE ============================= */
/* Switches between the wide sidebar layout (landscape) and the narrow
   dropdown layout (portrait), reading the device's actual orientation
   rather than guessing from pixel width. A width-based cutoff had to be
   calibrated per device and was either too high (sidebar never appears
   on some tablets) or prone to flicker near the cutoff; orientation is a
   discrete, jitter-free signal that only changes on a genuine rotation.
   A minimum-width guard (600px) just prevents a cramped sidebar on very
   narrow phones held sideways. */
function computeIsWide(){
  const landscape = window.matchMedia
    ? window.matchMedia('(orientation: landscape)').matches
    : window.innerWidth > window.innerHeight;
  return landscape && window.innerWidth >= 600;
}
let isWideLayout = computeIsWide();
function applyLayoutMode(){
  isWideLayout = computeIsWide();
  document.body.classList.toggle('layout-wide', isWideLayout);
}
let layoutResizeTimer = null;
function onViewportChange(){
  clearTimeout(layoutResizeTimer);
  layoutResizeTimer = setTimeout(applyLayoutMode, 120);
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);

/* ============================= INIT ============================= */
async function init(){
  applyLayoutMode();
  await loadState();
  currentTopicId = TOPICS[0].id;
  renderSidebar();
  renderMain();
}
init();
