{q:'What is the standard limit result for lim(θ→0) sinθ/θ?', options:['0','1','θ','Undefined'], correct:1, exp:'This is one of the most frequently used standard results in all of calculus: sinθ/θ approaches exactly 1 as θ approaches 0 — despite direct substitution giving the indeterminate 0/0 form, since sin(0)=0.'},
{q:'What is the standard limit result for lim(x→0) (eˣ−1)/x?', options:['0','e','1','x'], correct:2, exp:'lim(x→0)(eˣ−1)/x = 1, another cornerstone standard result — it is, in fact, exactly the definition of the derivative of eˣ at x=0, though this unit introduces it purely as a limit fact to be used directly.'},
{q:'Evaluate lim(x→0) sin(5x)/(3x) using the standard sine result.', options:['5/3','1','5','3'], correct:0, exp:'Rewrite as (5/3)·[sin(5x)/(5x)]. As x→0, 5x→0 as well, so the bracketed term tends to 1 by the standard result, leaving 5/3. The trick of multiplying and dividing by the same constant (here 5) to force the expression into the exact "sinθ/θ" shape is the standard move for this whole family of limits.'},
{q:'Evaluate lim(x→0) tan(7x)/(4x) using the standard tangent result.', options:['7/4','4/7','7','4'], correct:0, exp:'Rewrite the expression as (7/4)·[tan(7x)/(7x)], multiplying and dividing by 7 to force the bracket into the exact shape of the standard result. As x→0, 7x→0 as well, so the bracketed term tends to 1 by lim(θ→0)tanθ/θ=1, leaving (7/4)(1) = 7/4 as the final answer.'},
{q:'Evaluate lim(x→0) (e^(3x)−1)/x using the standard exponential result.', options:['3','1/3','0','e^3'], correct:0, exp:'Rewrite as 3·[(e^(3x)−1)/(3x)]. As x→0, 3x→0, so the bracket tends to 1 by lim(u→0)(eᵘ−1)/u=1, leaving 3(1)=3.'},
{q:'Evaluate lim(x→0) log(1+4x)/x using the standard logarithm result.', options:['4','1/4','0','log(4)'], correct:0, exp:'Rewrite the expression as 4·[log(1+4x)/(4x)], multiplying and dividing by 4 so the bracket matches the standard result\'s exact shape. As x→0, 4x→0, so the bracket tends to 1 by lim(u→0)log(1+u)/u=1, leaving 4(1) = 4 as the answer.'},
{q:'Evaluate lim(x→0) (1+6x)^(1/x) using the standard result lim(u→0)(1+u)^(1/u)=e.', options:['e⁶','6e','e','6'], correct:0, exp:'Rewrite the exponent 1/x as 6·[1/(6x)]: (1+6x)^(1/x) = [(1+6x)^(1/(6x))]^6. As x→0, 6x→0, so the bracketed base tends to e by the standard result, and raising to the 6th power gives e⁶.'},
{q:'Evaluate lim(x→a) (x⁵−a⁵)/(x−a) using the standard result lim(x→a)(xⁿ−aⁿ)/(x−a)=n·aⁿ⁻¹.', options:['5a⁴','5a⁵','a⁴','5a'], correct:0, exp:'Applying the standard result directly with n=5: the limit equals 5·a^(5−1) = 5a⁴. This standard result is what lets you evaluate this entire family of limits instantly, without needing to actually perform polynomial long division to factor out (x−a) by hand each time.'},
{q:'In signal processing, small-angle approximations (used to simplify calculations for physical systems like pendulums or antennas) rely on the fact that sinθ≈θ for small θ. Which exact result from this section formally justifies that approximation?', options:['lim(x→a)(xⁿ−aⁿ)/(x−a)=naⁿ⁻¹','lim(θ→0) sinθ/θ = 1, meaning sinθ and θ become nearly indistinguishable in ratio as θ shrinks toward zero, which is precisely the formal justification for replacing sinθ with θ in small-angle approximations','lim(x→0)(eˣ−1)/x = 1','lim(x→∞)(1+1/x)^x = e'], correct:1, exp:'The standard result lim(θ→0)sinθ/θ=1 says exactly that sinθ/θ approaches 1 for small θ, i.e. sinθ≈θ when θ is small — this is not a coincidence or a separate physics rule, it is the direct mathematical content of this specific standard limit, just applied by engineers to simplify equations describing small oscillations.'},
{q:'In finance and continuously compounded interest calculations, the constant e arises from evaluating lim(n→∞) (1+r/n)ⁿ for a fixed rate r. Which standard result from this section is the direct ancestor of that formula?', options:['lim(θ→0) sinθ/θ = 1','lim(x→∞) (1+1/x)^x = e, which generalizes directly to (1+r/x)^x → e^r as x→∞ by substituting u=x/r','lim(x→0)(eˣ−1)/x = 1','lim(x→a)(xⁿ−aⁿ)/(x−a)=naⁿ⁻¹'], correct:1, exp:'The compound-interest formula (1+r/n)ⁿ, as n→∞, is a direct scaled variant of the standard result lim(x→∞)(1+1/x)^x=e: substituting x=n/r turns (1+r/n)ⁿ into exactly the standard form raised to the power r, giving e^r in the limit. This is precisely why e shows up in continuous compounding formulas — it is the same limiting idea from this section, dressed up in a financial context.'}
]},

{ id:'t24', unit:'Unit 11 · Limit and Continuity', title:'11.5 Limits Involving Infinity', notes: `
<p>So far, x has always approached some specific finite number a. This section asks what happens as x itself grows without any bound at all — written x→∞.</p>
<p>Start with the reciprocal of a growing power: as x gets larger and larger, 1/x gets smaller and smaller, crowding ever closer to zero without ever quite reaching it (1/10=0.1, 1/100=0.01, 1/1000=0.001, and so on). This gives the foundational infinite-limit fact:</p>
<div class="formula-box">lim(x→∞) 1/xⁿ = 0,&nbsp;&nbsp;for any n &gt; 0</div>
<h4>Comparing degrees in a ratio of polynomials</h4>
<p>The single most useful application of this fact: evaluating the limit as x→∞ of one polynomial divided by another. Divide both numerator and denominator by the highest power of x appearing in either — every term except the leading ones then vanishes to zero (by the fact above), leaving a strikingly clean three-case rule:</p>
<div class="formula-box">
If numerator degree = denominator degree: the limit equals the ratio of the leading coefficients<br>
If numerator degree &lt; denominator degree: the limit is 0<br>
If numerator degree &gt; denominator degree: the limit is ∞ (does not settle to a finite value)
</div>
<div class="worked"><div class="label">Worked examples</div>
lim(x→∞) (5x²+3)/(2x²−7): both degree 2 (equal), so the limit is the ratio of leading coefficients, 5/2.<br>
lim(x→∞) (3x+1)/(x²+5): numerator degree 1, denominator degree 2 (numerator smaller), so the limit is 0 — the denominator's growth completely swamps the numerator's as x grows large.<br>
lim(x→∞) (x³+2)/(4x²+1): numerator degree 3, denominator degree 2 (numerator larger), so the limit is ∞ — the ratio grows without bound rather than settling anywhere.
</div>
<p>This three-case rule is worth internalizing as a instant, near-automatic check: before grinding through any algebra, just compare the two degrees and you already know which of the three outcomes to expect.</p>
`,
questions:[
{q:'What is lim(x→∞) 1/x⁵?', options:['0','1','5','∞'], correct:0, exp:'As x grows without bound, any positive power of x in the denominator drives the whole fraction toward zero: lim(x→∞)1/xⁿ=0 for any n>0. This is the foundational fact behind every polynomial-ratio limit at infinity in this section.'},
{q:'When evaluating lim(x→∞) of a ratio of two polynomials with EQUAL degree, what does the limit equal?', options:['Always 0','Always ∞','The ratio of the two leading coefficients (the coefficients of the highest-power terms)','The ratio of the two constant terms'], correct:2, exp:'When degrees match, dividing numerator and denominator by that shared highest power leaves every other term vanishing to zero, but the leading-coefficient terms survive as finite numbers, so the whole limit collapses to simply their ratio.'},
{q:'Evaluate lim(x→∞) (5x²+3)/(2x²−7).', options:['5/2','3/-7','1','∞'], correct:0, exp:'Both numerator and denominator have degree 2 (equal), so the limit is the ratio of leading coefficients: 5/2. Every lower-order term (the +3 and the −7) becomes irrelevant as x grows large, since dividing through by x² sends them both to zero.'},
{q:'When the numerator\'s degree is LESS than the denominator\'s degree, what does lim(x→∞) of their ratio equal?', options:['0','∞','The ratio of leading coefficients','1'], correct:0, exp:'A "smaller" numerator degree means the denominator grows faster than the numerator as x increases without bound, so the fraction shrinks toward zero rather than settling on some nonzero ratio.'},
{q:'Evaluate lim(x→∞) (3x+1)/(x²+5).', options:['0','3','1/5','∞'], correct:0, exp:'Numerator degree 1, denominator degree 2 — numerator smaller — so the limit is 0. The denominator\'s x² term grows much faster than the numerator\'s x term as x increases, dragging the whole fraction toward zero.'},
{q:'When the numerator\'s degree is GREATER than the denominator\'s degree, what does lim(x→∞) of their ratio equal?', options:['0','∞ (the limit grows without bound rather than settling to a finite value)','The ratio of leading coefficients','1'], correct:1, exp:'A "larger" numerator degree means the numerator eventually outpaces the denominator no matter how large x gets, so the ratio grows without bound instead of approaching any single finite number.'},
{q:'Evaluate lim(x→∞) (x³+2)/(4x²+1).', options:['∞','0','1/4','2'], correct:0, exp:'Numerator degree 3, denominator degree 2 — numerator larger — so the limit is ∞, meaning the ratio does not settle to any finite value as x grows without bound.'},
{q:'Evaluate lim(x→∞) (7x⁴−2x+1)/(3x⁴+5x²).', options:['7/3','0','∞','-2/5'], correct:0, exp:'Both numerator and denominator have degree 4 (equal), so the limit is the ratio of leading coefficients: 7/3. The lower-degree terms (−2x, +1, +5x²) all become negligible once you mentally divide through by x⁴.'},
{q:'Evaluate lim(x→∞) (9x²+4)/(x⁵−3).', options:['0','9','∞','9/-3'], correct:0, exp:'Numerator degree 2, denominator degree 5 — numerator smaller — giving a limit of 0. The denominator\'s x⁵ growth vastly outpaces the numerator\'s x² growth for large x.'},
{q:'In algorithm analysis, comparing two candidate running-time functions T1(n)=6n²+3n and T2(n)=2n²−1 as n→∞ is exactly the kind of ratio-of-polynomials limit covered in this section. What does the three-case degree-comparison rule tell you about lim(n→∞)[T1(n)/T2(n)] here, and what does that reveal about the algorithms\' relative efficiency for large inputs?', options:['Both have degree 2, so the limit is the ratio of leading coefficients, 6/2=3, meaning T1 eventually runs about 3 times as slow as T2 for large n, but both still belong to the same overall growth class (both are Θ(n²))','The limit is 0, meaning T1 is dramatically faster than T2','The limit is ∞, meaning T1 is dramatically slower than T2 in growth class, not just by a constant factor','Degree comparison has no bearing on algorithm running-time analysis'], correct:0, exp:'Since both running times have the same degree (n²), the limit resolves to a finite, nonzero ratio (3), which in complexity-analysis language means the two algorithms belong to the same asymptotic growth class (both Θ(n²)) even though one carries a constant-factor overhead relative to the other — exactly the same "equal degree → ratio of leading coefficients" case from this section, just applied to running-time functions instead of abstract polynomials.'},
{q:'A biologist models population size using two competing growth functions and wants to know which one will eventually dominate for very large time values, computing lim(t→∞) of their ratio (one modeled as growing like t³, the other like t²). Using the degree-comparison rule, what does this limit reveal?', options:['The limit is 0, since the two functions must always stay proportional','The limit is ∞ (assuming the t³ function is the numerator), since a higher-degree function eventually outpaces a lower-degree one no matter their specific coefficients, revealing that the t³ growth model dominates for large enough time','The limit always equals exactly 1, regardless of the degrees involved','Degree comparison only applies to functions of x, never to functions of time'], correct:1, exp:'Exactly the "numerator degree greater than denominator degree" case: regardless of the specific leading coefficients, a t³ growth pattern eventually and permanently outpaces a t² growth pattern as t grows large, sending their ratio to infinity — the same degree-comparison logic from this section applies to any variable, not just x, including time-based growth models in biology or epidemiology.'}
]},

{ id:'t25', unit:'Unit 11 · Limit and Continuity', title:'11.6 Left-Hand and Right-Hand Limits', notes: `
<p>Every limit discussed so far quietly assumed that approaching a from the left and approaching a from the right tell the same story. That is usually true — but not always, and this section is about the cases where it is not.</p>
<p>The <strong>left-hand limit (L.H.L.)</strong> of f(x) as x approaches a is the value f(x) trends toward using only values of x slightly less than a, written lim(x→a⁻) f(x). The <strong>right-hand limit (R.H.L.)</strong> is the same idea using only values slightly greater than a, written lim(x→a⁺) f(x).</p>
<div class="formula-box">The (two-sided) limit lim(x→a) f(x) exists if and only if L.H.L. and R.H.L. both exist AND are equal to each other</div>
<p>This becomes essential exactly when a function's formula changes depending on which side of a you are on — piecewise functions, and especially functions built around |x| (the absolute value / modulus function), which is defined by one formula for negative inputs and another for non-negative ones.</p>
<h4>A standard technique: substitute x=a±h</h4>
<p>To compute a one-sided limit cleanly, it helps to substitute x=a−h (for the left-hand limit) or x=a+h (for the right-hand limit), where h is a small positive number tending to 0. This turns "x approaches a from the left/right" into the cleaner statement "h approaches 0 from the positive side," and keeps track of which piece of a piecewise formula is actually in play.</p>
<div class="worked"><div class="label">Worked example — a function built on |x|</div>Evaluate lim(x→2) |x−2|/(x−2). For the L.H.L., substitute x=2−h (h→0⁺): |2−h−2|/(2−h−2) = |−h|/(−h) = h/(−h) = −1 (since h is positive, |−h|=h). For the R.H.L., substitute x=2+h (h→0⁺): |2+h−2|/(2+h−2) = |h|/h = h/h = 1. Since L.H.L.=−1 ≠ R.H.L.=1, the two-sided limit does not exist at x=2.</div>
<div class="worked"><div class="label">Worked example — a piecewise function</div>f(x) = 3x−1 for x&lt;1, and x+4 for x≥1. L.H.L. at x=1: use the first piece, lim(x→1⁻)(3x−1)=3(1)−1=2. R.H.L. at x=1: use the second piece, lim(x→1⁺)(x+4)=1+4=5. Since 2≠5, the two-sided limit at x=1 does not exist, even though each one-sided limit individually exists and is perfectly finite.</div>
<p>Note the key lesson embedded in that last example: <strong>each one-sided limit can exist separately, and yet the overall (two-sided) limit can still fail to exist</strong> if the two one-sided values simply disagree with each other.</p>
`,
questions:[
{q:'What is the left-hand limit (L.H.L.) of f(x) as x approaches a?', options:['The value f(a) itself','The value f(x) trends toward using only x-values slightly less than a','The value f(x) trends toward using only x-values slightly greater than a','The average of f evaluated at several points near a'], correct:1, exp:'L.H.L., written lim(x→a⁻)f(x), specifically restricts attention to the approach from below — values of x that stay less than a while creeping arbitrarily close to it. This is a genuinely different question from what happens approaching from above, which is exactly why the two can disagree for some functions.'},
{q:'Under what condition does the (ordinary, two-sided) limit lim(x→a) f(x) exist?', options:['Whenever f(a) is defined','Whenever L.H.L. and R.H.L. both exist and are equal to each other','Whenever L.H.L. exists, regardless of R.H.L.','Whenever f is a polynomial'], correct:1, exp:'This is the precise criterion: both one-sided limits must exist, AND they must agree with each other. If either one-sided limit fails to exist, or if they exist but disagree, the overall two-sided limit does not exist — this is exactly the situation piecewise and absolute-value functions are prone to at their "seam" points.'},
{q:'For f(x)=3x−1 (for x<1) and f(x)=x+4 (for x≥1), what is the left-hand limit at x=1?', options:['2','5','1','3'], correct:0, exp:'Approaching from the left uses the first piece (valid for x<1): lim(x→1⁻)(3x−1) = 3(1)−1 = 2.'},
{q:'For the same function, what is the right-hand limit at x=1?', options:['2','5','1','4'], correct:1, exp:'Approaching from the right uses the second piece (valid for x≥1): lim(x→1⁺)(x+4) = 1+4 = 5.'},
{q:'For the same function (f(x)=3x−1 for x<1, x+4 for x≥1), does lim(x→1) f(x) exist?', options:['Yes, and it equals 2','Yes, and it equals 5','No — L.H.L.=2 and R.H.L.=5 disagree, so the two-sided limit does not exist','Yes, and it equals 3.5, the average of the two one-sided limits'], correct:2, exp:'Since L.H.L.=2 and R.H.L.=5 are different numbers, the criterion for the two-sided limit to exist (both one-sided limits existing AND agreeing) fails, so lim(x→1)f(x) does not exist — even though both one-sided limits individually exist and are perfectly ordinary finite numbers.'},
{q:'Evaluate lim(x→3) |x−3|/(x−3) using the L.H.L./R.H.L. approach.', options:['1','-1','0','The limit does not exist, since L.H.L.=-1 and R.H.L.=1 disagree'], correct:3, exp:'Substituting x=3−h for the L.H.L. gives |−h|/(−h) = h/(−h) = −1. Substituting x=3+h for the R.H.L. gives |h|/h = 1. Since −1≠1, the two-sided limit does not exist — this is the same structural pattern as the |x−2|/(x−2) worked example, just centered at a different point.'},
{q:'Why is substituting x=a−h (with h→0⁺) a useful technique specifically for computing a left-hand limit?', options:['It has no particular usefulness, it is just one arbitrary way to write the same thing','It converts "x approaches a from the left" into "h approaches 0 from the positive side," which keeps track cleanly of which side of a is being approached — especially important when the function\'s formula, or the sign inside an absolute value, depends on that side','It only works for polynomial functions','It changes the actual value of the limit'], correct:1, exp:'The substitution x=a−h with h a small positive number tending to 0 guarantees x always stays strictly less than a throughout the process — exactly matching what "approaching from the left" means — and makes it unambiguous which piece of a piecewise formula, or which sign inside an absolute value expression, is actually in effect during the computation.'},
{q:'A piecewise function is defined as g(x)=x²+2 for x<2, and g(x)=2x for x≥2. Find L.H.L. and R.H.L. at x=2, and determine whether lim(x→2)g(x) exists.', options:['L.H.L.=6, R.H.L.=4; the limit does not exist since they disagree','L.H.L.=4, R.H.L.=4; the limit exists and equals 4','L.H.L.=6, R.H.L.=4; the limit exists and equals 5 (the average)','Neither one-sided limit exists'], correct:0, exp:'L.H.L. uses the first piece: lim(x→2⁻)(x²+2) = 4+2 = 6. R.H.L. uses the second piece: lim(x→2⁺)(2x) = 2(2) = 4. Since 6≠4, the two one-sided limits disagree, so the two-sided limit at x=2 does not exist — there is no "averaging" rule for disagreeing one-sided limits; disagreement simply means the overall limit fails to exist.'},
{q:'A patient monitoring system displays a continuous vital-sign reading, but at a specific timestamp, engineers notice the left-hand limit of the displayed value (as time approaches that timestamp from before) does not match the right-hand limit (as time approaches from after) — the display appears to "jump." What does this pattern, in the language of this section, most likely indicate about the monitoring signal at that instant?', options:['Nothing unusual — all real signals behave this way constantly','A genuine discontinuity in the recorded signal at that instant — possibly a sensor artifact, a lead disconnection, or a data-logging error — since a smoothly behaving physiological signal would ordinarily have matching left-hand and right-hand limits at every point','The patient\'s vital signs are mathematically undefined','The monitoring system must be malfunctioning at every timestamp, not just this one'], correct:0, exp:'This mirrors the piecewise-function pattern directly: a disagreement between L.H.L. and R.H.L. at a specific point signals a jump — some real discontinuity in the underlying signal at that instant, rather than a smooth physiological trend. In practice, engineers use exactly this kind of one-sided-limit mismatch as a diagnostic flag for sensor artifacts or equipment glitches in continuous monitoring data, treating a genuine "jump" as a sign something abrupt (and likely non-physiological) happened at that moment.'}
]},

{ id:'t26', unit:'Unit 11 · Limit and Continuity', title:'11.7–11.8 Continuity at a Point, and Continuous Functions', notes: `
<p>Limits and continuity are close cousins, but they are not the same idea. A limit only cares about the trend as x approaches a. Continuity adds one more requirement: that the trend actually lines up with the function's real value at a.</p>
<div class="formula-box">f is continuous at x=a&nbsp;&nbsp;if and only if&nbsp;&nbsp;lim(x→a⁻)f(x) = lim(x→a⁺)f(x) = f(a)</div>
<p>Spelled out, this packs in three separate requirements that must all hold simultaneously: the left-hand limit must exist, the right-hand limit must exist, and — critically — both one-sided limits must equal the function's actual value at a, not just each other. Picture drawing the graph of f with a pencil: continuity at x=a means you never have to lift the pencil off the paper as you cross that point.</p>
<div class="worked"><div class="label">Worked example — finding unknowns for continuity</div>Suppose f(x)=9 for x&lt;2, f(x)=ax+b for x&gt;2, and f(2)=a+7, and f is given to be continuous at x=2. Then L.H.L.=9, R.H.L.=2a+b, and f(2)=a+7, and continuity demands all three be equal: 9=2a+b=a+7. From 9=a+7, a=2. Substituting back, 9=2(2)+b gives b=5.</div>
<h4>Continuous functions (continuity everywhere, not just at one point)</h4>
<p>A function is simply called <strong>continuous</strong> (without qualifying "at a point") if it is continuous at every single point of its domain — no jumps, no gaps, no missing pieces anywhere it is defined.</p>
<h4>Algebra of continuous functions</h4>
<p>If f and g are both continuous on a shared domain, then so are all of the following, built from them:</p>
<div class="formula-box">
f+g is continuous&nbsp;&nbsp;&nbsp;&nbsp;f−g is continuous&nbsp;&nbsp;&nbsp;&nbsp;f·g is continuous<br>
f/g is continuous, provided g(x)≠0 at every point of the domain being considered
</div>
<p>This means that, in practice, you rarely need to verify continuity from scratch for a complicated expression — polynomials are continuous everywhere (being built entirely from sums and products of the continuous function f(x)=x and constants), and combining continuous pieces with these four operations produces more continuous functions, as long as you watch out for division by zero, which is the one operation on this list that can introduce a gap.</p>
<div class="worked"><div class="label">A discontinuous example, revisited</div>f(x)=|x−2|/(x−2) (from the previous section) has L.H.L.=−1 and R.H.L.=1 at x=2 — since these already disagree, the two-sided limit fails to exist, which on its own is already enough to make f discontinuous at x=2, regardless of whatever value (if any) is assigned to f(2) itself.</div>
`,
questions:[
{q:'What three conditions must all hold for f to be continuous at x=a?', options:['f(a) must be positive, f must be a polynomial, and f must be differentiable','L.H.L. at a must exist, R.H.L. at a must exist, and both must equal f(a)','f must be defined everywhere on the real line','f(a) must equal zero'], correct:1, exp:'Continuity packs three requirements into one condition: the left-hand limit exists, the right-hand limit exists, and — the piece that goes beyond mere limit-existence — both one-sided limits must actually equal the function\'s genuine value at that point, f(a), not merely equal each other.'},
{q:'Why is continuity a stronger requirement than simply having a two-sided limit exist at a point?', options:['They are exactly the same requirement, with no difference','A limit only requires L.H.L. to equal R.H.L.; continuity additionally requires that shared value to equal f(a) itself, the function\'s actual value at that point — a function can have a perfectly fine limit at a point while still being discontinuous there if f(a) disagrees with it (or is undefined)','Continuity only applies to polynomials','A limit is always larger in value than continuity requires'], correct:1, exp:'A limit existing only demands L.H.L.=R.H.L. Continuity demands that shared value additionally match f(a). This means a function can have a well-defined limit at a point yet still be discontinuous there — for instance, if f(a) is defined to some different number, or left undefined altogether, even while the limit itself exists and is perfectly finite.'},
{q:'Given f(x)=9 for x<2, f(x)=ax+b for x>2, and f(2)=a+7, with f continuous at x=2, what are a and b?', options:['a=2, b=5','a=5, b=2','a=9, b=7','a=7, b=9'], correct:0, exp:'Continuity requires L.H.L.=R.H.L.=f(2): 9 = 2a+b = a+7. From 9=a+7, a=2. Substituting into 9=2a+b gives 9=4+b, so b=5.'},
{q:'What does it mean for a function to be called simply "continuous" (without specifying "at a point")?', options:['That it is continuous at exactly one point','That it is continuous at every single point of its domain — no jumps or gaps anywhere it is defined','That it never takes negative values','That its domain is all real numbers'], correct:1, exp:'"Continuous" (as opposed to "continuous at x=a") describes the whole function: it must satisfy the continuity condition at every point where it is defined, with no exceptions — a function that is continuous everywhere except at one single problem point is not simply called "continuous" without qualification.'},
{q:'If f and g are both continuous on a shared domain, which of the following combinations is NOT automatically guaranteed continuous, without an extra condition?', options:['f+g','f−g','f·g','f/g, unless it is additionally required that g(x)≠0 throughout the domain'], correct:3, exp:'Sums, differences, and products of continuous functions are always continuous, no extra conditions needed. Quotients are the one exception on this list: f/g is only guaranteed continuous where g(x)≠0, since division by zero is exactly the kind of operation that can introduce a gap or blow-up into an otherwise well-behaved function.'},
{q:'Why are polynomials always continuous functions, according to the algebra-of-continuous-functions rules?', options:['Because polynomials are a special exception with no underlying reason','Because polynomials are built entirely from sums and products of the continuous function f(x)=x and continuous constant functions, and the algebra-of-continuous-functions rules guarantee that sums and products of continuous pieces remain continuous','Because polynomials never involve division','Polynomials are not actually always continuous'], correct:1, exp:'f(x)=x is continuous everywhere (a basic, foundational fact), and constants are trivially continuous. Every polynomial is assembled from these two ingredients using only addition and multiplication — exactly the two operations guaranteed to preserve continuity — which is why every polynomial, no matter how high its degree, is continuous at every real number without any further checking needed.'},
{q:'For f(x)=|x−2|/(x−2) (with L.H.L.=−1 and R.H.L.=1 at x=2), what can be concluded about continuity at x=2?', options:['f is continuous at x=2, since f(2) can be defined to make it work','f is discontinuous at x=2, since the two-sided limit already fails to exist (L.H.L.≠R.H.L.), which alone is enough to rule out continuity regardless of how f(2) is defined','Continuity cannot be determined without more information about f(2)','f is continuous everywhere except at x=0'], correct:1, exp:'Continuity requires L.H.L.=R.H.L.=f(a). Since L.H.L.=−1 and R.H.L.=1 already disagree with each other, the very first requirement (a well-defined two-sided limit) already fails — no possible choice of f(2) could rescue this into continuity, since the limit itself simply does not exist to compare against any value of f(2).'},
{q:'A quality-control engineer for a manufacturing sensor defines "signal reliability" partly in terms of the signal reading being a continuous function of time — no unexplained jumps. If the sensor\'s output has matching left-hand and right-hand limits at every timestamp, but at one specific timestamp the displayed value glitches to a different number than either one-sided limit predicts, what does this section say about continuity at that specific timestamp?', options:['The signal is still continuous there, since matching one-sided limits are all that continuity requires','The signal is discontinuous at that specific timestamp, because even though L.H.L.=R.H.L. there (a limit exists), that shared value does not equal the actual displayed value at that instant — exactly the "limit exists but does not equal f(a)" failure mode distinguishing continuity from mere limit-existence','This scenario is mathematically impossible','Continuity has nothing to do with sensor reliability'], correct:1, exp:'This is a precise real-world instance of the exact distinction the notes draw: a two-sided limit can exist (L.H.L.=R.H.L.) while the function still fails to be continuous, because the actual value at that point disagrees with the shared limiting value. In the sensor scenario, the underlying physical trend is smooth (limits agree), but a glitchy displayed reading at that one instant still breaks continuity — illustrating why continuity is a strictly stronger, more demanding condition than merely having a limit exist.'},
{q:'Which of the following functions is guaranteed continuous everywhere, using only the algebra-of-continuous-functions rules and the fact that f(x)=x is continuous?', options:['h(x) = x³ − 4x + 7 (built purely from sums and products of x and constants)','h(x) = 1/x (undefined, and hence not continuous, at x=0)','h(x) = |x|/x (which the notes show is discontinuous at x=0)','h(x) = 1/(x−3) (undefined, and hence not continuous, at x=3)'], correct:0, exp:'x³−4x+7 is a polynomial, built entirely from products and sums of the continuous function x and continuous constants — by the algebra-of-continuous-functions rules, this guarantees continuity at every real number. The other three options all involve division, and each has at least one point in its domain (or a boundary of its domain) where the denominator vanishes or a one-sided mismatch occurs, breaking continuity at that specific point.'}
]},
{ id:'t27', unit:'Unit 12 · Differentiation', title:'12.2–12.3 What a Derivative Actually Measures', notes: `
<p>The previous unit built the machinery of limits. This unit puts that machinery to its single most important use: measuring how fast a function changes.</p>
<h4>The definition</h4>
<p>For a function f defined on a domain D, and a point a in D, the <strong>derivative of f at a</strong> is:</p>
<div class="formula-box">f'(a) = lim(h→0) [f(a+h) − f(a)] / h,&nbsp;&nbsp;provided this limit exists</div>
<p>Read literally, the numerator f(a+h)−f(a) is how much the function's output changed, and h is how much the input changed to cause it — so the whole fraction is an average rate of change over a small interval starting at a. Taking the limit as h→0 refines that average into an <em>instantaneous</em> rate of change, right at the single point a.</p>
<h4>Geometric meaning: slope of the tangent</h4>
<p>Picture the point P=(a, f(a)) and a nearby point Q=(a+h, f(a+h)) on the curve y=f(x). The line through P and Q is a secant line, and its slope is exactly [f(a+h)−f(a)]/h — the same expression sitting inside the derivative's limit. As h shrinks toward 0, Q slides along the curve toward P, and the secant line rotates until it settles into the <strong>tangent line</strong> at P. This gives the geometric payoff of the whole definition:</p>
<div class="formula-box">f'(a) = slope of the tangent line to y=f(x) at the point x=a</div>
<h4>When the derivative fails to exist: corner points</h4>
<p>Because the derivative is itself a limit, it inherits the requirement from the previous unit that the left-hand and right-hand versions of that limit must exist and agree. These one-sided versions have their own names here: the <strong>left-hand derivative (L.H.D.)</strong>, written L(f'(a)), uses h→0⁻, and the <strong>right-hand derivative (R.H.D.)</strong>, written R(f'(a)), uses h→0⁺.</p>
<div class="formula-box">f'(a) exists&nbsp;&nbsp;if and only if&nbsp;&nbsp;L(f'(a)) = R(f'(a))</div>
<p>Geometrically, disagreement between L.H.D. and R.H.D. means the curve has a sharp <strong>corner</strong> at that point — the tangent line from the left approaches at one slope, and the tangent line from the right approaches at a different slope, so there is no single, well-defined tangent line there at all.</p>
<div class="worked"><div class="label">The classic example: f(x)=|x| at x=0</div>Approaching from the left (x slightly less than 0), f(x)=−x, giving a slope of −1. Approaching from the right (x slightly greater than 0), f(x)=x, giving a slope of +1. Since L.H.D.=−1 ≠ R.H.D.=1, f'(0) does not exist — exactly matching the visibly sharp corner in the graph of |x| at the origin. Everywhere else, |x| is perfectly smooth and differentiable.</div>
<h4>Computing derivatives directly from the definition</h4>
<div class="worked"><div class="label">Worked examples</div>
For f(x)=k (a constant): f'(a) = lim(h→0)[k−k]/h = lim(h→0) 0 = 0 — a constant function never changes, so its instantaneous rate of change is always zero.<br>
For f(x)=mx+c (a line) at any point a: f'(a) = lim(h→0)[m(a+h)+c − (ma+c)]/h = lim(h→0) mh/h = m — the derivative of a line is simply its own slope, everywhere, which makes sense since a straight line is its own tangent line at every point.<br>
For f(x)=1/x at a=1: f'(1) = lim(h→0)[1/(1+h) − 1]/h = lim(h→0)[1−(1+h)]/[h(1+h)] = lim(h→0)[−h]/[h(1+h)] = lim(h→0) −1/(1+h) = −1.
</div>
`,
questions:[
{q:'What does the expression [f(a+h)−f(a)]/h represent, before any limit is taken?', options:['The exact instantaneous rate of change at x=a','An average rate of change of f over the interval from a to a+h','The value of f at x=a','The second derivative of f at x=a'], correct:1, exp:'Before taking the limit, this fraction is an ordinary average rate of change — how much the output changed (the numerator) divided by how much the input changed (h). It only becomes the exact, instantaneous rate of change once you let h shrink all the way toward 0, which is precisely what the limit in the derivative\'s definition accomplishes.'},
{q:'What is the geometric meaning of f\'(a)?', options:['The area under the curve from 0 to a','The slope of the secant line between two arbitrary points on the curve','The slope of the tangent line to y=f(x) at the point x=a','The y-intercept of the curve'], correct:2, exp:'As the second point Q on the secant line slides toward P (the point at x=a), the secant line rotates into position and becomes the tangent line at P. The derivative f\'(a) is exactly the slope of that limiting tangent line — this is the entire geometric payoff of the limit definition.'},
{q:'What condition must hold for f\'(a) to exist?', options:['f(a) must be positive','The left-hand derivative L(f\'(a)) and right-hand derivative R(f\'(a)) must both exist and be equal','f must be a polynomial','a must be an integer'], correct:1, exp:'Because the derivative is defined as a limit, it inherits the requirement that both one-sided versions of that limit exist and agree. If L(f\'(a)) and R(f\'(a)) disagree (or either fails to exist), then f\'(a) itself simply does not exist, regardless of how well-behaved the function looks elsewhere.'},
{q:'Why does f(x)=|x| fail to be differentiable at x=0?', options:['Because |x| is not defined at x=0','Because the left-hand derivative (−1, from the x<0 piece) and the right-hand derivative (+1, from the x>0 piece) disagree, reflecting the visibly sharp corner in the graph at that point','Because |x| is negative for some values of x','Because the derivative of any absolute value function is always undefined everywhere'], correct:1, exp:'For x slightly less than 0, |x|=−x, giving a slope of −1; for x slightly greater than 0, |x|=x, giving a slope of +1. Since these one-sided slopes disagree, there is no single well-defined tangent direction at x=0 — matching the sharp corner you can see directly in the graph of |x| at the origin.'},
{q:'Using the definition of the derivative, find f\'(a) for the constant function f(x)=7.', options:['7','0','1','Undefined'], correct:1, exp:'f\'(a) = lim(h→0)[7−7]/h = lim(h→0) 0/h = 0. A constant function never changes value no matter how the input changes, so its instantaneous rate of change is zero everywhere — matching the intuitive idea that a flat, horizontal line has slope zero.'},
{q:'Using the definition of the derivative, find f\'(a) for the linear function f(x)=5x+3, at any point a.', options:['5','3','5a+3','0'], correct:0, exp:'f\'(a) = lim(h→0)[5(a+h)+3 − (5a+3)]/h = lim(h→0) 5h/h = 5. A straight line has the same slope everywhere along its length, so its derivative — being exactly that slope — comes out to the same constant value (5) no matter which point a you evaluate it at.'},
{q:'Using the definition of the derivative, find f\'(2) for f(x)=x²+3x, using the increment h approach.', options:['7','4','2','11'], correct:0, exp:'f\'(2)=lim(h→0)[(2+h)²+3(2+h) − (4+6)]/h = lim(h→0)[4+4h+h²+6+3h−10]/h = lim(h→0)[h²+7h]/h = lim(h→0)(h+7) = 7. This matches the general power/polynomial derivative rules covered later in this unit, giving the same answer as a quick sanity check once those shortcuts are available.'},
{q:'Using the definition, find f\'(1) for f(x)=1/x.', options:['-1','1','-1/2','1/2'], correct:0, exp:'f\'(1) = lim(h→0)[1/(1+h) − 1]/h = lim(h→0)[1−(1+h)]/[h(1+h)] = lim(h→0)(−h)/[h(1+h)] = lim(h→0) −1/(1+h) = −1/(1+0) = −1.'},
{q:'A function f(x) is defined piecewise as 4x+1 for x<2, and x²+3 for x≥2. Find L(f\'(2)) and R(f\'(2)), and determine whether f\'(2) exists.', options:['L.H.D.=4, R.H.D.=4; f\'(2) exists and equals 4','L.H.D.=4, R.H.D.=4x; the derivative varies with x','L.H.D.=4, R.H.D.=4; f\'(2) does not exist since they only look equal by coincidence','L.H.D.=1, R.H.D.=3; f\'(2) does not exist'], correct:0, exp:'For x<2, f(x)=4x+1, a line of slope 4, so L.H.D.=4. For x≥2, f(x)=x²+3, whose derivative is 2x, giving R.H.D. at x=2 of 2(2)=4. Since L.H.D.=R.H.D.=4, f\'(2) exists and equals 4 — the two pieces meet smoothly at x=2 with matching slopes, unlike the |x| example where the one-sided slopes disagreed.'},
{q:'In a machine learning model, gradient descent repeatedly nudges a parameter in the direction opposite to the derivative (slope) of the loss function at the current parameter value. Which core idea from this section explains why the derivative is exactly the right quantity to use for deciding which direction reduces the loss fastest?', options:['The derivative has no directional meaning, only a magnitude','The derivative is the slope of the tangent line to the loss function at the current point, so it tells you the instantaneous direction and steepness of increase there — stepping opposite to it moves toward decreasing loss, at least locally','The derivative always equals zero at the current parameter value','Gradient descent does not actually use derivatives, only random search'], correct:1, exp:'This is a direct, literal application of the tangent-slope interpretation from this section: the derivative at a point tells you the direction and steepness in which the function is currently increasing. Since gradient descent wants to decrease the loss, it steps in the exact opposite direction of that slope — the entire algorithm is built on the geometric meaning of the derivative introduced here, just applied to a loss function instead of an abstract curve.'},
{q:'A pharmacokinetic researcher measures a patient\'s drug concentration C(t) at several closely spaced times and computes [C(t+h)−C(t)]/h for a small time increment h, in order to estimate how fast the concentration is currently changing. Which concept from this section is this calculation approximating?', options:['The area under the concentration curve','The average concentration over the entire treatment','The instantaneous derivative C\'(t) — the exact rate of change of concentration at time t, which the finite-difference calculation [C(t+h)−C(t)]/h approaches as h shrinks toward zero','The total dose administered'], correct:2, exp:'[C(t+h)−C(t)]/h is precisely the average-rate-of-change expression from the derivative\'s definition, evaluated at a small but nonzero h rather than in the true limit. Using a small real h (rather than taking h all the way to 0 mathematically) is exactly how derivatives are approximated numerically in practice — the smaller h gets, the closer this finite-difference calculation comes to the true instantaneous derivative C\'(t).'}
]},

{ id:'t28', unit:'Unit 12 · Differentiation', title:'12.4 First Principle and the Standard Formula Table', notes: `
<p>Using the raw definition of the derivative every single time would make calculus painfully slow. This section derives a handful of general-purpose formulas once, using the definition (the "first principle" method), so that afterward you can differentiate most ordinary functions almost by pattern-matching.</p>
<h4>The first-principle procedure</h4>
<p>Let Δx denote a small increment in x, and Δy the corresponding change in y=f(x). The procedure has five steps: write y+Δy=f(x+Δx); subtract y=f(x) to get Δy=f(x+Δx)−f(x); divide both sides by Δx; take the limit as Δx→0; and call the result dy/dx.</p>
<div class="formula-box">dy/dx = lim(Δx→0) [f(x+Δx) − f(x)] / Δx</div>
<p>Running this procedure through for a handful of standard functions produces the results every later calculation in this unit leans on:</p>
<div class="formula-box">
d/dx (k) = 0&nbsp;&nbsp;(k a constant)<br>
d/dx (xⁿ) = nxⁿ⁻¹<br>
d/dx (ax+b)ⁿ = na(ax+b)ⁿ⁻¹<br>
d/dx (eᵃˣ) = aeᵃˣ<br>
d/dx (logₐ x) = (1/x)logₐe&nbsp;&nbsp;&nbsp;&nbsp;in particular, d/dx (ln x) = 1/x
</div>
<h4>The rest of the standard toolkit</h4>
<p>Beyond these core building blocks, a short list of combination rules (most stated without proof, since the point of this unit is fluent use rather than derivation) covers everything else you will need:</p>
<div class="formula-box">
d/dx (cu) = c·du/dx&nbsp;&nbsp;(c constant, u a function of x)<br>
d/dx (u±v) = du/dx ± dv/dx<br>
d/dx (uv) = u·dv/dx + v·du/dx&nbsp;&nbsp;(Product Rule)<br>
d/dx (u/v) = [v·du/dx − u·dv/dx] / v²&nbsp;&nbsp;(Quotient Rule)<br>
d/dx [f(x)ⁿ] = n[f(x)]ⁿ⁻¹ · f'(x)&nbsp;&nbsp;(chain rule for a power of a function)<br>
d/dx [1/f(x)] = −f'(x) / [f(x)]²
</div>
<div class="worked"><div class="label">Worked examples</div>
d/dx (x¹¹) = 11x¹⁰.<br>
d/dx (2x+5)³ = 3(2x+5)²·2 = 6(2x+5)².<br>
d/dx [(x²+1)(x−1)]: by the product rule, (x²+1)(1) + (x−1)(2x) = x²+1+2x²−2x = 3x²−2x+1.<br>
d/dx [(x+2)/(x−3)]: by the quotient rule, [(x−3)(1) − (x+2)(1)]/(x−3)² = [x−3−x−2]/(x−3)² = −5/(x−3)².
</div>
<p>The polynomial derivative rule generalizes the power rule term by term: for f(x)=a₀xⁿ+a₁xⁿ⁻¹+...+aₙ₋₁x+aₙ, the derivative is na₀xⁿ⁻¹+(n−1)a₁xⁿ⁻²+...+aₙ₋₁, obtained simply by differentiating each term separately using d/dx(xᵏ)=kxᵏ⁻¹ and discarding the constant term entirely.</p>
`,
questions:[
{q:'What is the "first principle" method for finding a derivative?', options:['Looking up the answer in a table without any justification','Directly applying the limit definition dy/dx = lim(Δx→0)[f(x+Δx)−f(x)]/Δx and simplifying the resulting expression','Guessing the answer based on the shape of the function\'s graph','Using only the chain rule for every function'], correct:1, exp:'First principle (also called "by definition" or "ab-initio") means deriving the derivative formula from scratch using the limit definition, rather than citing a memorized shortcut. Once a formula is derived this way for a whole family of functions (like xⁿ or eᵃˣ), it becomes a standard result you can cite directly afterward.'},
{q:'What is d/dx(xⁿ)?', options:['xⁿ⁻¹','nxⁿ⁻¹','nxⁿ','nxⁿ⁺¹'], correct:1, exp:'The power rule, d/dx(xⁿ)=nxⁿ⁻¹, is one of the most frequently used results in all of calculus. It is derived via first principle using the standard limit result lim(x→a)(xⁿ−aⁿ)/(x−a)=naⁿ⁻¹ from the previous unit — the two results are directly linked.'},
{q:'What is d/dx[(ax+b)ⁿ]?', options:['n(ax+b)ⁿ⁻¹','na(ax+b)ⁿ⁻¹','a(ax+b)ⁿ⁻¹','n(ax+b)ⁿ'], correct:1, exp:'d/dx(ax+b)ⁿ = na(ax+b)ⁿ⁻¹ — the ordinary power rule, but with an extra factor of a tacked on, since the "inside" of the power, ax+b, has its own derivative of a with respect to x. This is a preview of the chain rule idea covered explicitly in the next section.'},
{q:'What is d/dx(eᵃˣ)?', options:['eᵃˣ','aeᵃˣ','eᵃ','a²eᵃˣ'], correct:1, exp:'d/dx(eᵃˣ)=aeᵃˣ. The exponential function eˣ is famously its own derivative (the a=1 special case), and the general aˣ-in-the-exponent version simply picks up an extra factor of a, again previewing the chain rule pattern.'},
{q:'What is d/dx(logₐ x)?', options:['(1/x)logₐe','logₐe','x·logₐe','1/x, regardless of the base a'], correct:0, exp:'d/dx(logₐx) = (1/x)logₐe, for any valid base a. In the special case a=e, logₑe=1, so this simplifies to the especially clean and frequently used result d/dx(ln x)=1/x.'},
{q:'Using the product rule, find d/dx[(x²+1)(x−1)].', options:['3x²−2x+1','2x−1','x²−1','3x²+1'], correct:0, exp:'Product rule: (x²+1)·d/dx(x−1) + (x−1)·d/dx(x²+1) = (x²+1)(1) + (x−1)(2x) = x²+1+2x²−2x = 3x²−2x+1. (You can double-check this by expanding (x²+1)(x−1)=x³−x²+x−1 first and differentiating term by term, which gives the same 3x²−2x+1 — a useful cross-check when the product rule feels error-prone.)'},
{q:'Using the quotient rule, find d/dx[(x+2)/(x−3)].', options:['-5/(x−3)²','5/(x−3)²','1/(x−3)²','-1/(x−3)²'], correct:0, exp:'Quotient rule: [(x−3)·d/dx(x+2) − (x+2)·d/dx(x−3)] / (x−3)² = [(x−3)(1) − (x+2)(1)]/(x−3)² = [x−3−x−2]/(x−3)² = −5/(x−3)².'},
{q:'Find d/dx[x⁵ + 3x² + 7].', options:['5x⁴ + 6x','5x⁴ + 6x + 7','5x⁴ + 3x','x⁴ + 6x'], correct:0, exp:'Differentiate term by term: d/dx(x⁵)=5x⁴, d/dx(3x²)=6x, and d/dx(7)=0 (a constant\'s derivative is always zero). Adding these gives 5x⁴+6x — the constant term 7 disappears entirely, which is exactly the "discard the constant" rule the notes mention for polynomial derivatives.'},
{q:'Find d/dx[(4x+1)⁵] using the chain-rule-style power formula d/dx[f(x)ⁿ]=n[f(x)]ⁿ⁻¹f\'(x).', options:['20(4x+1)⁴','5(4x+1)⁴','20(4x+1)⁵','4(4x+1)⁴'], correct:0, exp:'Here f(x)=4x+1 (so f\'(x)=4) and n=5. Applying the formula: 5(4x+1)⁴·4 = 20(4x+1)⁴. This is the exact same "extra factor from the inside function\'s own derivative" pattern seen in the (ax+b)ⁿ standard result.'},
{q:'Find d/dx[1/(x²+1)] using the formula d/dx[1/f(x)] = −f\'(x)/[f(x)]².', options:['-2x/(x²+1)²','2x/(x²+1)²','-1/(x²+1)²','-2x/(x²+1)'], correct:0, exp:'Here f(x)=x²+1, so f\'(x)=2x. Applying the formula: −(2x)/(x²+1)² = −2x/(x²+1)². Notice this is just the quotient rule applied to the specific case where the numerator is the constant 1, giving the simplified form shown here.'},
{q:'In pharmacokinetics, the concentration of two interacting drugs is sometimes modeled as a product of two separate time-dependent functions, C(t) = A(t)·B(t), and researchers need d[C(t)]/dt to understand how quickly the combined effect is changing. Which rule from this section directly applies?', options:['The Quotient Rule','The Product Rule: dC/dt = A(t)·B\'(t) + B(t)·A\'(t)','The chain rule for powers, since C(t) is not itself a power of a function','None of the standard rules apply to a product of two time-dependent functions'], correct:1, exp:'A concentration modeled as a literal product of two separate functions of time is exactly the setup the Product Rule is built for: dC/dt = A(t)B\'(t) + B(t)A\'(t). This is a direct, unmodified application of the same product rule used throughout this section for algebraic examples, just with A(t) and B(t) representing real physiological quantities instead of abstract polynomial pieces.'},
{q:'A cost-efficiency ratio in a manufacturing process is modeled as R(x) = Cost(x)/Output(x), where both Cost and Output are functions of the production level x. Which rule is needed to find dR/dx?', options:['The Product Rule','The Quotient Rule: dR/dx = [Output(x)·Cost\'(x) − Cost(x)·Output\'(x)] / [Output(x)]²','The power rule alone, since R(x) is not raised to any power','d/dx(k)=0, since ratios are always constant'], correct:1, exp:'A ratio of two functions of the same variable is exactly the situation the Quotient Rule handles: differentiate the numerator function and denominator function separately, combine them according to the quotient formula, and divide by the square of the denominator function — directly analogous to the (x+2)/(x−3) worked example in this section, just with Cost(x) and Output(x) standing in for the algebraic pieces.'}
]},

{ id:'t29', unit:'Unit 12 · Differentiation', title:'12.5 The Chain Rule', notes: `
<p>Many functions worth differentiating are not simple expressions in x directly, but rather built up in layers — a function of a function of a function. The chain rule is the tool for peeling those layers apart, one derivative at a time.</p>
<p>Suppose y depends on u, which in turn depends on w, which in turn depends on x:</p>
<div class="formula-box">y = f(u),&nbsp;&nbsp;u = g(w),&nbsp;&nbsp;w = h(x)</div>
<p>To find dy/dx directly would mean first substituting everything into one messy expression purely in terms of x. The chain rule sidesteps that entirely: differentiate each layer with respect to the variable it depends on directly, then multiply the pieces together.</p>
<div class="formula-box">dy/dx = (dy/du) × (du/dw) × (dw/dx)</div>
<p>Notice the "telescoping" structure: each factor's denominator cancels (informally speaking) with the numerator of the next factor, exactly the way units cancel in a chain of unit conversions — dy/du times du/dw times dw/dx leaves you with dy/dx, the same way miles/hour times hours/day gives miles/day.</p>
<div class="worked"><div class="label">Worked example</div>Let y=3u, u=v², v=4x²+5. Differentiating each layer separately with respect to its own variable: dy/du=3, du/dv=2v, dv/dx=8x. Multiplying: dy/dx = 3·(2v)·(8x) = 48xv. Substituting v back in terms of x: dy/dx = 48x(4x²+5).</div>
<div class="worked"><div class="label">A second worked example</div>Let y=u², u=3v, v=x/(x+1). Differentiating each layer: dy/du=2u, du/dv=3, and dv/dx (via the quotient rule) = [(x+1)(1)−x(1)]/(x+1)² = 1/(x+1)². Multiplying: dy/dx = (2u)(3)[1/(x+1)²] = 6u/(x+1)². Substituting u=3v=3x/(x+1) back in: dy/dx = 6[3x/(x+1)]/(x+1)² = 18x/(x+1)³.</div>
<p>The chain rule is what secretly justifies the "extra factor" pattern seen in results like d/dx(ax+b)ⁿ = na(ax+b)ⁿ⁻¹ and d/dx(eᵃˣ)=aeᵃˣ from the previous section: both are chain-rule computations in disguise, where the "outer" function (a power, or an exponential) is differentiated first, and then multiplied by the derivative of the "inner" linear expression.</p>
`,
questions:[
{q:'The chain rule is used in which situation?', options:['When differentiating a simple polynomial in x directly','When y depends on x indirectly, through one or more intermediate variables — for example y=f(u), u=g(w), w=h(x)','Only when finding second derivatives','Only for trigonometric functions'], correct:1, exp:'The chain rule specifically handles layered, composite dependencies — y depending on u, which depends on w, which depends on x. For a function written directly in terms of x with no intermediate layers, the ordinary rules (power rule, product rule, and so on) suffice without needing the chain rule explicitly.'},
{q:'For y=f(u), u=g(w), w=h(x), what is the chain rule formula for dy/dx?', options:['dy/dx = dy/du + du/dw + dw/dx','dy/dx = (dy/du)(du/dw)(dw/dx)','dy/dx = dy/du divided by dw/dx','dy/dx = dy/du only, ignoring the other layers'], correct:1, exp:'The chain rule multiplies the derivatives of each layer together: dy/dx = (dy/du)×(du/dw)×(dw/dx). This mirrors how unit-conversion factors multiply together and cancel — each layer\'s derivative "hands off" to the next, ultimately connecting y all the way back to x.'},
{q:'Let y=5u, u=v³, v=2x²+3. Find dy/dx.', options:['30xv²','60xv²','5v²','30x(2x²+3)²... wait, evaluate the coefficient carefully'], correct:1, exp:'Differentiate each layer: dy/du=5, du/dv=3v², dv/dx=4x. Multiply: dy/dx = 5·(3v²)·(4x) = 60xv². Substituting v=2x²+3 gives 60x(2x²+3)², but expressed purely in terms of the intermediate variable v, the answer is 60xv².'},
{q:'For the previous question (y=5u, u=v³, v=2x²+3), substitute v back in terms of x to express dy/dx fully in terms of x.', options:['60x(2x²+3)²','60x(2x²+3)','5(2x²+3)²','30x(2x²+3)³'], correct:0, exp:'From dy/dx=60xv², substitute v=2x²+3: dy/dx = 60x(2x²+3)². This final substitution step — converting the answer from intermediate variables back to the original variable x — is often the last, easy-to-forget step in a chain-rule computation.'},
{q:'Let y=u², u=3v, v=x²+1. Find dy/dx in terms of x.', options:['36x(x²+1)','12x(x²+1)','6x(x²+1)','18x(x²+2)'], correct:0, exp:'Differentiate each layer: dy/du=2u, du/dv=3, dv/dx=2x. Multiply: dy/dx=(2u)(3)(2x)=12ux. Substituting u=3v=3(x²+1): dy/dx=12x·3(x²+1)=36x(x²+1). It is easy to stop one step early and report 12x(x²+1) — forgetting that u itself still needs to be substituted back in terms of x before the answer is complete.'},
{q:'Why does the chain rule\'s formula dy/dx=(dy/du)(du/dw)(dw/dx) make intuitive sense, based on how each factor\'s units seem to cancel?', options:['It does not make sense, it is purely a formal rule with no intuitive interpretation','Each factor connects one layer to the next — dy/du measures change in y per unit change in u, du/dw measures change in u per unit change in w, and so on — so multiplying them together tracks how a change in x ultimately propagates all the way through to a change in y, the same way sequential unit-conversion factors multiply and cancel','The chain rule only works when all the derivatives happen to equal the same number','Chain rule factors do not actually multiply, they add'], correct:1, exp:'Each derivative in the chain measures a local "rate of change per unit change in the previous variable." Multiplying them together tracks the compounded effect: a small change in x causes a proportional change in w, which causes a proportional change in u, which causes a proportional change in y — chaining all those proportional relationships together via multiplication (exactly like sequential unit-conversion factors) gives the overall rate of change of y with respect to x.'},
{q:'Which previously-covered "standard result" formula is actually a disguised application of the chain rule, with an outer power function and an inner linear function?', options:['d/dx(k)=0','d/dx[(ax+b)ⁿ] = na(ax+b)ⁿ⁻¹','d/dx(u+v) = du/dx + dv/dx','None of the standard results involve the chain rule'], correct:1, exp:'d/dx[(ax+b)ⁿ] applies the chain rule with outer function (something)ⁿ and inner function ax+b: differentiating the outer power gives n(ax+b)ⁿ⁻¹, and multiplying by the inner function\'s own derivative (which is simply a) gives the full result na(ax+b)ⁿ⁻¹ — the extra factor of a is exactly the chain rule\'s "inner derivative" contribution, not a separate, unrelated rule.'},
{q:'In deep learning, backpropagation computes how a small change in an early-layer weight affects the final loss value, by multiplying together the local derivative at each layer the signal passes through on its way to the output. Which concept from this section is backpropagation, at its mathematical core, a large-scale application of?', options:['The power rule alone','The chain rule — exactly the same "multiply the derivatives of each intermediate layer together" idea covered in this section, just applied across many layers of a neural network instead of two or three algebraic substitutions','The quotient rule','d/dx(k)=0, since neural network weights are treated as constants'], correct:1, exp:'Backpropagation is, mathematically, nothing more than a repeated application of the chain rule across every layer of a network: the effect of an early weight on the final loss is computed by multiplying together the local derivative at each layer the computation passes through, exactly mirroring dy/dx=(dy/du)(du/dw)(dw/dx) from this section — just with dozens or hundreds of layers standing in for u, w, and the handful of intermediate variables used in the worked examples here.'},
{q:'A physiologist models heart rate as a function of blood oxygen level, which is itself a function of altitude, which is itself a function of time during a climb. To find how quickly heart rate changes with time at a given moment, which approach from this section is appropriate?', options:['Differentiate heart rate directly with respect to time, ignoring the intermediate variables entirely','Apply the chain rule: multiply the derivative of heart rate with respect to oxygen level, by the derivative of oxygen level with respect to altitude, by the derivative of altitude with respect to time','Add the three derivatives together instead of multiplying them','This scenario cannot be modeled using differentiation at all'], correct:1, exp:'This is exactly the three-layer chain rule structure from the notes (y depends on u, which depends on w, which depends on x), just with heart rate, oxygen level, altitude, and time playing the roles of y, u, w, and x respectively. Multiplying the three individual-layer derivatives together gives the overall rate of change of heart rate with respect to time, without ever needing to write heart rate as one single, complicated direct formula in terms of time.'}
]},

{ id:'t30', unit:'Unit 12 · Differentiation', title:'12.6a Exponential and Logarithmic Derivatives', notes: `
<p>Exponential and logarithmic functions show up constantly in growth and decay models, so it is worth having their derivative patterns down cold, including the chain-rule-flavored versions where the exponent or the argument is itself a function of x rather than plain x.</p>
<div class="formula-box">
d/dx (aˣ) = aˣ · ln a&nbsp;&nbsp;&nbsp;&nbsp;d/dx (a^(bx)) = b·a^(bx)·ln a&nbsp;&nbsp;&nbsp;&nbsp;d/dx (e^(f(x))) = e^(f(x)) · f'(x)<br>
d/dx (logₐ x) = (1/x)logₐe&nbsp;&nbsp;&nbsp;&nbsp;d/dx (ln x) = 1/x&nbsp;&nbsp;&nbsp;&nbsp;d/dx [log(f(x))] = f'(x)/f(x)
</div>
<p>Notice the pattern across every one of these: the base of the exponential (or logarithm) contributes a constant factor (ln a, or logₐe), while any "inner" function riding inside the exponent or argument contributes its own derivative as an extra multiplied factor — precisely the chain rule at work again.</p>
<div class="worked"><div class="label">Worked examples</div>
d/dx(3ˣ) = 3ˣ·ln 3.<br>
d/dx(e^(5x²)) = e^(5x²)·(10x) = 10x·e^(5x²), since the inner function is 5x² with derivative 10x.<br>
d/dx[log(1+3x²)] = (6x)/(1+3x²), since the inner function is 1+3x² with derivative 6x.
</div>
<h4>A useful trick: simplify the expression before differentiating</h4>
<p>Some log expressions look intimidating purely because of the base being used, but simplify dramatically using log identities before any derivative is taken at all.</p>
<div class="worked"><div class="label">Worked example — spotting a hidden constant</div>Consider y = logₓ(x²) (log base x of x²). Using the identity log_b(mⁿ)=n·log_b(m), this simplifies to y = 2·logₓ(x) = 2·1 = 2 — a plain constant, regardless of x! Since the derivative of any constant is zero, dy/dx = 0 immediately, with no further calculus needed — the entire difficulty here was algebraic simplification, not differentiation.</div>
<div class="worked"><div class="label">Worked example — base-change before differentiating</div>Consider y = logₓ(5) (log base x of the constant 5). Using the change-of-base formula, y = (ln 5)/(ln x) = (ln 5)·(ln x)⁻¹. Now differentiate using the constant-multiple and power/chain rules: dy/dx = (ln 5)·(−1)(ln x)⁻²·(1/x) = −(ln 5) / [x(ln x)²].</div>
`,
questions:[
{q:'What is d/dx(aˣ) for a constant base a>0, a≠1?', options:['aˣ','aˣ·ln a','xaˣ⁻¹','ln a'], correct:1, exp:'d/dx(aˣ) = aˣ·ln a. The special case a=e gives d/dx(eˣ)=eˣ·ln e = eˣ·1 = eˣ, which is exactly why e is such a convenient base — it is the one exponential base whose derivative has no extra multiplying constant at all.'},
{q:'What is d/dx(e^(f(x))) for a general function f(x)?', options:['e^(f(x))','e^(f(x))·f\'(x)','f\'(x)','e^(f\'(x))'], correct:1, exp:'d/dx(e^(f(x))) = e^(f(x))·f\'(x) — the chain rule applied to the exponential function: differentiate the "outer" exponential (which reproduces itself), then multiply by the derivative of whatever function sits in the exponent.'},
{q:'Find d/dx(e^(5x²)).', options:['10x·e^(5x²)','e^(5x²)','5x·e^(5x²)','10x²·e^(5x²)'], correct:0, exp:'Here f(x)=5x², so f\'(x)=10x. Applying the chain-rule formula d/dx(e^(f(x)))=e^(f(x))f\'(x), the outer exponential reproduces itself and picks up the inner derivative as a multiplying factor: e^(5x²)·10x = 10x·e^(5x²).'},
{q:'What is d/dx[log(f(x))] for a general function f(x)?', options:['1/f(x)','f\'(x)/f(x)','log(f\'(x))','f(x)·f\'(x)'], correct:1, exp:'d/dx[log(f(x))] = f\'(x)/f(x). This is the chain rule applied to the natural log: differentiate the "outer" log (giving 1/(something)), then multiply by the derivative of the inner function f(x).'},
{q:'Find d/dx[log(1+3x²)].', options:['6x/(1+3x²)','3x/(1+3x²)','1/(1+3x²)','6x'], correct:0, exp:'Here f(x)=1+3x², so f\'(x)=6x. Applying the logarithm chain rule f\'(x)/f(x), the inner function\'s own derivative sits on top of the inner function itself: the result is 6x/(1+3x²).'},
{q:'What is d/dx(ln x)?', options:['x','1/x','ln x','1'], correct:1, exp:'d/dx(ln x)=1/x is the special-base (base e) case of the general logarithm derivative d/dx(logₐx)=(1/x)logₐe, using logₑe=1. This is one of the most heavily used derivative facts in all of calculus.'},
{q:'Simplify y=logₓ(x⁵) using log identities, and then find dy/dx.', options:['y=5, dy/dx=0','y=5x, dy/dx=5','y=5logₓx, dy/dx varies with x','y cannot be simplified'], correct:0, exp:'Using log_b(mⁿ)=n·log_b(m): logₓ(x⁵)=5·logₓ(x)=5·1=5, a plain constant (since logₓx=1 for any valid base x). Since y is simply the constant 5 regardless of x, dy/dx=0 immediately — no chain rule or log-derivative formula is actually needed once the simplification is spotted.'},
{q:'Find dy/dx for y=logₓ(7), using the change-of-base formula first.', options:['-(ln 7)/[x(ln x)²]','(ln 7)/[x(ln x)²]','1/(x ln 7)','-(ln 7)/x'], correct:0, exp:'Change of base: y=logₓ(7)=(ln 7)/(ln x)=(ln 7)(ln x)⁻¹. Differentiating (treating ln 7 as a constant multiplier and applying the chain rule to (ln x)⁻¹): dy/dx=(ln 7)·(−1)(ln x)⁻²·(1/x) = −(ln 7)/[x(ln x)²].'},
{q:'Find d/dx(4^(3x)) using d/dx(a^(bx))=b·a^(bx)·ln a.', options:['3·4^(3x)·ln 4','4^(3x)·ln 4','3·4^(3x)','4^(3x)'], correct:0, exp:'Here a=4, b=3. Applying the formula d/dx(a^(bx))=b·a^(bx)·ln a directly, with no further simplification needed: the result is 3·4^(3x)·ln 4.'},
{q:'In epidemiology, the number of infections I(t) in an early, unconstrained outbreak is sometimes modeled as I(t)=I₀·e^(kt), where k is a growth rate constant. Find dI/dt, and explain what it represents.', options:['k·e^(kt), representing the growth rate constant alone','I₀·k·e^(kt) = k·I(t), representing the instantaneous rate at which new infections are appearing at time t, which is itself proportional to the current number of infections','I₀, a constant with no time dependence','e^(kt), ignoring the constants I₀ and k entirely'], correct:1, exp:'Using d/dx(e^(f(x)))=e^(f(x))f\'(x) with f(t)=kt (so f\'(t)=k): dI/dt = I₀·e^(kt)·k = k·I₀e^(kt) = k·I(t). This says the instantaneous rate of new infections is directly proportional to the current number of infections — the defining mathematical signature of exponential ("unchecked") outbreak growth, derived directly from the exponential derivative rule in this section.'},
{q:'A sound intensity measurement in decibels is calculated using a logarithmic formula, dB(P) = 10·log₁₀(P/P₀), where P is measured power and P₀ is a reference power. Using d/dx[log(f(x))]=f\'(x)/f(x) (adjusted for base 10 via a constant multiplier), which section concept explains why doubling the power P does not simply double the decibel reading?', options:['Because decibels are unrelated to logarithms','Because the decibel formula is built on a logarithm, and the derivative of a logarithm — 1/x-type behavior — means its rate of change shrinks as the underlying quantity grows, so equal absolute changes in P produce shrinking changes in dB as P increases, unlike a simple proportional (linear) relationship','Because P₀ is always zero','Because logarithms only apply to whole numbers'], correct:1, exp:'Since a logarithm\'s derivative behaves like (constant)/x — shrinking as x grows — equal absolute increases in power P produce progressively smaller increases in the decibel reading as P gets larger. This diminishing-sensitivity behavior is a direct consequence of the logarithmic derivative pattern from this section, and it is exactly why decibel (and other logarithmic) scales are used whenever a quantity varies over an enormous range but perceived or reported change should compress that range sensibly.'}
]},

{ id:'t31', unit:'Unit 12 · Differentiation', title:'12.6b Parametric and Implicit Differentiation', notes: `
<p>Not every curve is conveniently written as y=f(x). This section covers two situations where that direct form is unavailable or inconvenient, and shows how to find dy/dx anyway.</p>
<h4>Parametric functions</h4>
<p>Sometimes both x and y are given separately in terms of a third variable (a parameter), often called t: x=f(t), y=g(t). Neither x nor y is written directly in terms of the other, but dy/dx can still be recovered using the chain rule in a rearranged form:</p>
<div class="formula-box">dy/dx = (dy/dt) / (dx/dt)</div>
<p>In words: differentiate y and x separately with respect to the parameter t, then divide the two results — the parameter t cancels out of the picture (informally), leaving a relationship purely between x and y, exactly the dy/dx you were after.</p>
<div class="worked"><div class="label">Worked example</div>x=3t²+1, y=2t³. Then dx/dt=6t and dy/dt=6t². So dy/dx = 6t²/6t = t. (If a fully x-only expression were needed, you would solve x=3t²+1 for t and substitute — but very often, as here, leaving the answer in terms of the parameter t is perfectly acceptable and even clearer.)</div>
<h4>Implicit functions</h4>
<p>An explicit function writes y directly as a formula in x: y=f(x). An <strong>implicit function</strong> instead relates x and y together in a single equation, f(x,y)=c, without solving for y on its own — sometimes because doing so is inconvenient, and sometimes because it is not even possible to isolate y using ordinary algebra.</p>
<p>The procedure: differentiate both sides of the equation with respect to x as usual, remembering that y is secretly a function of x, so any term involving y needs the chain rule (producing a factor of dy/dx each time you differentiate a y-term). Once every term is differentiated, collect all the dy/dx terms on one side, factor it out, and solve.</p>
<div class="worked"><div class="label">Worked example</div>x²+y³−4xy=7. Differentiating term by term with respect to x: 2x + 3y²(dy/dx) − 4[y + x(dy/dx)] = 0 (the xy term needs the product rule, contributing both a plain y and an x(dy/dx) piece). Expanding: 2x + 3y²(dy/dx) − 4y − 4x(dy/dx) = 0. Collecting the dy/dx terms: (dy/dx)(3y²−4x) = 4y−2x. So dy/dx = (4y−2x)/(3y²−4x).</div>
<div class="worked"><div class="label">A simpler, classic example</div>x²+y²=c² (a circle of radius c). Differentiating: 2x + 2y(dy/dx) = 0, so dy/dx = −x/y. Notice y itself never got "solved for" at any point in this computation — the relationship between x, y, and dy/dx was found directly from the original equation.</div>
`,
questions:[
{q:'For a parametric curve x=f(t), y=g(t), what is the formula for dy/dx?', options:['dy/dx = (dy/dt)(dx/dt)','dy/dx = (dy/dt) / (dx/dt)','dy/dx = (dx/dt) / (dy/dt)','dy/dx = dy/dt + dx/dt'], correct:1, exp:'dy/dx = (dy/dt)/(dx/dt) — differentiate y and x each with respect to the shared parameter t, then divide. This is really the chain rule rearranged: (dy/dt) = (dy/dx)(dx/dt), and solving that for dy/dx gives exactly this formula.'},
{q:'For the parametric curve x=3t²+1, y=2t³, find dy/dx.', options:['t','6t','3t²','2t'], correct:0, exp:'dx/dt=6t, dy/dt=6t². So dy/dx=(dy/dt)/(dx/dt)=6t²/6t=t — the two factors of 6 and one power of t cancel, leaving a strikingly simple result.'},
{q:'For the parametric curve x=t²+2t, y=t³−3t, find dy/dx.', options:['(3t²−3)/(2t+2)','(3t²−3)(2t+2)','(2t+2)/(3t²−3)','3t²−3'], correct:0, exp:'dx/dt=2t+2 and dy/dt=3t²−3. So dy/dx = (3t²−3)/(2t+2), leaving the answer in terms of the parameter t, which is the standard, expected form for a parametric derivative unless a fully x-based expression is specifically requested.'},
{q:'What distinguishes an implicit function from an explicit function?', options:['Implicit functions never involve y at all','An explicit function writes y directly as a formula in x (y=f(x)); an implicit function instead relates x and y together in one combined equation, f(x,y)=c, without isolating y on its own','Implicit functions can only be linear','There is no real difference between the two'], correct:1, exp:'Explicit means y is written as a standalone formula purely in terms of x. Implicit means x and y are tangled together in a single equation — sometimes because solving for y explicitly is inconvenient, and sometimes because it is algebraically impossible using elementary functions at all.'},
{q:'When differentiating an implicit equation, why does differentiating a term containing y (like y³ or xy) produce an extra factor of dy/dx?', options:['It does not — y is treated as an ordinary constant','Because y is understood to secretly be a function of x, so differentiating any expression involving y requires the chain rule, which contributes a factor of dy/dx exactly the way differentiating f(w) with w=h(x) contributes a factor of dw/dx','Because dy/dx is always equal to 1 in implicit differentiation','Because implicit equations cannot actually be differentiated'], correct:1, exp:'Even though y is not written as an explicit formula in x, it is still understood to depend on x in the background. Differentiating any y-term therefore requires the chain rule, exactly as if y were an intermediate variable like u or w — and the chain rule always contributes a factor of the "inner" derivative, which here is dy/dx itself.'},
{q:'Differentiate x²+y²=c² implicitly to find dy/dx.', options:['-x/y','x/y','-y/x','2x/2y, left unsimplified as -x/y'], correct:0, exp:'Differentiating both sides: 2x + 2y(dy/dx) = 0 (the right side, c², is a constant since c is a fixed radius, so its derivative is 0). Solving: 2y(dy/dx) = −2x, so dy/dx = −x/y.'},
{q:'Differentiate x²+y³−4xy=7 implicitly to find dy/dx.', options:['(4y−2x)/(3y²−4x)','(2x−4y)/(3y²−4x)','(4y−2x)/(4x−3y²)','(2x+4y)/(3y²+4x)'], correct:0, exp:'Differentiating term by term: 2x + 3y²(dy/dx) − 4[y+x(dy/dx)] = 0 (the xy term uses the product rule). Expanding and collecting dy/dx terms: (dy/dx)(3y²−4x) = 4y−2x, giving dy/dx = (4y−2x)/(3y²−4x).'},
{q:'Differentiate xy+y²=10 implicitly to find dy/dx.', options:['-y/(x+2y)','y/(x+2y)','-y/(x−2y)','-(x+2y)/y'], correct:0, exp:'Differentiating term by term: the xy term needs the product rule, giving y + x(dy/dx); the y² term gives 2y(dy/dx); the right side, 10, is constant so its derivative is 0. Altogether: y + x(dy/dx) + 2y(dy/dx) = 0. Collecting: (dy/dx)(x+2y) = −y, so dy/dx = −y/(x+2y).'},
{q:'A physiological model relates blood pressure P and blood volume V through an implicit equation (a "compliance curve") that cannot easily be solved to write P explicitly as a function of V. Which technique from this section allows researchers to still find dP/dV — how pressure responds to small changes in volume — directly from the equation as given?', options:['Parametric differentiation, since P and V share a hidden third variable','Implicit differentiation: differentiate both sides of the P-V relationship with respect to V, treating P as a function of V wherever it appears (contributing a dP/dV factor via the chain rule), then solve algebraically for dP/dV','This cannot be done unless the equation is first solved explicitly for P','The quotient rule alone, without any chain-rule considerations'], correct:1, exp:'This is exactly the scenario implicit differentiation exists for: when a relationship between two physiologically meaningful quantities cannot conveniently be solved to isolate one variable as an explicit function of the other, differentiating the given equation directly — treating the dependent variable as an implicit function of the other — still recovers the rate of change relationship, without ever needing an explicit formula.'},
{q:'A robotics engineer describes a robotic arm\'s tip position using x=f(t) and y=g(t), where t is time, rather than writing y directly as a function of x. Why might parametric differentiation, rather than ordinary or implicit differentiation, be the natural choice for finding the instantaneous slope of the tip\'s path (dy/dx) at a given time?', options:['Because x and y are each naturally given as separate functions of the shared parameter t (time), so dy/dx = (dy/dt)/(dx/dt) can be computed directly from those two known functions, without ever needing to eliminate t and write y directly in terms of x','Because robotic arm paths cannot be differentiated at all','Because parametric differentiation only applies to circles','Because ordinary differentiation would give a different, less accurate answer'], correct:0, exp:'When a system\'s two coordinates are each naturally described as separate functions of a shared underlying parameter (here, time), it is often far more convenient — or even the only practical option — to differentiate each coordinate with respect to that shared parameter separately and then divide, exactly as the parametric differentiation formula in this section describes, rather than trying to eliminate the parameter and write one coordinate directly as a function of the other.'}
]},

{ id:'t32', unit:'Unit 12 · Differentiation', title:'12.7 Higher-Order Derivatives', notes: `
<p>Nothing stops you from differentiating a function's derivative all over again — and again after that. Each additional round of differentiation is called a <strong>higher-order derivative</strong>, and the notation stacks up in a matching pattern:</p>
<div class="formula-box">d²y/dx² (second derivative, differentiate twice)&nbsp;&nbsp;&nbsp;&nbsp;d³y/dx³ (third derivative, differentiate three times)&nbsp;&nbsp;&nbsp;&nbsp;...&nbsp;&nbsp;&nbsp;&nbsp;dⁿy/dxⁿ (nth derivative)</div>
<p>Computationally, there is nothing new here beyond repeating the same differentiation rules from earlier sections, applied to the previous derivative's result instead of to the original function.</p>
<div class="worked"><div class="label">Worked example — y=1/x</div>
dy/dx = −1/x² = −x⁻².<br>
d²y/dx² = differentiate −x⁻² again: 2x⁻³ = 2/x³.<br>
d³y/dx³ = differentiate 2x⁻³ again: −6x⁻⁴ = −6/x⁴.<br>
d⁴y/dx⁴ = differentiate −6x⁻⁴ again: 24x⁻⁵ = 24/x⁵.<br>
Notice the pattern in both sign (alternating) and the growing numerical factor (1, 2, 6, 24 — actually the factorials 0!, 1!, 2!, 3!... times a sign).</div>
<div class="worked"><div class="label">Worked example — y=eᵃˣ</div>
dy/dx = aeᵃˣ. Differentiating again: d²y/dx² = a²eᵃˣ. And again: d³y/dx³ = a³eᵃˣ. Each round of differentiation simply multiplies by another factor of a, since eᵃˣ keeps reproducing itself under differentiation.</div>
<div class="worked"><div class="label">Worked example — a polynomial eventually flatlines to zero</div>y=x²+5x+2. dy/dx=2x+5. d²y/dx²=2 (a constant). d³y/dx³=0 (the derivative of a constant). d⁴y/dx⁴=0 (still zero — differentiating zero gives zero, forever). This illustrates a general fact: for any polynomial of degree n, the (n+1)th derivative and every derivative after it is identically zero, since each round of differentiation strictly lowers the degree by one, until nothing but a constant (and then zero) remains.</div>
<p>Higher-order derivatives are not just an abstract exercise — the second derivative in particular carries real, independent meaning of its own, which becomes central in the next section on maxima and minima.</p>
`,
questions:[
{q:'What does the notation d³y/dx³ mean?', options:['The derivative of y with respect to x, cubed','The result of differentiating y with respect to x three separate times in a row','Three times the first derivative','The derivative evaluated at x=3'], correct:1, exp:'d³y/dx³ (the third derivative) is obtained by taking the derivative of y, then taking the derivative of that result, then taking the derivative of that result again — three full rounds of differentiation, not any kind of multiplication or cubing of a single derivative value.'},
{q:'For y=1/x, what is d²y/dx²?', options:['-1/x²','2/x³','-2/x³','1/x²'], correct:1, exp:'dy/dx = −x⁻². Differentiating again using the power rule: d²y/dx² = (−1)(−2)x⁻³ = 2x⁻³ = 2/x³.'},
{q:'For y=1/x, what is d³y/dx³?', options:['-6/x⁴','6/x⁴','-2/x³','2/x⁴'], correct:0, exp:'Starting from the already-found second derivative d²y/dx²=2x⁻³, differentiate once more using the power rule: 2·(−3)x⁻⁴ = −6x⁻⁴ = −6/x⁴, continuing the alternating-sign, growing-factor pattern established by the earlier derivatives.'},
{q:'For y=eᵃˣ, what is d³y/dx³?', options:['a³eᵃˣ','aeᵃˣ','a²eᵃˣ','eᵃˣ'], correct:0, exp:'Each round of differentiating eᵃˣ multiplies by another factor of a: dy/dx=aeᵃˣ, d²y/dx²=a²eᵃˣ, d³y/dx³=a³eᵃˣ. The exponential keeps reproducing itself, with the accumulating powers of a as the only change.'},
{q:'For the polynomial y=x²+5x+2, what is d³y/dx³?', options:['0','2','2x+5','5'], correct:0, exp:'dy/dx=2x+5, d²y/dx²=2 (a constant), and d³y/dx³=0 (the derivative of any constant is zero). Once you reach a constant, every further derivative stays at exactly zero, forever.'},
{q:'For any polynomial of degree n, what can be said about its (n+1)th derivative and every derivative beyond that?', options:['It is always equal to n','It is identically zero, since each round of differentiation lowers the degree by one, eventually leaving nothing but a constant and then zero','It grows without bound','It equals the original polynomial again'], correct:1, exp:'Each differentiation strictly reduces a polynomial\'s degree by exactly one (the power rule turns xᵏ into kxᵏ⁻¹, a lower power). After n rounds of differentiation, a degree-n polynomial is reduced to a plain constant; one more round of differentiation (the (n+1)th derivative) reduces that constant to zero, and it remains zero for every derivative after that, since differentiating zero always gives zero.'},
{q:'For y=(3x+2)⁴, find d²y/dx² using the (ax+b)ⁿ derivative pattern repeatedly.', options:['108(3x+2)²','36(3x+2)³','12(3x+2)³','144(3x+2)²'], correct:0, exp:'dy/dx = 4(3x+2)³·3 = 12(3x+2)³. Differentiating again: d²y/dx² = 12·3(3x+2)²·3 = 108(3x+2)². Each differentiation of an (ax+b)ⁿ-type expression picks up another factor of a (here, 3) alongside reducing the power by one, exactly as the standard formula predicts, applied twice in a row.'},
