{q:'In physics and biomechanics, if y(t) represents an object\'s position over time, what do the first and second derivatives, dy/dt and d²y/dt², represent respectively?', options:['dy/dt is velocity (rate of change of position); d²y/dt² is acceleration (rate of change of velocity)','dy/dt is acceleration; d²y/dt² is velocity','Both derivatives represent the same physical quantity','Neither derivative has any physical meaning'], correct:0, exp:'This is the classic physical interpretation of higher-order derivatives: the first derivative of position gives velocity (how fast position is changing), and the second derivative — the derivative of velocity — gives acceleration (how fast velocity itself is changing). This same "derivative of a derivative" structure introduced abstractly in this section underlies the entire kinematic description of motion.'},
{q:'In optimization and machine learning, the "curvature" of a loss function at a point — which determines how confidently a minimum can be identified there — is described using the Hessian, built from the function\'s second-order (and higher) partial derivatives. Which core mathematical idea from this section (generalized to multiple variables) is the Hessian directly built from?', options:['First derivatives only, with no connection to higher-order derivatives','The exact same "differentiate the derivative again" idea covered in this section — the Hessian is simply the multivariable generalization of the second derivative d²y/dx², organized into a matrix instead of a single number','The chain rule, unrelated to higher-order derivatives','Implicit differentiation exclusively'], correct:1, exp:'A single-variable second derivative, d²y/dx², tells you the curvature of a curve at a point — whether it bows upward or downward. The Hessian matrix is exactly this same idea (differentiate the derivative again) extended to functions of several variables, arranging all the second-order partial derivatives into a matrix — which, as covered in an earlier unit on quadratic forms, being positive definite or negative definite is precisely what confirms a genuine local minimum or maximum, generalizing the single-variable second-derivative test covered in the next section.'}
]},

{ id:'t33', unit:'Unit 12 · Differentiation', title:'12.8 Maxima and Minima', notes: `
<p>One of the most practically important uses of the derivative: finding the highest and lowest points of a function's graph, without having to plot every single value by hand.</p>
<h4>Local maxima and minima, and the zero-derivative clue</h4>
<p>A point x₁ is a <strong>local maximum</strong> if f(x₁) is at least as large as f(x) for every x sufficiently close to x₁ — the function's value dips down (or stays level) immediately around x₁ in every direction. A <strong>local minimum</strong> is defined the same way, with the inequality flipped: f(x₂) is at least as small as every nearby value.</p>
<p>Geometrically, at a smooth local max or min, the tangent line is perfectly horizontal — its slope is zero. Since the derivative is exactly the slope of the tangent:</p>
<div class="formula-box">At a local maximum or minimum (where the derivative exists), f'(x) = 0</div>
<h4>The converse is false — a critical warning</h4>
<p>Just because f'(c)=0 does <em>not</em> guarantee c is a maximum or minimum. Consider y=−x³: y'=−3x², which equals 0 at x=0. But x=0 is neither a max nor a min for −x³ — the function keeps increasing right through that point (it merely flattens out momentarily). A point where f'=0 but which is neither a max nor a min is called a <strong>point of inflection</strong>.</p>
<p>The reverse failure is also possible: a function can have a genuine local minimum at a point where the derivative does not even exist. y=|x| has an obvious minimum at x=0 (it is the lowest point on the entire graph, in fact a global minimum), yet — as established earlier in this unit — |x| is not differentiable at x=0 at all, because of the sharp corner there.</p>
<h4>The Second Derivative Test</h4>
<p>Given that f'(c)=0 at some point c, the second derivative resolves the ambiguity in most cases:</p>
<div class="formula-box">
If f'(c)=0 and f''(c) &gt; 0: c is a local minimum<br>
If f'(c)=0 and f''(c) &lt; 0: c is a local maximum<br>
If f'(c)=0 and f''(c) = 0: the test is inconclusive — fall back on the first-derivative (sign-change) test instead
</div>
<p>When the second derivative test fails (f''(c)=0), examine how the sign of f'(x) changes as x crosses c: a change from positive to negative signals a maximum; a change from negative to positive signals a minimum; no sign change at all signals a point of inflection, not an extremum.</p>
<div class="worked"><div class="label">Worked example</div>Find the local extrema of f(x)=x³−12x²+36x+5. f'(x)=3x²−24x+36=3(x²−8x+12)=3(x−2)(x−6), giving critical points x=2 and x=6. f''(x)=6x−24. At x=2: f''(2)=12−24=−12&lt;0, so x=2 is a local maximum, with f(2)=8−48+72+5=37. At x=6: f''(6)=36−24=12&gt;0, so x=6 is a local minimum, with f(6)=216−432+216+5=5.</div>
<div class="worked"><div class="label">A quartic example, with three critical points</div>f(x)=x⁴/4−x³/3−3x²+5. f'(x)=x³−x²−6x=x(x−3)(x+2), giving critical points x=−2, 0, 3. f''(x)=3x²−2x−6. At x=−2: f''=12+4−6=10&gt;0, local minimum, f(−2)=−1/3. At x=0: f''=−6&lt;0, local maximum, f(0)=5. At x=3: f''=27−6−6=15&gt;0, local minimum, f(3)=−43/4.</div>
`,
questions:[
{q:'At a smooth local maximum or minimum of a function, what is true of the derivative (assuming it exists there)?', options:['f\'(x) must be positive','f\'(x) must equal zero, since the tangent line is horizontal at that point','f\'(x) must be negative','f\'(x) must equal the function\'s value there'], correct:1, exp:'At a smooth local max or min, the curve momentarily flattens out — the tangent line is horizontal, meaning its slope, f\'(x), is exactly zero. This is the essential clue that lets you locate candidate maxima and minima by solving f\'(x)=0.'},
{q:'Why is f\'(c)=0 not, by itself, sufficient to guarantee that c is a local maximum or minimum?', options:['It always is sufficient — no counterexamples exist','A function can have f\'(c)=0 at a point of inflection instead, where the function merely flattens momentarily without actually reversing direction — y=−x³ at x=0 is a classic example','f\'(c)=0 never actually happens in practice','This is only a concern for trigonometric functions'], correct:1, exp:'y=−x³ has y\'=−3x², which is zero at x=0, yet the function keeps decreasing right through that point rather than turning around — x=0 is a point of inflection, not a max or min. This shows f\'(c)=0 is a necessary clue but not, by itself, sufficient proof of an extremum.'},
{q:'Can a function have a genuine local minimum at a point where its derivative does not exist?', options:['No, this is impossible by definition','Yes — y=|x| has an obvious (global) minimum at x=0, even though |x| is not differentiable there due to the sharp corner','Yes, but only for exponential functions','No, a minimum always requires f\'(c)=0 to exist'], correct:1, exp:'y=|x| is the standard counterexample: its lowest point on the entire graph is clearly at x=0, yet the derivative fails to exist there (the left-hand and right-hand slopes disagree, as covered earlier in this unit). This shows that f\'(c)=0 is a clue specifically for smooth (differentiable) extrema — not every extremum needs to satisfy it, if the derivative simply is not defined there.'},
{q:'According to the Second Derivative Test, if f\'(c)=0 and f\'\'(c)>0, what can be concluded about the point c?', options:['c is a local maximum','c is a local minimum','c is a point of inflection','No conclusion can be drawn'], correct:1, exp:'A positive second derivative at a critical point means the function is curving upward (concave up) right around that point — like the bottom of a bowl — which is exactly the shape of a local minimum.'},
{q:'According to the Second Derivative Test, if f\'(c)=0 and f\'\'(c)<0, what can be concluded about the point c?', options:['c is a local minimum','c is a local maximum','c is a point of inflection','No conclusion can be drawn'], correct:1, exp:'A negative second derivative at a critical point means the function is curving downward (concave down) right around that point — like the top of a dome — which is exactly the shape of a local maximum.'},
{q:'What should be done if the Second Derivative Test gives f\'\'(c)=0 at a critical point?', options:['Automatically conclude c is a point of inflection','The test is inconclusive; fall back on checking whether f\'(x) actually changes sign as x crosses c (positive-to-negative signals a max, negative-to-positive signals a min, and no change signals an inflection point)','Automatically conclude c is a local minimum','Automatically conclude c is a local maximum'], correct:1, exp:'f\'\'(c)=0 simply means the second derivative test cannot decide the matter one way or the other — it is not itself evidence of an inflection point. The reliable fallback is the first-derivative sign-change test: examine whether f\'(x) actually flips sign as x passes through c, which directly reveals whether the function was truly turning around (a max or min) or merely flattening momentarily (an inflection point).'},
{q:'Find the critical points of f(x)=x³−12x²+36x+5.', options:['x=2 and x=6','x=3 and x=4','x=0 and x=12','x=-2 and x=-6'], correct:0, exp:'f\'(x)=3x²−24x+36=3(x²−8x+12)=3(x−2)(x−6). Setting this equal to zero gives x=2 and x=6 as the two critical points.'},
{q:'For f(x)=x³−12x²+36x+5, use the second derivative test to classify x=2 and x=6.', options:['x=2 is a local max, x=6 is a local min','x=2 is a local min, x=6 is a local max','Both are local maxima','Both are points of inflection'], correct:0, exp:'f\'\'(x)=6x−24. At x=2: f\'\'(2)=12−24=−12<0, so x=2 is a local maximum. At x=6: f\'\'(6)=36−24=12>0, so x=6 is a local minimum.'},
{q:'For f(x)=x³−12x²+36x+5, find the local maximum value (the value of f at x=2).', options:['37','5','8','29'], correct:0, exp:'Substituting x=2 into the original function: f(2)=(2)³−12(2)²+36(2)+5 = 8−48+72+5 = 37, the local maximum value confirmed by the second derivative test in the previous question.'},
{q:'For the quartic f(x)=x⁴/4−x³/3−3x²+5, find all the critical points.', options:['x=-2, 0, 3','x=-3, 0, 2','x=-2, 1, 3','x=0, 3, 6'], correct:0, exp:'Differentiating gives f\'(x)=x³−x²−6x, which factors as x(x²−x−6)=x(x−3)(x+2). Setting each factor to zero gives the three critical points x=−2, 0, and 3, ready for classification with the second derivative test.'},
{q:'For the quartic f(x)=x⁴/4−x³/3−3x²+5, classify the critical point x=0 using the second derivative test.', options:['Local minimum, since f\'\'(0)>0','Local maximum, since f\'\'(0)=−6<0','Point of inflection, since f\'\'(0)=0','Cannot be classified'], correct:1, exp:'The second derivative is f\'\'(x)=3x²−2x−6. Evaluating at x=0: f\'\'(0)=0−0−6=−6, which is negative, so by the second derivative test x=0 is a local maximum, with function value f(0)=5.'},
{q:'A pharmaceutical researcher models a drug\'s therapeutic effect as a function of dosage, E(d), and wants to find the dosage that maximizes therapeutic effect. Using the concepts from this section, what is the researcher\'s first mathematical step, and what must still be checked afterward?', options:['Solve E\'(d)=0 to find candidate dosages, then use the second derivative test (or a sign-change check) to confirm which candidate is actually a maximum rather than a minimum or an inflection point','Simply pick the largest dosage available, since more drug always means more effect','Solve E(d)=0 directly, since that gives the maximum','No further steps are needed once E\'(d)=0 is solved'], correct:0, exp:'This is a direct real-world application of the whole optimization procedure in this section: first find candidate critical dosages by solving E\'(d)=0 (necessary condition for an extremum), then apply the second derivative test — or the first-derivative sign-change fallback — to confirm which of those candidates is genuinely a maximum (E\'\'(d)<0) rather than a minimum, a saddle-like inflection point, or an artifact of the necessary-but-not-sufficient E\'(d)=0 condition.'},
{q:'An economist modeling a company\'s profit as a function of production level finds two critical points where the profit function\'s derivative equals zero. At the first, the second derivative is positive; at the second, it is negative. What does this tell the economist about production strategy?', options:['Both critical points represent equally good production levels','The first critical point (positive second derivative) is a local minimum of profit — a level to avoid — while the second (negative second derivative) is a local maximum of profit, the more promising candidate for the actual optimal production level','Neither critical point has any economic meaning','The economist should ignore both points and pick production level zero'], correct:1, exp:'This is a direct economic application of the Second Derivative Test: a positive second derivative at a critical point signals a local minimum (a production level where profit is locally worst, not best), while a negative second derivative signals a local maximum (a production level where profit is locally best) — exactly the classification the test is designed to provide, here applied to guide real production-level decision-making.'}
]},
{ id:'t34', unit:'Unit 13 · Indefinite Integration', title:'13.2–13.3 Integration as the Reverse of Differentiation', notes: `
<p>Every derivative rule from the previous unit can be run backward. If you know that differentiating F(x) gives f(x), then f(x)'s <strong>integral</strong> — its antiderivative — is F(x). This unit is entirely about getting good at running that process in reverse.</p>
<div class="formula-box">If d/dx[F(x)] = f(x), then ∫f(x)dx = F(x) + c</div>
<p>The little "+c" is not optional decoration — it is essential. Since the derivative of any constant is zero, F(x)+5, F(x)−12, and F(x)+1000000 all differentiate right back to the exact same f(x). Without more information pinning down one specific antiderivative, the honest answer to "what is the integral of f(x)" is the whole family F(x)+c, where c can be any real number — hence the name <strong>indefinite</strong> integral, and c is called the <strong>constant of integration</strong>.</p>
<p>In the notation ∫f(x)dx, f(x) is called the <strong>integrand</strong>, and dx signals which variable the integration is being carried out with respect to.</p>
<h4>The basic table (learn these cold)</h4>
<div class="formula-box">
∫k dx = kx + c&nbsp;&nbsp;(k a constant)<br>
∫xⁿ dx = xⁿ⁺¹/(n+1) + c,&nbsp;&nbsp;n ≠ −1<br>
∫(1/x) dx = ln|x| + c<br>
∫(ax+b)ⁿ dx = (ax+b)ⁿ⁺¹ / [a(n+1)] + c,&nbsp;&nbsp;n ≠ −1<br>
∫[1/(ax+b)] dx = (1/a)ln|ax+b| + c<br>
∫aᵐˣ dx = aᵐˣ / (m·ln a) + c&nbsp;&nbsp;&nbsp;&nbsp;∫eᵃˣ dx = eᵃˣ/a + c&nbsp;&nbsp;&nbsp;&nbsp;∫eᵃˣ⁺ᵇ dx = eᵃˣ⁺ᵇ/a + c
</div>
<p>Every one of these is simply the corresponding derivative rule from the previous unit, read from right to left. The power rule for derivatives, d/dx(xⁿ)=nxⁿ⁻¹, becomes the power rule for integrals by shifting the exponent up by one and dividing by that new exponent — exactly undoing what differentiation did.</p>
<h4>Linearity</h4>
<p>Integration distributes over sums and constant multiples exactly the way differentiation does:</p>
<div class="formula-box">∫a·f(x) dx = a∫f(x) dx&nbsp;&nbsp;&nbsp;&nbsp;∫[a·f(x) ± b·g(x)] dx = a∫f(x)dx ± b∫g(x)dx</div>
<p>This is what makes integrating a whole polynomial, or a sum of several different types of terms, no harder than integrating each piece separately and adding up the results (with only one "+c" needed at the very end, since a sum of several arbitrary constants is still just some arbitrary constant).</p>
<div class="worked"><div class="label">Worked examples</div>
∫x⁶ dx = x⁷/7 + c.<br>
∫(1/x⁴) dx = ∫x⁻⁴dx = x⁻³/(−3) + c = −1/(3x³) + c.<br>
∫(5x+3)⁴ dx = (5x+3)⁵/[5(5)] + c = (5x+3)⁵/25 + c.<br>
∫[1/(4x+7)] dx = (1/4)ln|4x+7| + c.<br>
∫e^(6x) dx = e^(6x)/6 + c.<br>
∫3^(2x) dx = 3^(2x)/(2 ln 3) + c.<br>
∫(x³+2x+7) dx = x⁴/4 + x² + 7x + c, splitting the sum into three separate power-rule applications.
</div>
`,
questions:[
{q:'What does it mean for F(x) to be an "antiderivative" (indefinite integral) of f(x)?', options:['F(x) and f(x) are always equal for every x','d/dx[F(x)] = f(x) — differentiating F(x) gets you back to f(x)','F(x) is the largest value f(x) ever takes','F(x) is always a constant'], correct:1, exp:'Integration is defined as reversing differentiation: F(x) is an antiderivative of f(x) precisely when differentiating F(x) returns f(x). Every integration technique in this unit is, at bottom, a way of finding such an F given f.'},
{q:'Why must every indefinite integral include an arbitrary constant "+c"?', options:['It is purely a stylistic convention with no mathematical necessity','Because the derivative of any constant is zero, so F(x)+c differentiates back to f(x) for every possible value of c — without more information, there is no way to single out just one specific antiderivative','Because "c" stands for a specific numerical value that must always be calculated','Because integration is only defined up to a factor of 2'], correct:1, exp:'Since adding any constant to F(x) does not change its derivative (constants vanish under differentiation), F(x)+c is just as valid an antiderivative of f(x) as F(x) itself, for any value of c. The "+c" acknowledges this entire family of equally valid answers rather than arbitrarily picking just one.'},
{q:'In the expression ∫f(x)dx, what is f(x) called?', options:['The derivative','The integrand','The constant of integration','The differential'], correct:1, exp:'f(x), the function being integrated, is called the integrand. The dx alongside it signals which variable the integration is being carried out with respect to — important once functions of more than one variable eventually come into play.'},
{q:'What is ∫xⁿ dx (for n≠−1)?', options:['nxⁿ⁻¹ + c','xⁿ⁺¹/(n+1) + c','xⁿ⁺¹ + c','xⁿ/(n+1) + c'], correct:1, exp:'The power rule for integration, ∫xⁿdx = xⁿ⁺¹/(n+1)+c, is the exact reverse of the power rule for differentiation. Bumping the exponent up by one and then dividing by that same new exponent undoes the "multiply by the exponent, then reduce it by one" action of differentiation.'},
{q:'Why does the power rule for integration specifically exclude the case n=−1?', options:['n=−1 has no special significance','Because n=−1 would require dividing by n+1=0, which is undefined; that specific case (∫x⁻¹dx = ∫(1/x)dx) is handled separately, giving ln|x|+c instead','Because negative exponents cannot be integrated at all','Because n=−1 always gives an answer of zero'], correct:1, exp:'Plugging n=−1 into (n+1) in the denominator of the power rule would mean dividing by zero, which is undefined — so this one case has to be carved out and handled with its own separate formula, ∫(1/x)dx=ln|x|+c, rather than being folded into the general power rule.'},
{q:'Evaluate ∫x⁶ dx.', options:['6x⁵ + c','x⁷/7 + c','x⁶/6 + c','x⁷ + c'], correct:1, exp:'Applying the power rule directly: bump the exponent up by one and divide by that new exponent, x^(6+1)/(6+1) = x⁷/7 + c.'},
{q:'Evaluate ∫(1/x⁴) dx.', options:['-1/(3x³) + c','1/(3x³) + c','-1/(4x³) + c','ln|x⁴| + c'], correct:0, exp:'Rewrite as ∫x⁻⁴dx = x⁻³/(−3) + c = −1/(3x³) + c. Since the exponent here is −4, not −1, the ordinary power rule applies (not the special ln|x| case).'},
{q:'Evaluate ∫(5x+3)⁴ dx.', options:['(5x+3)⁵/25 + c','(5x+3)⁵/5 + c','4(5x+3)³ + c','(5x+3)⁵ + c'], correct:0, exp:'Using the standard formula ∫(ax+b)ⁿdx = (ax+b)ⁿ⁺¹/[a(n+1)]+c with a=5 and n=4: (5x+3)⁵/[5(5)] = (5x+3)⁵/25 + c, the same power-rule pattern as before but with an extra division by the inner coefficient a.'},
{q:'Evaluate ∫[1/(4x+7)] dx.', options:['(1/4)ln|4x+7| + c','ln|4x+7| + c','4ln|4x+7| + c','(1/7)ln|4x+7| + c'], correct:0, exp:'Using the standard formula ∫[1/(ax+b)]dx = (1/a)ln|ax+b|+c with a=4, the coefficient a=4 simply divides the whole result: (1/4)ln|4x+7| + c.'},
{q:'Evaluate ∫e^(6x) dx.', options:['e^(6x) + c','e^(6x)/6 + c','6e^(6x) + c','e^(6x)/36 + c'], correct:1, exp:'Using the standard formula ∫e^(ax)dx=e^(ax)/a+c with a=6, the exponential reproduces itself and picks up a division by the coefficient a: e^(6x)/6 + c.'},
{q:'Evaluate ∫3^(2x) dx.', options:['3^(2x)/(2 ln 3) + c','3^(2x)·ln3 + c','3^(2x)/ln3 + c','2·3^(2x)/ln3 + c'], correct:0, exp:'Using the standard formula ∫aᵐˣdx=aᵐˣ/(m·ln a)+c with base a=3 and exponent coefficient m=2, the result picks up both the ln of the base and a division by m: 3^(2x)/(2 ln3) + c.'},
{q:'Evaluate ∫(x³+2x+7) dx using linearity.', options:['x⁴/4 + x² + 7x + c','3x² + 2 + c','x⁴/4 + x² + 7 + c','x⁴ + x² + 7x + c'], correct:0, exp:'Integrate each term separately: ∫x³dx=x⁴/4, ∫2x dx=x², ∫7dx=7x. Adding these with a single constant of integration: x⁴/4 + x² + 7x + c.'},
{q:'In pharmacokinetics, the total drug exposure over time — a measurement called AUC (Area Under the Curve) — is computed by integrating the drug concentration function C(t) over the treatment period: AUC = ∫C(t)dt. Which core idea from this section explains why AUC is meaningfully computed this way rather than, say, just reading the peak concentration value?', options:['Integration accumulates the total effect of a continuously varying quantity over an interval, which is exactly what "total drug exposure" means — summing up concentration contributions across every instant of time, not just capturing a single snapshot value','Integration and differentiation are unrelated to pharmacokinetics','AUC is actually a derivative, not an integral, despite the naming convention','Peak concentration and AUC always give identical clinical information'], correct:0, exp:'A single peak concentration value tells you the highest point reached, but says nothing about how long the drug stayed at effective levels or how the concentration evolved throughout treatment. Integration, unlike a single snapshot, accumulates the entire concentration profile over time into one meaningful total — exactly matching the antiderivative/accumulation idea introduced in this section, applied to a literal, industry-standard pharmacological measurement.'},
{q:'A fitness tracker records instantaneous calorie-burn rate throughout a workout and computes total calories burned by integrating that rate function over the workout\'s duration. Why is integration (rather than, say, just multiplying the final rate by the total time) the mathematically correct approach here?', options:['Because the burn rate typically varies continuously throughout the workout, and integration is exactly the tool for accumulating a continuously changing rate into a total amount — multiplying by a single rate value would only be correct if the rate never changed at all','Because integration always gives a larger number than simple multiplication','Because calorie-burn rate cannot actually be modeled as a mathematical function','Because multiplication is never valid for computing totals from rates'], correct:0, exp:'If burn rate were perfectly constant, multiplying rate by time would work fine — but real burn rate rises and falls throughout a workout, exactly the kind of continuously varying quantity integration is built to accumulate correctly. This is a direct instance of the "integration reverses differentiation, and accumulates a changing rate into a total" idea developed in this section, just as relevant to a fitness tracker\'s app logic as to a math classroom.'}
]},

{ id:'t35', unit:'Unit 13 · Indefinite Integration', title:'13.4 Integration by Substitution', notes: `
<p>Plenty of integrals do not match the basic table directly, but become recognizable once you swap out a piece of the expression for a new variable. That swap is called <strong>substitution</strong>, and it is the single most widely applicable integration technique in this unit.</p>
<h4>The pattern to watch for</h4>
<p>Substitution is the right move whenever an integral has the shape [f(x)]ⁿ·f'(x), or f'(x)/[f(x)]ⁿ — that is, some function f(x) raised to a power, multiplied or divided by exactly the derivative of that same inner function.</p>
<h4>The five-step procedure</h4>
<div class="formula-box">
Step I: Substitute f(x)=t<br>
Step II: Differentiate both sides of that substitution to relate dt and dx<br>
Step III: Rewrite the entire integral purely in terms of t<br>
Step IV: Integrate using a standard formula from the previous section, now that everything is in terms of t<br>
Step V: Replace t with f(x) again, converting the answer back into terms of the original variable x
</div>
<p>Step II is where the real payoff of a good substitution shows up: if you have chosen f(x) well, differentiating f(x)=t produces exactly (or up to a constant multiple of) the other factor sitting in the original integral, letting that piece disappear entirely from the x-side and reappear as a plain dt.</p>
<div class="worked"><div class="label">Worked example — power-of-a-function pattern</div>∫x⁵/(x⁶+2) dx. Notice the denominator's derivative, 6x⁵, is (up to a constant) exactly the numerator. Substitute x⁶+2=t, so 6x⁵dx=dt, giving x⁵dx=dt/6. The integral becomes ∫(1/t)(dt/6) = (1/6)∫(1/t)dt = (1/6)ln|t| + c. Replacing t: (1/6)ln|x⁶+2| + c (and since x⁶+2 is always positive, the absolute value bars can be dropped here).</div>
<div class="worked"><div class="label">Worked example — the numerator is exactly the derivative of the denominator</div>∫(6x+5)/(3x²+5x+1) dx. The denominator's derivative is exactly 6x+5 — precisely the numerator! Substitute 3x²+5x+1=t, so (6x+5)dx=dt. The integral collapses to ∫(1/t)dt = ln|t|+c = ln|3x²+5x+1|+c.</div>
<div class="worked"><div class="label">Worked example — exponential inside a fraction</div>∫eˣ/(eˣ+3) dx. Substitute eˣ+3=t, so eˣdx=dt. The integral becomes ∫(1/t)dt = ln|t|+c = ln(eˣ+3)+c (dropping absolute value bars since eˣ+3 is always positive).</div>
<p>The unifying thread across all three examples: in every case, the "extra piece" multiplying the power of f(x) was recognized as f'(x) in disguise, which is precisely what made the substitution collapse the integral down to the simple ∫(1/t)dt or ∫tⁿdt form.</p>
`,
questions:[
{q:'Integration by substitution is the natural technique to reach for when an integral has which general shape?', options:['A sum of two unrelated polynomial terms','[f(x)]ⁿ · f\'(x), or f\'(x)/[f(x)]ⁿ — a function raised to a power, multiplied or divided by exactly that same function\'s own derivative','A constant multiplied by a variable','Any integral whatsoever, with no particular shape required'], correct:1, exp:'The substitution method specifically targets integrals where one piece of the expression is some function f(x) (possibly raised to a power), and the remaining piece is recognizably f\'(x) — the derivative of that same inner function. Spotting this "derivative of the inside is sitting right there" pattern is the key skill this technique depends on.'},
{q:'What is Step I of the substitution procedure?', options:['Integrate directly using the basic table','Substitute f(x)=t for the inner function being targeted','Replace t with x immediately','Differentiate the entire original integral'], correct:1, exp:'Step I names the inner function you intend to replace: set f(x)=t. Every subsequent step (differentiating, rewriting, integrating, substituting back) builds on this initial choice, so picking the right f(x) is the single most important decision in the whole method.'},
{q:'What is the purpose of Step II (differentiating the substitution)?', options:['To find the final numerical answer','To relate dt to dx, so that the "dx" portion of the original integral can be swapped out for an equivalent "dt" expression','To check whether the integral has a solution at all','To verify that f(x) is a polynomial'], correct:1, exp:'Differentiating f(x)=t produces a relationship like f\'(x)dx=dt, which is exactly what lets you replace the dx (and any accompanying f\'(x) factor) in the original integral with a plain dt — converting the whole integral into a much simpler expression purely in terms of t.'},
{q:'Evaluate ∫x⁵/(x⁶+2) dx using substitution.', options:['(1/6)ln|x⁶+2| + c','ln|x⁶+2| + c','6ln|x⁶+2| + c','(1/6)(x⁶+2) + c'], correct:0, exp:'Substitute x⁶+2=t, so 6x⁵dx=dt, giving x⁵dx=dt/6. The integral becomes (1/6)∫(1/t)dt = (1/6)ln|t|+c, and replacing t gives (1/6)ln|x⁶+2|+c.'},
{q:'Evaluate ∫(6x+5)/(3x²+5x+1) dx using substitution.', options:['ln|3x²+5x+1| + c','(1/6)ln|3x²+5x+1| + c','6ln|3x²+5x+1| + c','ln|6x+5| + c'], correct:0, exp:'The denominator\'s derivative, 6x+5, exactly matches the numerator. Substituting 3x²+5x+1=t gives (6x+5)dx=dt, so the integral becomes ∫(1/t)dt = ln|t|+c = ln|3x²+5x+1|+c.'},
{q:'Evaluate ∫eˣ/(eˣ+3) dx using substitution.', options:['ln(eˣ+3) + c','eˣ + c','ln(eˣ) + c','(eˣ+3)² + c'], correct:0, exp:'Substitute eˣ+3=t, giving eˣdx=dt. The integral becomes ∫(1/t)dt=ln|t|+c=ln(eˣ+3)+c (no absolute value needed since eˣ+3 is always positive).'},
{q:'Evaluate ∫1/[x·ln(x)] dx using substitution.', options:['ln|ln(x)| + c','ln(x) + c','1/ln(x) + c','x·ln(x) + c'], correct:0, exp:'Substitute ln(x)=t, so (1/x)dx=dt. The integral becomes ∫(1/t)dt=ln|t|+c=ln|ln(x)|+c — a "log of a log," which looks unusual at first but follows directly from recognizing that 1/x is exactly the derivative of ln(x).'},
{q:'Evaluate ∫x·√(x²+9) dx using substitution.', options:['(1/3)(x²+9)^(3/2) + c','(1/2)(x²+9)^(3/2) + c','(x²+9)^(3/2) + c','(2/3)(x²+9)^(3/2) + c'], correct:0, exp:'Substitute x²+9=t, so 2x dx=dt, giving x dx=dt/2. The integral becomes (1/2)∫√t dt = (1/2)·(2/3)t^(3/2)+c = (1/3)t^(3/2)+c = (1/3)(x²+9)^(3/2)+c.'},
{q:'Evaluate ∫(2x−3)/(x²−3x+7) dx using substitution.', options:['ln|x²−3x+7| + c','(1/2)ln|x²−3x+7| + c','2ln|x²−3x+7| + c','ln|2x−3| + c'], correct:0, exp:'The denominator\'s derivative is exactly 2x−3, matching the numerator. Substituting x²−3x+7=t gives (2x−3)dx=dt, collapsing the integral to ∫(1/t)dt=ln|t|+c=ln|x²−3x+7|+c.'},
{q:'A statistician transforming a random variable\'s probability density from one variable to another (say, from X to Y=g(X)) uses a "change of variables" formula that closely parallels substitution in integration. What is the core mathematical idea both techniques share?', options:['Neither technique has anything in common with the other','Both rewrite an expression in terms of a new variable by tracking how a small change in the new variable relates to a small change in the original variable (via a derivative factor), so that quantities expressed in the old variable can be correctly re-expressed and integrated in the new one','Change of variables in statistics never involves any derivatives','Substitution in integration is only used for exponential functions, unlike statistical change of variables'], correct:1, exp:'Both techniques hinge on the same underlying idea: relating a small change in one variable to a small change in another via a derivative (dt in terms of dx, in the integration case), so that an expression written in the old variable can be correctly converted into the new variable without losing or distorting any information. Substitution in calculus and change-of-variables in probability are, structurally, the same technique applied to different kinds of problems.'},
{q:'A signal-processing engineer needs to integrate a function of the form f\'(t)/f(t), arising naturally from certain filter response calculations. Without doing any further algebra, what can be said immediately about this integral, based on the substitution pattern in this section?', options:['It cannot be integrated using any method in this unit','It matches the f\'(x)/f(x) substitution pattern directly, so substituting f(t)=u collapses it immediately to ∫(1/u)du = ln|u|+c = ln|f(t)|+c, without needing any further simplification','It always evaluates to zero','It requires partial fractions, not substitution'], correct:1, exp:'f\'(t)/f(t) is precisely the substitution-method signature pattern from this section (a function\'s derivative divided by the function itself). Recognizing this immediately tells you the antiderivative is ln|f(t)|+c, without needing to grind through the five-step procedure explicitly each time — pattern recognition is exactly what makes substitution such a fast, powerful tool once it becomes familiar.'}
]},

{ id:'t36', unit:'Unit 13 · Indefinite Integration', title:'13.5 Integration Using Partial Fractions', notes: `
<p>Some rational expressions — one polynomial divided by another — do not yield to substitution directly, but they can be broken apart into a sum of simpler fractions that each integrate easily using the basic ln|ax+b| formula. This decomposition is called resolving into <strong>partial fractions</strong>.</p>
<h4>Setup</h4>
<p>First, check the degree of the numerator against the denominator: if the numerator's degree is greater than or equal to the denominator's, divide first (ordinary polynomial long division) before proceeding — partial fractions only directly applies once the numerator's degree is strictly smaller.</p>
<h4>Type 1: all denominator factors are linear and distinct</h4>
<p>For a denominator like (x−p)(x−q)(x−r), write the fraction as A/(x−p) + B/(x−q) + C/(x−r), multiply both sides by the full denominator to clear fractions, then find each constant by substituting x equal to the root that makes its own factor vanish (this instantly kills every other term, isolating just one constant at a time).</p>
<div class="worked"><div class="label">Worked example</div>Resolve (3x+2)/[(x−1)(x−4)] into partial fractions. Write (3x+2)/[(x−1)(x−4)] = A/(x−1) + B/(x−4). Multiplying through: 3x+2 = A(x−4) + B(x−1). Setting x=1: 3(1)+2 = A(1−4), so 5=−3A, giving A=−5/3. Setting x=4: 3(4)+2=B(4−1), so 14=3B, giving B=14/3. So the integral becomes ∫[(−5/3)/(x−1) + (14/3)/(x−4)]dx = −(5/3)ln|x−1| + (14/3)ln|x−4| + c.</div>
<h4>Type 2: a linear factor repeats</h4>
<p>When a factor like (x−q) appears raised to a power in the denominator (say, squared or cubed), the decomposition needs one term for every power of that factor, up to and including the full power: B/(x−q) + C/(x−q)² + ... To find these extra constants, after handling the "easy" substitutions, compare coefficients of matching powers of x on both sides of the cleared-denominator equation.</p>
<div class="worked"><div class="label">Worked example</div>Resolve (2x+3)/[(x+1)(x−2)²] into partial fractions: A/(x+1) + B/(x−2) + C/(x−2)². Clearing denominators: 2x+3 = A(x−2)² + B(x+1)(x−2) + C(x+1). Setting x=−1: 2(−1)+3=A(−1−2)², so 1=9A, giving A=1/9. Setting x=2: 2(2)+3=C(2+1), so 7=3C, giving C=7/3. Comparing the coefficient of x² on both sides (which must total zero, since the left side has no x² term): 0=A+B, so B=−A=−1/9. The integral becomes ∫[(1/9)/(x+1) − (1/9)/(x−2) + (7/3)/(x−2)²]dx = (1/9)ln|x+1| − (1/9)ln|x−2| − 7/[3(x−2)] + c.</div>
<p>Types involving quadratic (unfactorable) denominator pieces exist too, but they require integral formulas beyond this unit's scope and are not covered here.</p>
`,
questions:[
{q:'Before applying partial fractions to a rational expression, what must be checked first?', options:['Whether the denominator has any real roots at all','Whether the degree of the numerator is greater than or equal to the degree of the denominator — if so, perform polynomial long division first','Whether the numerator is a perfect square','Whether the expression already matches the substitution pattern'], correct:1, exp:'Partial fractions decomposition, as covered in this section, assumes the numerator\'s degree is strictly less than the denominator\'s. If the numerator\'s degree is equal to or greater than the denominator\'s, ordinary polynomial long division must be done first to reduce the expression to a polynomial plus a proper (smaller-degree-numerator) remainder fraction, before the partial fractions technique can be applied to that remainder.'},
{q:'For a denominator with distinct linear factors, like (x−p)(x−q), what is the fastest way to find the constant A in A/(x−p) + B/(x−q)?', options:['Compare coefficients of every power of x simultaneously','Substitute x=p into the cleared-denominator equation — this makes the term containing B vanish (since it is multiplied by (p−q)... actually by the factor that becomes zero), isolating A directly','Integrate both sides first, then solve for A','Set x=0 and solve a system of equations'], correct:1, exp:'Substituting the root of one factor (here x=p, the root of x−p) into the cleared-denominator equation makes every term EXCEPT the one containing A vanish (since each other term is multiplied by (x−p), which becomes zero at x=p). This isolates A in a single, immediate calculation, without needing to solve any system of equations — the same trick then applies with x=q to isolate B.'},
{q:'Resolve (3x+2)/[(x−1)(x−4)] into partial fractions and find A and B in A/(x−1)+B/(x−4).', options:['A=-5/3, B=14/3','A=5/3, B=-14/3','A=-3/5, B=4/14','A=3, B=2'], correct:0, exp:'Clearing denominators: 3x+2=A(x−4)+B(x−1). Setting x=1: 3(1)+2=A(1−4) → 5=−3A → A=−5/3. Setting x=4: 3(4)+2=B(4−1) → 14=3B → B=14/3.'},
{q:'Using the previous result, evaluate ∫(3x+2)/[(x−1)(x−4)] dx.', options:['-(5/3)ln|x-1| + (14/3)ln|x-4| + c','(5/3)ln|x-1| - (14/3)ln|x-4| + c','-(5/3)ln|x-4| + (14/3)ln|x-1| + c','(3/2)ln|x-1| + (2/1)ln|x-4| + c'], correct:0, exp:'With the constants already found, integrate each partial fraction term separately using ∫[1/(x−a)]dx=ln|x−a|+c: −(5/3)ln|x−1| + (14/3)ln|x−4| + c, combining both logarithm terms into the final answer.'},
{q:'For a denominator with a repeated linear factor, like (x+1)(x−2)², how many separate terms does the partial fraction decomposition need for the repeated factor (x−2)²?', options:['Just one term, B/(x−2)²','Two terms: B/(x−2) and C/(x−2)² — one for each power of the repeated factor, up to and including the full power','Three terms, regardless of the power','No special treatment is needed for repeated factors'], correct:1, exp:'A repeated factor of power 2 requires one term for each power from 1 up to 2: B/(x−2) and C/(x−2)². Missing the lower-power term (just using C/(x−2)² alone) is a common error — the decomposition needs the full "staircase" of powers to correctly capture every possible partial fraction contributing to the original expression.'},
{q:'Resolve (2x+3)/[(x+1)(x−2)²] into partial fractions, finding A in A/(x+1).', options:['A=1/9','A=-1/9','A=2/9','A=1/3'], correct:0, exp:'Clearing denominators: 2x+3=A(x−2)²+B(x+1)(x−2)+C(x+1). Setting x=−1 (which zeros out the B and C terms): 2(−1)+3=A(−1−2)² → 1=9A → A=1/9.'},
{q:'For the same expression (2x+3)/[(x+1)(x−2)²], find C in C/(x−2)².', options:['C=7/3','C=3/7','C=-7/3','C=7'], correct:0, exp:'Setting x=2 in 2x+3=A(x−2)²+B(x+1)(x−2)+C(x+1) (which zeros out the A and B terms): 2(2)+3=C(2+1) → 7=3C → C=7/3.'},
{q:'For the same expression, find B in B/(x−2), using the fact that the coefficient of x² on both sides of the cleared equation must match (and the left side has no x² term).', options:['B=-1/9','B=1/9','B=-7/3','B=1/3'], correct:0, exp:'Comparing coefficients of x² on both sides: the left side (2x+3) has no x² term, so the x² coefficients on the right must sum to zero: 0=A+B. Since A=1/9, this gives B=−1/9.'},
{q:'Assemble the final integral ∫(2x+3)/[(x+1)(x−2)²] dx from the partial fraction constants A=1/9, B=−1/9, C=7/3.', options:['(1/9)ln|x+1| − (1/9)ln|x−2| − 7/[3(x−2)] + c','(1/9)ln|x+1| + (1/9)ln|x−2| + 7/[3(x−2)] + c','(1/9)ln|x+1| − (1/9)ln|x−2| + 7/[3(x−2)²] + c','ln|x+1| − ln|x−2| − ln|x-2|² + c'], correct:0, exp:'Integrating each partial fraction term: (1/9)ln|x+1| from A/(x+1); −(1/9)ln|x−2| from B/(x−2); and −7/[3(x−2)] from C/(x−2)² (using ∫(x−2)⁻²dx=−(x−2)⁻¹=−1/(x−2), scaled by C=7/3). Combining: (1/9)ln|x+1| − (1/9)ln|x−2| − 7/[3(x−2)] + c.'},
{q:'A control systems engineer needs the inverse Laplace transform of a rational transfer function with a denominator that factors into several distinct linear terms — a routine step in analyzing circuit or feedback-system behavior. Which technique from this section is the standard first step in that process?', options:['Substitution, since Laplace transforms never involve rational expressions','Partial fractions decomposition — breaking the rational transfer function into a sum of simple 1/(s−a)-type terms, each of which corresponds to a well-known, table-lookup-friendly inverse transform','Integration by parts exclusively','No technique from calculus is relevant to Laplace transforms'], correct:1, exp:'This is a direct, standard engineering application: rational transfer functions in Laplace-transform-based circuit and control analysis are routinely decomposed into partial fractions first, exactly using the same distinct-linear-factor technique covered here, precisely because each resulting simple fraction then matches a known, easily invertible standard form — turning a complicated rational expression into a sum of pieces that are each trivial to handle individually.'},
{q:'A population biologist modeling logistic growth sometimes needs to integrate an expression like 1/[N(K−N)], where N is population size and K is carrying capacity — a rational expression with two distinct linear factors in N. Which technique from this section directly applies, and roughly what form should the result take?', options:['Substitution only, since partial fractions never apply to biological models','Partial fractions: decompose 1/[N(K−N)] into A/N + B/(K−N), then integrate each piece separately into a sum of logarithm terms — exactly the Type 1 distinct-linear-factors procedure from this section, applied to population variables instead of abstract x\'s','Integration by parts, since N and K−N are being multiplied together','This expression cannot be integrated by any method covered in this unit'], correct:1, exp:'1/[N(K−N)] has exactly the Type 1 structure from this section: two distinct linear factors in the denominator. Decomposing it as A/N+B/(K−N) and finding the constants by the same root-substitution trick used throughout this section converts the integral into a sum of two logarithm terms — this decomposition is, in fact, the standard textbook route to deriving the closed-form solution of the logistic growth equation in population biology and epidemiology.'}
]},

{ id:'t37', unit:'Unit 13 · Indefinite Integration', title:'13.6 Integration by Parts', notes: `
<p>The last major technique in this unit reverses the product rule for differentiation, giving a method for integrating a <em>product</em> of two functions when neither substitution nor partial fractions applies.</p>
<h4>Deriving the formula</h4>
<p>Starting from the product rule, d/dx(uv) = u(dv/dx) + v(du/dx), integrate both sides with respect to x:</p>
<div class="formula-box">uv = ∫u(dv/dx)dx + ∫v(du/dx)dx&nbsp;&nbsp;&nbsp;&nbsp;⟹&nbsp;&nbsp;&nbsp;&nbsp;∫u(dv/dx)dx = uv − ∫v(du/dx)dx</div>
<p>Relabeling using the traditional "first function" (I) and "second function" (II) language, and writing dv=g(x)dx so that v=∫g(x)dx:</p>
<div class="formula-box">∫(I)(II)dx = I·∫(II)dx − ∫[d/dx(I) · ∫(II)dx] dx</div>
<p>In words: integrate the second function, multiply that by the first function, then subtract the integral of (the derivative of the first function, times that same integrated second function).</p>
<h4>Choosing which function is "first"</h4>
<p>This choice genuinely matters — a poor choice can make the resulting integral harder rather than easier, or send you in an endless loop. A practical rule of thumb given in this unit: <strong>if one of the two functions being multiplied is a polynomial, take the polynomial as the first function</strong>, since differentiating a polynomial eventually reduces it to a constant (killing off that piece entirely after enough rounds), while the other factor (exponential, for instance) stays easy to integrate at every step.</p>
<div class="worked"><div class="label">Worked example — the choice matters</div>∫xeˣ dx, taking x as first (I) and eˣ as second (II): I = x∫eˣdx − ∫[1·∫eˣdx]dx = xeˣ − ∫eˣdx = xeˣ − eˣ + c. Taking eˣ as first and x as second instead makes things visibly worse: I = eˣ(x²/2) − ∫eˣ(x²/2)dx — the remaining integral is more complicated than the one you started with, not less. The polynomial-first heuristic exists precisely to avoid this trap.</div>
<div class="worked"><div class="label">Worked example — repeated integration by parts</div>∫x²eˣ dx, taking x² as first and eˣ as second: = x²eˣ − ∫2x·eˣdx = x²eˣ − 2∫xeˣdx. That remaining integral, ∫xeˣdx, is exactly the one solved just above (=xeˣ−eˣ+c), so substituting it in: x²eˣ − 2(xeˣ−eˣ) + c = x²eˣ − 2xeˣ + 2eˣ + c = (x²−2x+2)eˣ + c. Each extra power of x in the polynomial factor costs one more round of integration by parts, but each round also strictly reduces that polynomial's degree by one, guaranteeing the process eventually terminates.</div>
<div class="worked"><div class="label">Worked example — a clever disguise: ∫ln(x)dx</div>ln(x) alone does not look like a product of two functions — but writing it as (ln x)·1 makes integration by parts available, taking ln(x) as first (since it becomes simpler when differentiated: 1/x) and the constant 1 as second (whose integral is just x): I = (ln x)(x) − ∫(1/x)(x)dx = x ln x − ∫1 dx = x ln x − x + c.</div>
`,
questions:[
{q:'The integration by parts formula is derived by reversing which differentiation rule?', options:['The chain rule','The product rule, d/dx(uv)=u(dv/dx)+v(du/dx)','The quotient rule','The power rule'], correct:1, exp:'Integration by parts comes directly from integrating both sides of the product rule. Rearranging the resulting equation isolates ∫u(dv/dx)dx on one side, in terms of uv and the remaining integral ∫v(du/dx)dx — exactly the integration by parts formula.'},
{q:'What is the practical rule of thumb given in this section for choosing which function to treat as "first" in integration by parts?', options:['Always choose the function that appears first alphabetically','If one of the two functions is a polynomial, choose it as the first function, since repeated differentiation of a polynomial eventually reduces it to a constant, while the other factor typically stays easy to integrate at each step','Always choose the exponential function as first, regardless of what it is paired with','The choice of first function never actually matters'], correct:1, exp:'A polynomial differentiated repeatedly loses one degree each time, eventually vanishing to a constant (and then to zero) — which is exactly why treating the polynomial as the "first" function (to be differentiated repeatedly) tends to simplify the integral with each pass, rather than making it progressively worse.'},
{q:'For ∫xeˣ dx, what happens if you choose eˣ as the first function and x as the second, instead of the other way around?', options:['The integral is unaffected either way, giving an identical result immediately','The resulting remaining integral becomes more complicated (involving x²/2 multiplied by eˣ) rather than simpler, illustrating why the choice of first function genuinely matters','The integral becomes undefined','The answer comes out with the wrong sign'], correct:1, exp:'Choosing eˣ as first means integrating x (giving x²/2) rather than differentiating it — this raises the polynomial\'s degree instead of lowering it, making the remaining integral more complicated than the one you started with, not less. This concretely demonstrates why the polynomial-as-first heuristic exists.'},
{q:'Evaluate ∫xeˣ dx using integration by parts (x as first, eˣ as second).', options:['xeˣ − eˣ + c','xeˣ + eˣ + c','x²eˣ/2 + c','eˣ + c'], correct:0, exp:'∫xeˣdx = x∫eˣdx − ∫[1·∫eˣdx]dx = xeˣ − ∫eˣdx = xeˣ − eˣ + c.'},
{q:'Evaluate ∫x²eˣ dx using repeated integration by parts (building on the previous result for ∫xeˣdx).', options:['(x²−2x+2)eˣ + c','x²eˣ − 2xeˣ + c','(x²+2x+2)eˣ + c','x²eˣ/2 − xeˣ + c'], correct:0, exp:'∫x²eˣdx = x²eˣ − ∫2xeˣdx = x²eˣ − 2(xeˣ−eˣ) + c = x²eˣ−2xeˣ+2eˣ+c = (x²−2x+2)eˣ + c, reusing the previously solved ∫xeˣdx=xeˣ−eˣ+c as a building block.'},
{q:'Evaluate ∫ln(x) dx, by writing ln(x) as (ln x)·1 and applying integration by parts.', options:['x ln x − x + c','ln x − x + c','x ln x + c','x/ln x + c'], correct:0, exp:'Taking ln(x) as first (since differentiating it gives the simpler 1/x) and 1 as second (whose integral is x): ∫ln(x)dx = (ln x)(x) − ∫(1/x)(x)dx = x ln x − ∫1 dx = x ln x − x + c.'},
{q:'Evaluate ∫x·ln(x) dx using integration by parts (ln(x) as first, x as second).', options:['(x²/2)ln(x) − x²/4 + c','x²ln(x) − x² + c','(x²/2)ln(x) + c','x ln(x) − x²/2 + c'], correct:0, exp:'Taking ln(x) as first and x as second (whose integral is x²/2): ∫x ln(x)dx = (ln x)(x²/2) − ∫(1/x)(x²/2)dx = (x²/2)ln(x) − (1/2)∫x dx = (x²/2)ln(x) − (1/2)(x²/2) + c = (x²/2)ln(x) − x²/4 + c.'},
{q:'Why does integrating x²eˣ dx require two separate rounds of integration by parts, rather than just one?', options:['Because eˣ is difficult to integrate','Because each single round of integration by parts reduces the polynomial factor\'s degree by only one (from x² to x, in the first round), so a degree-2 polynomial needs two full rounds before it is reduced all the way down to a constant and the process can fully resolve','Integration by parts always requires exactly two rounds, regardless of the polynomial involved','Because x² is not actually a polynomial'], correct:1, exp:'Each application of integration by parts differentiates the polynomial factor once, lowering its degree by exactly one. Starting from x² (degree 2), one round brings it down to x (degree 1, still not a constant), requiring a second round to bring it down to a constant — in general, a degree-n polynomial factor requires n rounds of integration by parts before fully resolving.'},
{q:'In statistics, deriving the mean (expected value) of an exponentially distributed random variable involves evaluating an integral of the form ∫x·λe^(−λx)dx — a product of a polynomial factor (x) and an exponential factor. Which technique from this section is the standard tool for this derivation, and which function should be chosen as "first"?', options:['Substitution, treating λx as the substituted variable','Integration by parts, taking the polynomial factor x as the first function (since differentiating it eventually reduces it to a constant) and the exponential piece as the second function','Partial fractions, since the integrand is a product rather than a rational expression','This integral cannot be evaluated using any technique in this unit'], correct:1, exp:'∫x·λe^(−λx)dx is exactly a polynomial-times-exponential integral, the signature shape for integration by parts, and the polynomial-first heuristic from this section applies directly: take x as the first function (which differentiates down to the constant 1 after one round) and the exponential piece as the second function (which stays easy to integrate at every step). This is, in fact, precisely the standard derivation used in introductory mathematical statistics and reliability engineering to derive that the mean of an exponential distribution equals 1/λ.'},
{q:'An engineer computing the "center of mass" of a beam with a non-uniform density modeled as a polynomial function of position needs to evaluate an integral of the form ∫x·ρ(x)dx, where ρ(x) is itself a polynomial (so the whole integrand is polynomial times polynomial). Why would integration by parts typically NOT be the best choice here, compared to a product of a polynomial and an exponential?', options:['Integration by parts never applies to any polynomial integrand','A product of two polynomials can usually be multiplied out directly into a single, ordinary polynomial and integrated term by term using the basic power rule from an earlier section — integration by parts is unnecessary extra work when the direct expansion-and-power-rule approach is simpler and just as effective','Polynomials can never be integrated by any method','Integration by parts always gives the wrong answer for polynomial-times-polynomial integrands'], correct:1, exp:'Unlike a polynomial multiplied by an exponential or logarithm (which genuinely resist being combined into a single simple term), two polynomials multiplied together are just... another polynomial, once expanded out. In that case, the far simpler approach is to multiply everything out and integrate term by term using the ordinary power rule from earlier in this unit — reaching for integration by parts here would be needless extra machinery for a problem the basic table already handles directly.'}
]},
{ id:'t38', unit:'Unit 14 · Definite Integration', title:'14.2 Meaning and Geometrical Interpretation', notes: `
<p>Indefinite integration produced a whole family of antiderivatives, F(x)+c. Definite integration asks a more specific question: what is the <em>net accumulated total</em> of f(x) between two particular boundary points, a and b? The answer turns out to be a single, definite number — no arbitrary constant involved at all.</p>
<div class="formula-box">∫[a to b] f(x)dx = [F(x)] from a to b = F(b) − F(a)&nbsp;&nbsp;&nbsp;&nbsp;(the Fundamental Theorem of Integral Calculus)</div>
<p>Here a is called the <strong>lower limit</strong>, b is the <strong>upper limit</strong>, and the interval between them is the <strong>interval of integration</strong>. The notation [F(x)] from a to b (sometimes written with square brackets and the limits as sub/superscripts) is shorthand for "evaluate F at the upper limit, evaluate F at the lower limit, and subtract the second from the first."</p>
<h4>Why the "+c" quietly vanishes</h4>
<p>Suppose you use F(x)+c instead of plain F(x) in the fundamental theorem: [F(x)+c] from a to b = [F(b)+c] − [F(a)+c] = F(b)+c−F(a)−c = F(b)−F(a). The two copies of c — one from each limit — cancel exactly, which is why definite integrals are computed using any convenient antiderivative, without bothering to carry the constant of integration through the calculation at all.</p>
<div class="worked"><div class="label">Worked example</div>∫[2 to 5] (2x+3) dx. An antiderivative of 2x+3 is x²+3x (dropping the +c, since it will cancel anyway). Evaluate at the limits: (5²+3·5) − (2²+3·2) = (25+15) − (4+6) = 40−10 = 30.</div>
<h4>Geometric meaning: signed area</h4>
<p>∫[a to b] f(x)dx represents the area bounded by the curve y=f(x), the x-axis, and the two vertical lines x=a and x=b. Where the curve sits above the x-axis, this area counts as positive; where the curve dips below the x-axis, that portion counts as negative — the definite integral gives the <em>net</em> signed area, not simply the total unsigned area between curve and axis.</p>
<div class="worked"><div class="label">A subtlety worth flagging early</div>Because of this sign convention, a function that dips below the x-axis somewhere within [a,b] can produce a definite integral smaller than you might expect from eyeballing the picture — positive and negative regions partially cancel. Later sections on absolute-value integrands (using property P3 to split the interval at the point where the sign changes) deal with this directly.</p>
`,
questions:[
{q:'What does the Fundamental Theorem of Integral Calculus state for ∫[a to b] f(x)dx?', options:['It equals F(x)+c for any antiderivative F','It equals F(b) − F(a), where F is any antiderivative of f','It equals f(b) − f(a)','It is always equal to zero'], correct:1, exp:'The Fundamental Theorem converts the problem of computing a definite integral into finding any antiderivative F of f, then simply evaluating F at the upper limit and subtracting its value at the lower limit: F(b)−F(a). This is the bridge connecting the indefinite integration techniques of the previous unit to concrete, single-number answers.'},
{q:'Why does the arbitrary constant of integration, c, not need to be included when evaluating a definite integral?', options:['Because c is always exactly zero for definite integrals','Because whichever antiderivative F(x)+c is used, the two copies of c (one from the upper limit, one from the lower limit) subtract away exactly, leaving the same final answer regardless of which value of c was chosen','Because definite integrals do not actually use antiderivatives at all','Because c only matters for indefinite integrals of trigonometric functions'], correct:1, exp:'[F(x)+c] evaluated from a to b gives [F(b)+c] − [F(a)+c] = F(b)−F(a), since the two c terms cancel exactly. This is why, in practice, definite integrals are computed using the simplest available antiderivative, without bothering to write "+c" at all.'},
{q:'In the notation ∫[a to b] f(x)dx, what are a and b called?', options:['The integrand and the differential','The lower limit and the upper limit of integration','The constant of integration','The domain and range of f'], correct:1, exp:'a is the lower limit, b is the upper limit, and the interval between them is called the interval of integration. Together with f(x), these three pieces of information (a, b, and f) are exactly what determine the single definite number the integral evaluates to.'},
{q:'Evaluate ∫[2 to 5] (2x+3) dx.', options:['30','40','10','35'], correct:0, exp:'An antiderivative of 2x+3 is x²+3x. Evaluating: (5²+3·5) − (2²+3·2) = (25+15) − (4+6) = 40−10 = 30.'},
{q:'Evaluate ∫[1 to 4] x³ dx.', options:['255/4','64','63.75, expressed differently','256/4'], correct:0, exp:'An antiderivative of x³ is x⁴/4. Evaluating: (4⁴/4) − (1⁴/4) = (256/4) − (1/4) = 255/4. (Note 255/4 = 63.75, matching option 3\'s decimal value — both describe the identical answer, just in different notation.)'},
{q:'Evaluate ∫[0 to 2] e^(4x) dx.', options:['(e⁸−1)/4','e⁸−1','(e⁸−e⁰)','4(e⁸−1)'], correct:0, exp:'An antiderivative of e^(4x) is e^(4x)/4. Evaluating: [e^(4·2)/4] − [e^(4·0)/4] = e⁸/4 − 1/4 = (e⁸−1)/4.'},
{q:'Evaluate ∫[1 to 3] (1/x) dx.', options:['ln 3','ln 3 − ln 1','Both A and B are correct, since ln 1=0 makes them equal','ln(3/1) − 1'], correct:2, exp:'An antiderivative of 1/x is ln|x|. Evaluating: ln|3| − ln|1| = ln 3 − 0 = ln 3, since ln 1=0. Both option A and option B describe the same correct calculation, just at different stages of simplification.'},
{q:'What is the geometric interpretation of ∫[a to b] f(x)dx?', options:['The slope of the tangent line to f at x=a','The signed (net) area between the curve y=f(x) and the x-axis, from x=a to x=b — regions above the axis count positively and regions below count negatively','The maximum value of f(x) on the interval [a,b]','The total unsigned area, with no regard to sign, between the curve and the x-axis'], correct:1, exp:'The definite integral gives the NET signed area — portions of the curve above the x-axis contribute positively, and portions below contribute negatively, and these can partially cancel. This is a subtly different (and more useful, for many applications) quantity than the total unsigned area you would get by taking the absolute value of the function everywhere first.'},
{q:'Why might a definite integral evaluate to a smaller number than you would expect just by looking at "how much area" seems to be between the curve and the x-axis?', options:['Definite integrals are always computed incorrectly by hand','Because portions of the curve below the x-axis contribute negatively to the total, partially or fully canceling out the positive contributions from portions above the axis — the integral reports a net signed total, not a total unsigned area','Because definite integrals round down automatically','Because the fundamental theorem only works for positive functions'], correct:1, exp:'If a curve dips below the x-axis somewhere in [a,b], that region subtracts from the total rather than adding to it, since area below the axis is counted as negative in this signed-area convention. The overall integral can therefore come out smaller than the total unsigned area you would estimate by eye, or even come out negative if the below-axis area dominates.'},
{q:'A pharmacology researcher wants the total amount of drug absorbed into the bloodstream between hour 2 and hour 6 after dosing, given a known absorption-rate function r(t). Which calculation directly gives this?', options:['r(6) − r(2)','∫[2 to 6] r(t) dt, using the Fundamental Theorem of Integral Calculus to accumulate the absorption rate over that specific time window','r(6) + r(2)','The average of r(2) and r(6)'], correct:1, exp:'Total accumulated amount from a rate function over a specific window is exactly what a definite integral computes: ∫[2 to 6] r(t)dt accumulates the absorption rate across every instant from hour 2 to hour 6, using the Fundamental Theorem to reduce the calculation to R(6)−R(2) for any antiderivative R of r. Simply subtracting r(6)−r(2) would instead give the change in the rate itself, not the accumulated total — a common point of confusion.'},
{q:'In probability theory, if f(x) is the probability density function of a continuous random variable X, how is P(a<X<b) (the probability X falls between a and b) computed?', options:['f(b) − f(a)','∫[a to b] f(x) dx — exactly a definite integral of the density function over that interval, using the Fundamental Theorem of Integral Calculus','f(b) + f(a)','The maximum value of f(x) on [a,b]'], correct:1, exp:'This is precisely the motivating example given at the start of this unit: since a continuous random variable takes any single exact value with probability zero, probabilities over a range are computed by literally integrating the density function across that range, using the same Fundamental Theorem covered in this section. This single idea underlies essentially all of continuous probability theory and statistics.'},
{q:'In evaluating a machine learning classifier\'s performance, the AUC-ROC (Area Under the ROC Curve) metric is computed as the definite integral of the ROC curve over its domain. Why does a definite integral, rather than the curve\'s value at a single operating point, better summarize overall classifier quality?', options:['A single point on the ROC curve reflects performance at only one specific decision threshold, while the definite integral accumulates performance across every possible threshold into one summary number, exactly the "net accumulated total over an interval" idea from this section','AUC-ROC has nothing to do with definite integrals despite the shared terminology','A single point always gives more complete information than the full integral','Definite integrals cannot be applied to curves derived from classifier performance data'], correct:0, exp:'A classifier\'s performance varies depending on which decision threshold is used, and a single ROC point only reflects one particular threshold choice. Integrating the ROC curve across its entire domain — exactly the accumulate-across-an-interval idea introduced in this section — produces one number summarizing performance across every possible threshold simultaneously, which is precisely why AUC-ROC is such a widely used classifier evaluation metric.'},
{q:'Evaluate ∫[0 to 3] (4x²+2) dx.', options:['42','36','48','40'], correct:0, exp:'An antiderivative of 4x²+2 is (4/3)x³+2x, following the ordinary power rule term by term. Evaluating at the limits: [(4/3)(27)+2(3)] − [0] = 36+6 = 42.'},
{q:'Which statement correctly distinguishes indefinite and definite integrals?', options:['They are exactly the same thing with no meaningful difference','An indefinite integral is a family of functions F(x)+c; a definite integral is a single specific number, F(b)−F(a), obtained by evaluating an antiderivative at two given limits and subtracting','A definite integral always produces a larger value than an indefinite integral','Indefinite integrals only apply to polynomials, while definite integrals apply to all functions'], correct:1, exp:'This distinction is the entire premise of this unit: indefinite integration hands you back an entire family of functions differing only by a constant, while definite integration collapses that family down to one specific numerical answer, by evaluating at two boundary points (the limits of integration) and subtracting.'}
]},

{ id:'t39', unit:'Unit 14 · Definite Integration', title:'14.3 Evaluating Definite Integrals, Including by Substitution', notes: `
<p>Everything from the indefinite-integration unit — the basic table, substitution, partial fractions, integration by parts — carries straight over into definite integration. Find an antiderivative using whichever technique applies, then evaluate it at the two limits and subtract.</p>
<h4>The one genuinely new wrinkle: substitution changes the limits too</h4>
<p>When substitution is used inside a definite integral, there is a shortcut that avoids ever converting the antiderivative back into the original variable: change the limits of integration to match the new variable at the moment you substitute, and then never look back at x again — evaluate the final antiderivative directly using the new, converted limits.</p>
<div class="worked"><div class="label">Worked example</div>∫[1 to 4] x·√(x²+9) dx. Substitute x²+9=t, so 2x dx=dt, giving x dx=dt/2. Convert the limits immediately: when x=1, t=1²+9=10; when x=4, t=4²+9=25. The integral becomes (1/2)∫[10 to 25] √t dt = (1/2)·(2/3)[t^(3/2)] from 10 to 25 = (1/3)[25^(3/2) − 10^(3/2)] = (1/3)(125 − 10√10). There was no need to ever substitute t back in terms of x — the new limits (10 and 25) were used directly with the t-antiderivative.</div>
<p>This "convert the limits and stay in the new variable" approach is purely a convenience, not a mathematical necessity — you could equally well finish the indefinite integral in terms of x first (substituting t back), and then plug the original x-limits in afterward. But converting the limits upfront usually saves a full round of back-substitution algebra.</p>
<div class="worked"><div class="label">A logarithmic example</div>∫[0 to 1] (2x+3)/(x²+3x+5) dx. The numerator is exactly the derivative of the denominator, so substitute x²+3x+5=t, giving (2x+3)dx=dt. Converting limits: when x=0, t=0+0+5=5; when x=1, t=1+3+5=9. The integral becomes ∫[5 to 9](1/t)dt = [ln t] from 5 to 9 = ln 9 − ln 5 = ln(9/5).</div>
<h4>Absolute value integrands need a split first</h4>
<p>An integrand like |x−a| is not a single smooth formula — it equals −(x−a) on one side of x=a and (x−a) on the other. Before a definite integral involving |x−a| can be evaluated directly, the interval of integration must first be split at x=a (using the interval-splitting property covered in the next section), handling each piece with its own, sign-corrected formula.</p>
`,
questions:[
{q:'When a substitution is used inside a definite integral, what shortcut avoids having to convert the final antiderivative back into the original variable?', options:['Substitution cannot be used in definite integrals at all','Convert the limits of integration to match the new variable at the moment of substitution, then evaluate the final antiderivative directly using those new limits, without ever substituting back to the original variable','Always leave the answer in terms of the substituted variable, ignoring the original limits entirely','Skip evaluating the limits altogether'], correct:1, exp:'Because a definite integral produces a specific number rather than a general formula, there is no need to express the antiderivative back in terms of the original variable — as long as the limits of integration are converted to match the new variable at substitution time, the final evaluation can be done entirely in the new variable.'},
{q:'For the substitution x²+9=t applied to ∫[1 to 4] x√(x²+9) dx, what do the limits x=1 and x=4 convert to in terms of t?', options:['t=10 and t=25','t=1 and t=4','t=9 and t=25','t=1 and t=16'], correct:0, exp:'Substituting x=1: t=1²+9=10. Substituting x=4: t=4²+9=25. These converted limits (10 and 25) are then used directly with the t-based antiderivative, with no need to convert back to x afterward.'},
{q:'Evaluate ∫[1 to 4] x√(x²+9) dx using substitution with converted limits.', options:['(1/3)(125 − 10√10)','(1/3)(25^(3/2) − 1)','(2/3)(125 − 10√10)','125/3'], correct:0, exp:'With x²+9=t, x dx=dt/2, and converted limits t=10 (at x=1) and t=25 (at x=4): (1/2)∫[10 to 25]√t dt = (1/2)(2/3)[t^(3/2)] from 10 to 25 = (1/3)[25^(3/2)−10^(3/2)] = (1/3)(125−10√10).'},
{q:'Evaluate ∫[0 to 1] (2x+3)/(x²+3x+5) dx using substitution.', options:['ln(9/5)','ln(9) − ln(1)','ln(4)','9/5'], correct:0, exp:'The numerator is exactly the derivative of the denominator, so substituting x²+3x+5=t gives (2x+3)dx=dt. Converting limits: t=5 at x=0, and t=9 at x=1. The integral becomes ∫[5 to 9](1/t)dt = ln9−ln5 = ln(9/5).'},
{q:'Why can an integral involving |x−a| not be evaluated directly using a single antiderivative formula across an interval that includes x=a?', options:['Because |x−a| is not actually a function','Because |x−a| equals −(x−a) on one side of a and (x−a) on the other side — two different formulas apply depending on which side of a you are on, so the interval must be split at x=a before a single antiderivative formula can be applied to each piece','Because absolute value functions cannot be integrated by any method','Because a must always equal zero for absolute value integrals'], correct:1, exp:'|x−a| is defined piecewise: it equals a different algebraic expression depending on whether x is less than or greater than a. A single antiderivative formula only applies within one of those pieces at a time, so the interval of integration must first be broken into two pieces at the point x=a before either piece can be integrated directly.'},
{q:'Evaluate ∫[2 to 6] e^(3x) dx.', options:['(e^18 − e^6)/3','e^18 − e^6','(e^18 − e^6)','3(e^18−e^6)'], correct:0, exp:'An antiderivative of e^(3x) is e^(3x)/3, using the standard exponential integration formula. Evaluating at the two limits and subtracting: [e^(18)/3] − [e^(6)/3] = (e^18−e^6)/3.'},
{q:'Evaluate ∫[1 to e] (1/x) dx.', options:['1','e−1','ln(e)−ln(1)... which simplifies to the same answer as option A','Both A and C describe the identical correct answer'], correct:3, exp:'An antiderivative of 1/x is ln|x|. Evaluating: ln(e) − ln(1) = 1 − 0 = 1. Options A and C both describe this same calculation at different levels of simplification — the final numeric answer in both cases is exactly 1.'},
{q:'Evaluate ∫[0 to 2] x(x²+1)³ dx using substitution.', options:['78','624','15.5','62'], correct:0, exp:'Substitute x²+1=t, so x dx=dt/2. Converting limits: t=1 at x=0, t=5 at x=2. The integral becomes (1/2)∫[1 to 5] t³dt = (1/2)[t⁴/4] from 1 to 5 = (1/8)(5⁴−1⁴) = (1/8)(625−1) = 624/8 = 78.'},
{q:'A biostatistician computing a Bayesian posterior probability needs to evaluate ∫[a to b] p(θ)dθ, where p(θ) involves a substitution that converts θ into a standardized variable z. What is the correct way to handle the integration limits a and b during this substitution?', options:['Leave a and b unchanged, since limits never need to be converted','Convert a and b into their corresponding z-values at the moment of substitution, exactly as covered in this section, so the final evaluation can be done entirely using the z-based antiderivative and the z-based limits','Discard the limits entirely and treat the integral as indefinite','Average a and b together into a single new limit'], correct:1, exp:'This is a direct, real statistical application of the limit-conversion shortcut from this section: whenever a substitution changes the variable of integration (here, θ to a standardized z), the limits must be converted to match, so the entire remaining calculation — antiderivative and evaluation — can be carried out purely in the new variable, without ever needing to convert back.'}
]},

{ id:'t40', unit:'Unit 14 · Definite Integration', title:'14.4 Elementary Properties of Definite Integrals', notes: `
<p>Seven properties, each capturing a structural fact about definite integrals that can save enormous amounts of calculation once recognized. All seven follow directly from the Fundamental Theorem, but they are worth knowing as standalone tools in their own right.</p>
<div class="formula-box">
P1: ∫[a,b] f(x)dx = ∫[a,b] f(t)dt&nbsp;&nbsp;(the variable of integration is just a dummy label — renaming it changes nothing)<br>
P2: ∫[a,b] f(x)dx = −∫[b,a] f(x)dx&nbsp;&nbsp;(swapping the limits flips the sign)<br>
P3: ∫[a,b] f(x)dx = ∫[a,c] f(x)dx + ∫[c,b] f(x)dx,&nbsp;&nbsp;for a&lt;c&lt;b&nbsp;&nbsp;(splitting the interval at any interior point)
</div>
<p>P1 is almost too obvious to need stating: whether you call the integration variable x or t, the resulting number is identical, since the variable name never appears in the final answer once the limits are substituted in. P2 says reversing the direction of travel (from b down to a, instead of a up to b) negates the total. P3 lets you break one integral into several smaller pieces over adjoining sub-intervals — indispensable whenever the integrand's formula changes partway through the interval (piecewise functions, or |x−a|-type expressions).</p>
<div class="formula-box">
P4: ∫[−a,a] f(x)dx = 2∫[0,a]f(x)dx&nbsp;&nbsp;if f is even (f(−x)=f(x))&nbsp;&nbsp;&nbsp;&nbsp;∫[−a,a] f(x)dx = 0&nbsp;&nbsp;if f is odd (f(−x)=−f(x))
</div>
<p>P4 is one of the most powerful shortcuts in the whole unit: for an odd function integrated over an interval symmetric about zero, the answer is <em>always</em> zero — no computation needed at all, once you have confirmed f(−x)=−f(x). For an even function over the same kind of interval, you only need to compute the integral over half the interval (0 to a) and double it.</p>
<div class="formula-box">
P5: ∫[a,b] f(x)dx = ∫[a,b] f(a+b−x)dx&nbsp;&nbsp;&nbsp;&nbsp;(special case: ∫[0,a]f(x)dx = ∫[0,a]f(a−x)dx)<br>
P6: ∫[0,2a] f(x)dx = ∫[0,a]f(x)dx + ∫[0,a]f(2a−x)dx<br>
P7: ∫[0,2a] f(x)dx = 2∫[0,a]f(x)dx&nbsp;&nbsp;if f(2a−x)=f(x)&nbsp;&nbsp;&nbsp;&nbsp;∫[0,2a] f(x)dx = 0&nbsp;&nbsp;if f(2a−x)=−f(x)
</div>
<p>P5 reflects the interval about its own midpoint — replacing x with a+b−x inside f leaves the integral's value unchanged. This becomes an extremely powerful trick (explored further in the next section) whenever adding f(x) and f(a+b−x) together produces something dramatically simpler than either piece alone. P6 and P7 are essentially P5 and P3 combined, specialized to an interval starting at 0.</p>
<div class="worked"><div class="label">Quick illustration of P4</div>Is f(x)=x³+x an odd function? Check: f(−x)=(−x)³+(−x)=−x³−x=−(x³+x)=−f(x). Yes, odd. So ∫[−7,7](x³+x)dx = 0 immediately, without any actual integration.</div>
`,
questions:[
{q:'What does Property P1 state about the variable used inside a definite integral?', options:['The variable must always be named x','The variable of integration is just a dummy label — ∫[a,b]f(x)dx and ∫[a,b]f(t)dt give exactly the same numerical value','Changing the variable name changes the value of the integral','P1 only applies to polynomial integrands'], correct:1, exp:'Since the integration variable disappears entirely once the limits are substituted into the antiderivative, its name (x, t, or anything else) has no bearing on the final numerical answer — this is exactly what P1 formalizes.'},
{q:'What does Property P2 state?', options:['∫[a,b]f(x)dx = ∫[b,a]f(x)dx, with no change of sign','∫[a,b]f(x)dx = −∫[b,a]f(x)dx — swapping the limits of integration flips the sign of the result','Swapping limits always gives zero','P2 only applies when a=b'], correct:1, exp:'Reversing the direction of integration (traversing from b down to a instead of a up to b) negates the value: ∫[a,b]f(x)dx = −∫[b,a]f(x)dx. This follows directly from the Fundamental Theorem, since F(b)−F(a) = −[F(a)−F(b)].'},
{q:'What does Property P3 allow you to do?', options:['Combine two separate functions into one integral','Split one integral over [a,b] into a sum of integrals over adjoining sub-intervals, ∫[a,c]f(x)dx + ∫[c,b]f(x)dx, for any interior point c between a and b','Multiply two integrals together','Convert a definite integral into an indefinite one'], correct:1, exp:'P3 says the integral over the whole interval [a,b] equals the sum of the integrals over any two (or more) adjoining sub-intervals that together make up [a,b]. This is indispensable whenever the integrand\'s formula changes partway through the interval, such as with piecewise functions or absolute-value expressions.'},
{q:'According to Property P4, what is ∫[−a,a] f(x)dx if f is an odd function?', options:['2∫[0,a]f(x)dx','0','∫[0,a]f(x)dx','f(a) − f(−a)'], correct:1, exp:'For an odd function (f(−x)=−f(x)), the contributions from the negative half of the interval exactly cancel the contributions from the positive half, making the total integral over the symmetric interval [−a,a] exactly zero — with no actual integration computation required, once oddness is confirmed.'},
{q:'According to Property P4, what is ∫[−a,a] f(x)dx if f is an even function?', options:['0','2∫[0,a]f(x)dx','∫[0,a]f(x)dx','f(a) + f(−a)'], correct:1, exp:'For an even function (f(−x)=f(x)), the two halves of the symmetric interval contribute equally rather than cancelling, so the total equals twice the integral over just the positive half: 2∫[0,a]f(x)dx. This lets you cut the actual computation work in half.'},
{q:'Is f(x)=x³+x an odd or even function, and what does this immediately tell you about ∫[−7 to 7](x³+x)dx?', options:['Even; the integral equals 2∫[0,7](x³+x)dx','Odd; the integral equals 0 immediately, by Property P4, without needing to actually integrate','Neither; the integral must be computed directly','Odd; the integral equals 2∫[0,7](x³+x)dx'], correct:1, exp:'f(−x)=(−x)³+(−x)=−x³−x=−(x³+x)=−f(x), confirming f is odd. By P4, the integral of an odd function over a symmetric interval like [−7,7] is exactly 0 — this can be stated immediately, without performing any actual integration.'},
{q:'Is g(x)=x⁴+3x² an odd or even function, and what does Property P4 say about ∫[−4 to 4] g(x)dx?', options:['Odd; the integral equals 0','Even; the integral equals 2∫[0,4](x⁴+3x²)dx, cutting the computation in half','Neither; must be computed directly with no shortcut','Even; the integral equals 0'], correct:1, exp:'g(−x)=(−x)⁴+3(−x)²=x⁴+3x²=g(x), confirming g is even. By P4, ∫[−4,4]g(x)dx = 2∫[0,4]g(x)dx — the symmetric-interval integral reduces to twice the integral over just the positive half, saving computation.'},
{q:'What does Property P5 state, in its general form?', options:['∫[a,b]f(x)dx = ∫[a,b]f(a+b−x)dx — replacing x with (a+b−x) inside the integrand leaves the value of the integral unchanged','∫[a,b]f(x)dx always equals zero','P5 only applies to odd functions','∫[a,b]f(x)dx = f(a+b) for any function f'], correct:0, exp:'P5 reflects the integration variable about the midpoint of the interval: substituting x → a+b−x inside f does not change the overall value of the integral. This becomes a powerful trick when f(x) and f(a+b−x), added together, simplify dramatically — a technique explored further in the next section.'},
{q:'According to Property P7, what is ∫[0,2a] f(x)dx if f(2a−x) = −f(x) for all x?', options:['2∫[0,a]f(x)dx','0','∫[0,a]f(x)dx','It cannot be determined'], correct:1, exp:'P7 states that when f(2a−x)=−f(x) (a kind of "anti-symmetry" about the midpoint a), the two halves of [0,2a] contribute equal and opposite amounts, cancelling entirely to give 0 — analogous to the odd-function case in P4, but centered at x=a instead of x=0.'},
